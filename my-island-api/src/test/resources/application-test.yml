spring:
  datasource:
    # Will be overridden by Testcontainers
    url: jdbc:tc:postgresql:17:///testdb
    username: test
    password: test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

jwt:
  secret: test-jwt-secret-key-that-is-at-least-256-bits-long-for-testing
  expiration: 86400000

logging:
  level:
    com.myisland: DEBUG
    org.testcontainers: INFO
