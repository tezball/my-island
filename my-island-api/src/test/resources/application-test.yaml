spring:
  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: my-island-api-test
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.example.myislandapi.event
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

jwt:
  secret: test-secret-key-for-testing-purposes-only-min-256-bits-required
  expiration: 86400000
  refresh-expiration: 2592000000

aws:
  region: eu-west-1
  endpoint: http://localhost:4566
  s3:
    bucket: test-bucket
  ses:
    from-email: test@myisland.local

logging:
  level:
    root: WARN
    com.example.myislandapi: DEBUG
