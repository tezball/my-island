server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: my-island-api

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/myisland}
    username: ${SPRING_DATASOURCE_USERNAME:myisland}
    password: ${SPRING_DATASOURCE_PASSWORD:myisland_dev_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:false}

jwt:
  secret: ${JWT_SECRET:myisland-dev-jwt-secret-key-that-is-at-least-256-bits-long}
  expiration: 86400000

stripe:
  api-key: ${STRIPE_API_KEY:sk_test_placeholder}
  publishable-key: ${STRIPE_PUBLISHABLE_KEY:pk_test_placeholder}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_placeholder}
  supplier-price-id: ${STRIPE_SUPPLIER_PRICE_ID:price_supplier_placeholder}
  owner-price-id: ${STRIPE_OWNER_PRICE_ID:price_owner_placeholder}
  supplier-success-url: ${STRIPE_SUPPLIER_SUCCESS_URL:http://localhost:5173/supplier?subscription=success}
  supplier-cancel-url: ${STRIPE_SUPPLIER_CANCEL_URL:http://localhost:5173/supplier?subscription=canceled}
  owner-success-url: ${STRIPE_OWNER_SUCCESS_URL:http://localhost:5173/owner?subscription=success}
  owner-cancel-url: ${STRIPE_OWNER_CANCEL_URL:http://localhost:5173/owner?subscription=canceled}
  booking-success-url: ${STRIPE_BOOKING_SUCCESS_URL:http://localhost:5173/trips?payment=success}
  booking-cancel-url: ${STRIPE_BOOKING_CANCEL_URL:http://localhost:5173/trips?payment=cancelled}
  service-fee-percent: ${STRIPE_SERVICE_FEE_PERCENT:0.10}
  dev-mode: ${STRIPE_DEV_MODE:true}

aws:
  s3:
    endpoint: ${AWS_S3_ENDPOINT:}
    bucket: ${AWS_S3_BUCKET:myisland-images}
  region: ${AWS_REGION:eu-west-1}
  access-key-id: ${AWS_ACCESS_KEY_ID:test}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY:test}

myisland:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  email:
    from: ${EMAIL_FROM:noreply@myisland.ie}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

---
spring:
  config:
    activate:
      on-profile: dev

  jpa:
    show-sql: true

logging:
  level:
    com.myisland: DEBUG
    org.springframework.security: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod

  jpa:
    show-sql: false

logging:
  level:
    com.myisland: INFO
