spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/myisland
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: always

server:
  port: 8080

jwt:
  secret: myisland-super-secret-key-that-is-at-least-256-bits-long-for-hs256
  expiration: 86400000

logging:
  level:
    com.myisland: DEBUG
    org.springframework.security: DEBUG
