<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Verify Your Email</title>
</head>
<body style="font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; padding: 0; background-color: #f6f7f8;">
    <div style="max-width: 600px; margin: 0 auto; padding: 40px 20px;">
        <div style="background: white; border-radius: 16px; padding: 40px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
            <div style="text-align: center; margin-bottom: 30px;">
                <h1 style="color: #059669; margin: 0; font-size: 28px;">My Island</h1>
            </div>

            <p style="color: #111418; font-size: 16px; line-height: 1.6;">
                Hi <span th:text="${userName}">Guest</span>,
            </p>

            <p style="color: #4b5563; font-size: 16px; line-height: 1.6;">
                Thanks for signing up! Please verify your email address by clicking the button below.
            </p>

            <div style="text-align: center; margin: 30px 0;">
                <a th:href="${verifyLink}" style="display: inline-block; background: #059669; color: white; padding: 14px 28px; text-decoration: none; border-radius: 8px; font-weight: bold;">
                    Verify Email
                </a>
            </div>

            <p style="color: #4b5563; font-size: 14px; line-height: 1.6;">
                This link will expire in <strong>24 hours</strong>. If you didn't create an account, you can safely ignore this email.
            </p>

            <p style="color: #6b7280; font-size: 14px; text-align: center; margin-top: 30px; padding-top: 20px; border-top: 1px solid #e5e7eb;">
                The My Island Team
            </p>
        </div>
    </div>
</body>
</html>
