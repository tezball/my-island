<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New Booking Request</title>
</head>
<body style="font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; padding: 0; background-color: #f6f7f8;">
    <div style="max-width: 600px; margin: 0 auto; padding: 40px 20px;">
        <div style="background: white; border-radius: 16px; padding: 40px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
            <div style="text-align: center; margin-bottom: 30px;">
                <h1 style="color: #059669; margin: 0; font-size: 24px;">New Booking Request</h1>
            </div>

            <p style="color: #111418; font-size: 16px; line-height: 1.6;">
                Great news! You have a new booking request.
            </p>

            <div style="background: #f9fafb; border-radius: 12px; padding: 20px; margin: 20px 0;">
                <h3 style="color: #111418; margin: 0 0 15px 0; font-size: 18px;" th:text="${lotName}">Riverside Pitch</h3>

                <table style="width: 100%; border-collapse: collapse;">
                    <tr>
                        <td style="padding: 8px 0; color: #6b7280;">Guest</td>
                        <td style="padding: 8px 0; color: #111418; text-align: right; font-weight: 500;" th:text="${guestName}">John Murphy</td>
                    </tr>
                    <tr>
                        <td style="padding: 8px 0; color: #6b7280;">Check-in</td>
                        <td style="padding: 8px 0; color: #111418; text-align: right; font-weight: 500;" th:text="${#temporals.format(checkInDate, 'dd MMM yyyy')}">15 Mar 2026</td>
                    </tr>
                    <tr>
                        <td style="padding: 8px 0; color: #6b7280;">Check-out</td>
                        <td style="padding: 8px 0; color: #111418; text-align: right; font-weight: 500;" th:text="${#temporals.format(checkOutDate, 'dd MMM yyyy')}">18 Mar 2026</td>
                    </tr>
                    <tr>
                        <td style="padding: 8px 0; color: #6b7280;">Guests</td>
                        <td style="padding: 8px 0; color: #111418; text-align: right; font-weight: 500;" th:text="${numGuests}">2</td>
                    </tr>
                    <tr style="border-top: 1px solid #e5e7eb;">
                        <td style="padding: 12px 0 0 0; color: #111418; font-weight: 600;">Total</td>
                        <td style="padding: 12px 0 0 0; color: #059669; text-align: right; font-weight: 700; font-size: 18px;" th:text="'€' + ${#numbers.formatDecimal(totalPrice, 1, 2)}">€150.00</td>
                    </tr>
                </table>
            </div>

            <p style="color: #4b5563; font-size: 14px; line-height: 1.6;">
                The guest's payment has been authorized. Please review and confirm this booking in your dashboard.
            </p>

            <div style="text-align: center; margin: 30px 0;">
                <a href="https://myisland.ie/owner/bookings" style="display: inline-block; background: #059669; color: white; padding: 14px 28px; text-decoration: none; border-radius: 8px; font-weight: bold;">
                    View Booking
                </a>
            </div>

            <p style="color: #6b7280; font-size: 12px; text-align: center; margin-top: 30px; padding-top: 20px; border-top: 1px solid #e5e7eb;">
                Booking ID: #<span th:text="${bookingId}">123</span>
            </p>
        </div>
    </div>
</body>
</html>
