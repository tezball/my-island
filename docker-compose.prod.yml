services:
  postgres:
    image: postgres:17-alpine
    container_name: myisland-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-myisland}
      POSTGRES_USER: ${POSTGRES_USER:-myisland}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-myisland} -d ${POSTGRES_DB:-myisland}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./my-island-api
      dockerfile: Dockerfile
    container_name: myisland-prod-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-myisland}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-myisland}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      UPLOAD_DIR: /app/uploads
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@myisland.ie}
      MAIL_HOST: ${MAIL_HOST:-localhost}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_STARTTLS_ENABLE: ${MAIL_STARTTLS_ENABLE:-true}
      STRIPE_API_KEY: ${STRIPE_API_KEY:-sk_test_placeholder}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-pk_test_placeholder}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_placeholder}
      STRIPE_SUPPLIER_PRICE_ID: ${STRIPE_SUPPLIER_PRICE_ID:-price_supplier_placeholder}
      STRIPE_OWNER_PRICE_ID: ${STRIPE_OWNER_PRICE_ID:-price_owner_placeholder}
      STRIPE_SUPPLIER_SUCCESS_URL: ${STRIPE_SUPPLIER_SUCCESS_URL:-http://localhost/supplier?subscription=success}
      STRIPE_SUPPLIER_CANCEL_URL: ${STRIPE_SUPPLIER_CANCEL_URL:-http://localhost/supplier?subscription=canceled}
      STRIPE_OWNER_SUCCESS_URL: ${STRIPE_OWNER_SUCCESS_URL:-http://localhost/owner?subscription=success}
      STRIPE_OWNER_CANCEL_URL: ${STRIPE_OWNER_CANCEL_URL:-http://localhost/owner?subscription=canceled}
      STRIPE_BOOKING_SUCCESS_URL: ${STRIPE_BOOKING_SUCCESS_URL:-http://localhost/trips?payment=success}
      STRIPE_BOOKING_CANCEL_URL: ${STRIPE_BOOKING_CANCEL_URL:-http://localhost/trips?payment=cancelled}
      STRIPE_DEV_MODE: "false"
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  ollama:
    image: ollama/ollama
    container_name: myisland-prod-ollama
    profiles:
      - ai
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  ollama-pull:
    image: ollama/ollama
    container_name: myisland-prod-ollama-pull
    profiles:
      - ai
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["ollama", "pull", "llama3.2"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    restart: "no"

  moderator:
    build:
      context: ./my-island-moderator
      dockerfile: Dockerfile
    container_name: myisland-prod-moderator
    profiles:
      - ai
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-myisland}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-myisland}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      OLLAMA_BASE_URL: http://ollama:11434

  web:
    build:
      context: ./my-island-web
      dockerfile: Dockerfile
    container_name: myisland-prod-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:80"

volumes:
  postgres_data:
  uploads_data:
  ollama_data:
