spring:
  application:
    name: my-island-cli
  main:
    banner-mode: off
  shell:
    interactive:
      enabled: true
    noninteractive:
      enabled: true
    command:
      version:
        enabled: true

# CLI Configuration
myisland:
  docker:
    postgres-image: postgres:15-alpine
    container-name: my-island-postgres
    volume-name: my-island-pgdata
    port: 5432
    database: myisland
    username: postgres
    password: postgres
  api:
    port: 8080
    health-endpoint: http://localhost:8080/actuator/health
  frontend:
    port: 5173
    health-endpoint: http://localhost:5173

logging:
  level:
    root: WARN
    com.myisland.cli: INFO
  pattern:
    console: "%msg%n"
