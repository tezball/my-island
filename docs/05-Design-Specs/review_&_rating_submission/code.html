<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Review &amp; Rating Submission</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#19e65e",
                        "background-light": "#ffffff",
                        "background-dark": "#112116",
                        "surface-light": "#f6f8f6",
                        "surface-dark": "#1e2e23",
                        "text-main": "#111813",
                        "text-muted": "#63886f",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" },
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar hiding for clean UI */
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        /* Material Symbols Customization */
        .material-symbols-outlined {
            font-variation-settings:
            'FILL' 0,
            'wght' 400,
            'GRAD' 0,
            'opsz' 24
        }
        .material-symbols-outlined.filled {
            font-variation-settings:
            'FILL' 1,
            'wght' 400,
            'GRAD' 0,
            'opsz' 24
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-text-main dark:text-white font-display antialiased overflow-x-hidden">
<div class="relative flex h-full min-h-screen w-full flex-col max-w-md mx-auto shadow-sm bg-background-light dark:bg-background-dark pb-24">
<!-- Top App Bar -->
<header class="sticky top-0 z-50 flex items-center bg-background-light/95 dark:bg-background-dark/95 backdrop-blur-sm p-4 justify-between border-b border-gray-100 dark:border-gray-800">
<button class="flex size-10 shrink-0 items-center justify-center rounded-full hover:bg-surface-light dark:hover:bg-surface-dark transition-colors text-text-main dark:text-white">
<span class="material-symbols-outlined">close</span>
</button>
<h1 class="text-text-main dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center">Write a Review</h1>
<div class="size-10"></div> <!-- Spacer for centering -->
</header>
<!-- Campsite Info Snippet -->
<div class="px-4 py-6 flex items-center gap-4">
<div class="size-16 rounded-2xl bg-gray-200 overflow-hidden shrink-0 shadow-sm relative group">
<img alt="Scenic view of campsite with tents among trees" class="w-full h-full object-cover" data-alt="Scenic view of campsite with tents among trees" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC5HX2mWmul6C7auaLyT5qVZFXufwERsLF_4nrMD53WwX2eXj1xKOwrCWY2FupXoQ5fjGzCgKbrR5r598UOyzBSTNOEDVUnCFEeqnuigoskcW5VwNahQ05NmIan50RGRelag-2v7Ze4I_3iuyT9dUCDRzai1kcWop-i2TeMRGL7JekwpHXJGkojRJ1hfxkTlj3x-kHUsSK_2Cff4fKWVUgkEYwNErCSRTMFUPZ5jeo5wu8LyUJ3bWxPHxZ5bNwI35Zajtw8KWsfFw"/>
</div>
<div>
<p class="text-sm text-text-muted dark:text-gray-400 font-medium mb-0.5">Rating</p>
<h2 class="text-xl font-bold text-text-main dark:text-white leading-tight">Emerald Bay Camp</h2>
</div>
</div>
<!-- Rating Section -->
<section class="flex flex-col items-center justify-center px-4 py-4">
<h3 class="text-text-main dark:text-white text-2xl font-bold leading-tight text-center mb-4">How was your stay?</h3>
<div class="flex gap-3">
<button class="group p-2 transition-transform active:scale-95">
<span class="material-symbols-outlined text-[32px] text-primary filled">star</span>
</button>
<button class="group p-2 transition-transform active:scale-95">
<span class="material-symbols-outlined text-[32px] text-primary filled">star</span>
</button>
<button class="group p-2 transition-transform active:scale-95">
<span class="material-symbols-outlined text-[32px] text-primary filled">star</span>
</button>
<button class="group p-2 transition-transform active:scale-95">
<span class="material-symbols-outlined text-[32px] text-primary filled">star</span>
</button>
<button class="group p-2 transition-transform active:scale-95">
<span class="material-symbols-outlined text-[32px] text-gray-300 dark:text-gray-600 group-hover:text-primary transition-colors">star</span>
</button>
</div>
<p class="mt-2 text-primary font-medium text-sm">Very Good</p>
</section>
<div class="h-px bg-gray-100 dark:bg-gray-800 mx-4 my-4"></div>
<!-- Review Text Area -->
<section class="px-4 py-2">
<label class="block relative">
<textarea class="w-full min-h-[160px] rounded-3xl bg-surface-light dark:bg-surface-dark border-0 p-5 text-base text-text-main dark:text-white placeholder:text-text-muted focus:ring-2 focus:ring-primary/50 resize-none transition-shadow" placeholder="Share your experience about this campsite... Was it quiet? How were the facilities?"></textarea>
</label>
</section>
<!-- Tags / Highlights -->
<section class="px-4 py-4">
<h3 class="text-text-main dark:text-white text-lg font-bold mb-4 px-1">What stood out?</h3>
<div class="flex flex-wrap gap-2.5">
<!-- Active Tag -->
<button class="flex items-center gap-2 px-4 py-2 rounded-full bg-primary text-white font-medium text-sm shadow-sm shadow-primary/30 transition-all hover:brightness-105 active:scale-95">
<span class="material-symbols-outlined text-[18px]">visibility</span>
                    Great Views
                </button>
<!-- Inactive Tags -->
<button class="flex items-center gap-2 px-4 py-2 rounded-full bg-surface-light dark:bg-surface-dark border border-transparent hover:border-primary/30 text-text-main dark:text-gray-300 font-medium text-sm transition-all active:scale-95">
<span class="material-symbols-outlined text-[18px]">family_restroom</span>
                    Family-Friendly
                </button>
<button class="flex items-center gap-2 px-4 py-2 rounded-full bg-surface-light dark:bg-surface-dark border border-transparent hover:border-primary/30 text-text-main dark:text-gray-300 font-medium text-sm transition-all active:scale-95">
<span class="material-symbols-outlined text-[18px]">water_drop</span>
                    Clean Water
                </button>
<button class="flex items-center gap-2 px-4 py-2 rounded-full bg-surface-light dark:bg-surface-dark border border-transparent hover:border-primary/30 text-text-main dark:text-gray-300 font-medium text-sm transition-all active:scale-95">
<span class="material-symbols-outlined text-[18px]">volume_off</span>
                    Quiet Area
                </button>
<button class="flex items-center gap-2 px-4 py-2 rounded-full bg-surface-light dark:bg-surface-dark border border-transparent hover:border-primary/30 text-text-main dark:text-gray-300 font-medium text-sm transition-all active:scale-95">
<span class="material-symbols-outlined text-[18px]">wifi</span>
                    Good Signal
                </button>
</div>
</section>
<!-- Photo Upload -->
<section class="px-4 py-4 mb-4">
<div class="flex items-center justify-between mb-4 px-1">
<h3 class="text-text-main dark:text-white text-lg font-bold">Add Photos</h3>
<span class="text-sm text-text-muted">Optional</span>
</div>
<div class="flex gap-3 overflow-x-auto scrollbar-hide pb-2">
<!-- Add Button -->
<button class="flex flex-col items-center justify-center size-24 shrink-0 rounded-2xl border-2 border-dashed border-primary/40 bg-primary/5 hover:bg-primary/10 transition-colors group">
<div class="flex items-center justify-center size-8 rounded-full bg-primary/20 text-primary mb-1 group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-[20px]">add_a_photo</span>
</div>
<span class="text-xs font-semibold text-primary">Add New</span>
</button>
<!-- Uploaded Thumbnail 1 -->
<div class="relative size-24 shrink-0 group rounded-2xl overflow-hidden shadow-sm">
<img alt="Tent lit up at night under starry sky" class="w-full h-full object-cover" data-alt="Tent lit up at night under starry sky" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD5VZAsmUFbBnUCh-j8CYZa-IT1yMgsUOMZg3N0xst0GrS7GdPD4K5iSTtnqUmPG4sirwxNhd3Z0-FFrgErNlO5E8WM2N3K6XOtFGBi4insxUymOblK10nlzSvwXVY20nFRvhZFXPnLfla-scmXMYMrhqnuK30ZHvvccIcjxWIvuwz4QpQ-MtHD9_jy7bO7neQSbfwVqqhuJxOAZ2GiGjXNjgmTHuKGT11EqqclsImW4PLkWFzPpmBm6hbksdM49gizNddHzuxp-g"/>
<button class="absolute top-1 right-1 size-6 bg-black/50 backdrop-blur-md rounded-full flex items-center justify-center text-white hover:bg-red-500 transition-colors">
<span class="material-symbols-outlined text-[14px]">close</span>
</button>
</div>
<!-- Uploaded Thumbnail 2 -->
<div class="relative size-24 shrink-0 group rounded-2xl overflow-hidden shadow-sm">
<img alt="Campfire burning brightly in the evening" class="w-full h-full object-cover" data-alt="Campfire burning brightly in the evening" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAFjT25Z_pypoiCq3ilxrmaeQpLbMzpLUlYC0SGWovgNIZAnq3eFuGayCKMZ2PLzydwCQVFNbf3olaLAHGNpyRZ0OgEOVCKM5ZF_JN2QRLbsbjlNi5mWxqSWnuEtJzpUEdIEou4vQs5HiyrUJTB4eWm0Wll99JTwLwsbCXYEa3Hq9eLb7Xab28LsUjjJp3KqxhNV4Eknj8ZhNjLMjKKN0-q4sNFOecSgjDS7ul-P9_O01ZK_GZdRazs6piWc2XYu0mFZZ75ly7U2g"/>
<button class="absolute top-1 right-1 size-6 bg-black/50 backdrop-blur-md rounded-full flex items-center justify-center text-white hover:bg-red-500 transition-colors">
<span class="material-symbols-outlined text-[14px]">close</span>
</button>
</div>
</div>
</section>
<!-- Sticky Bottom Action Bar -->
<div class="fixed bottom-0 left-0 right-0 p-4 bg-background-light/95 dark:bg-background-dark/95 backdrop-blur-md border-t border-gray-100 dark:border-gray-800 max-w-md mx-auto">
<button class="w-full flex items-center justify-center gap-2 bg-primary hover:bg-primary/90 text-white font-bold text-lg h-14 rounded-full shadow-lg shadow-primary/25 transition-all active:scale-[0.98]">
<span>Submit Review</span>
<span class="material-symbols-outlined">send</span>
</button>
</div>
</div>
</body></html>
