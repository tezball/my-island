<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Booking Confirmation</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec80",
                        "background-light": "#f6f8f7",
                        "background-dark": "#102219",
                        "surface-light": "#ffffff",
                        "surface-dark": "#182d24",
                        "text-main": "#0d1b14",
                        "text-muted": "#4c9a73",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                    boxShadow: {
                        "soft": "0 4px 20px -2px rgba(19, 236, 128, 0.1)",
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        
        /* Custom Ticket edge effect */
        .ticket-edge::before, .ticket-edge::after {
            content: '';
            position: absolute;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            top: 50%;
            transform: translateY(-50%);
            /* Matches background color */
            background-color: #f6f8f7; 
        }
        
        .dark .ticket-edge::before, .dark .ticket-edge::after {
            background-color: #102219;
        }

        .ticket-edge::before { left: -12px; }
        .ticket-edge::after { right: -12px; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex flex-col font-display text-text-main dark:text-white overflow-x-hidden selection:bg-primary selection:text-background-dark">
<!-- Top Navigation -->
<header class="flex items-center justify-between p-4 sticky top-0 z-20 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md">
<div class="w-12"></div> <!-- Spacer -->
<h2 class="text-lg font-bold tracking-tight">Confirmation</h2>
<div class="w-12 flex justify-end">
<button class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined text-[24px]">close</span>
</button>
</div>
</header>
<!-- Main Content Scrollable Area -->
<main class="flex-1 w-full max-w-md mx-auto px-5 pb-8 flex flex-col gap-6">
<!-- Hero / Success Message -->
<section class="flex flex-col items-center gap-5 pt-4 text-center">
<div class="relative group cursor-default">
<div class="absolute inset-0 bg-primary/30 blur-xl rounded-full opacity-50 group-hover:opacity-70 transition-opacity duration-500"></div>
<div class="relative rounded-full bg-surface-light dark:bg-surface-dark p-1 shadow-soft">
<span class="material-symbols-outlined text-primary text-[80px]">check_circle</span>
</div>
</div>
<div class="flex flex-col gap-2 max-w-[320px]">
<h1 class="text-2xl font-bold leading-tight">Success!</h1>
<p class="text-text-muted dark:text-gray-400 text-sm font-normal leading-relaxed">
                    Your island adventure awaits. We have sent a confirmation email to you.
                </p>
</div>
</section>
<!-- Booking Reference Ticket -->
<section class="ticket-edge relative w-full bg-surface-light dark:bg-surface-dark rounded-xl p-5 shadow-sm border border-black/5 dark:border-white/5 flex items-center justify-between">
<div class="flex flex-col gap-1 pl-2">
<span class="text-xs font-semibold text-primary uppercase tracking-wider">Booking Reference</span>
<span class="text-xl font-bold font-mono text-text-main dark:text-white tracking-tight">#ISL-8821</span>
</div>
<button aria-label="Copy Reference" class="pr-2 text-gray-400 hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">content_copy</span>
</button>
</section>
<!-- Summary Card -->
<section class="w-full bg-surface-light dark:bg-surface-dark rounded-2xl shadow-sm border border-black/5 dark:border-white/5 overflow-hidden">
<div class="p-4 flex gap-4">
<div class="w-24 h-24 rounded-lg bg-gray-200 dark:bg-gray-800 bg-cover bg-center shrink-0 shadow-inner" data-alt="A cozy camping tent at sunset near the ocean" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuAWPX0w4i9KzmVL0Iin6EJfSqmyEzGSlMpxqwf8fSOhfL43LcPR3ULHKsvyb8qQAZh1cQ8UR9Ru7_zX3n-yrpgKKzsBWT6TNne1qpFGGa7qPkqXfrUfeBVEB6MjEdxoQjrnhW8Os2IfOa_CFEElyybEeO3fSv3xTUIdO2m-8iX9Ls4X4Dj5vX5P4vEV3FLjJrmE66kd1ko9XWdSSdY84DaOgeSRvrqtnttCK494PNSHDarw0pfU_4YCAXnf-MZwrKQngkd8Xppgsw");'>
</div>
<div class="flex flex-col justify-center flex-1 gap-1">
<h3 class="text-base font-bold leading-tight">Sunset Bay Camp</h3>
<p class="text-text-muted dark:text-gray-400 text-sm font-medium">Pitch 4, Ocean View</p>
<div class="mt-2 flex items-center gap-1">
<span class="material-symbols-outlined text-[16px] text-amber-400">star</span>
<span class="text-xs font-semibold">4.9</span>
<span class="text-xs text-gray-400">(128)</span>
</div>
</div>
</div>
<!-- Divider -->
<div class="h-px w-full bg-gray-100 dark:bg-white/5 mx-auto"></div>
<!-- Details Grid -->
<div class="grid grid-cols-2 p-4 gap-4">
<div class="flex flex-col gap-1">
<div class="flex items-center gap-2 text-gray-400 dark:text-gray-500">
<span class="material-symbols-outlined text-[18px]">calendar_month</span>
<span class="text-xs font-medium uppercase tracking-wide">Dates</span>
</div>
<p class="text-sm font-semibold pl-[26px]">Oct 12 - Oct 14</p>
</div>
<div class="flex flex-col gap-1">
<div class="flex items-center gap-2 text-gray-400 dark:text-gray-500">
<span class="material-symbols-outlined text-[18px]">group</span>
<span class="text-xs font-medium uppercase tracking-wide">Guests</span>
</div>
<p class="text-sm font-semibold pl-[26px]">2 Adults, 1 Child</p>
</div>
</div>
</section>
<!-- Quick Actions -->
<div class="grid grid-cols-2 gap-3">
<button class="flex flex-col items-center gap-2 bg-surface-light dark:bg-surface-dark p-3 rounded-xl border border-transparent hover:border-primary/20 hover:shadow-soft transition-all group">
<div class="rounded-full bg-primary/10 dark:bg-primary/20 p-2 text-primary group-hover:bg-primary group-hover:text-background-dark transition-colors">
<span class="material-symbols-outlined text-[20px]">calendar_add_on</span>
</div>
<span class="text-xs font-semibold">Add to Calendar</span>
</button>
<button class="flex flex-col items-center gap-2 bg-surface-light dark:bg-surface-dark p-3 rounded-xl border border-transparent hover:border-primary/20 hover:shadow-soft transition-all group">
<div class="rounded-full bg-primary/10 dark:bg-primary/20 p-2 text-primary group-hover:bg-primary group-hover:text-background-dark transition-colors">
<span class="material-symbols-outlined text-[20px]">ios_share</span>
</div>
<span class="text-xs font-semibold">Share Booking</span>
</button>
</div>
</main>
<!-- Bottom Actions -->
<footer class="p-4 bg-background-light dark:bg-background-dark border-t border-transparent sticky bottom-0 z-30">
<div class="w-full max-w-md mx-auto flex flex-col gap-3">
<button class="w-full h-12 rounded-xl bg-primary hover:bg-[#0fd671] active:scale-[0.98] transition-all text-background-dark font-bold text-base shadow-lg shadow-primary/20 flex items-center justify-center gap-2">
<span>View My Bookings</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
<button class="w-full h-12 rounded-xl border border-transparent hover:bg-black/5 dark:hover:bg-white/5 active:scale-[0.98] transition-all text-text-main dark:text-white font-semibold text-base flex items-center justify-center">
                Return to Home
            </button>
</div>
</footer>
</body></html>
