<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Edit Lot Details - My Island</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec80",
                        "primary-dark": "#0eb562",
                        "background-light": "#f6f8f7",
                        "background-dark": "#102219",
                        "surface-light": "#ffffff",
                        "surface-dark": "#1a3326",
                        "text-main-light": "#111814",
                        "text-main-dark": "#e0e7e3",
                        "text-sub-light": "#618975",
                        "text-sub-dark": "#8fa89b",
                        "border-light": "#dbe6e0",
                        "border-dark": "#2a4235",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-text-main-light dark:text-text-main-dark transition-colors duration-200">
<div class="relative flex h-auto min-h-screen w-full flex-col max-w-md mx-auto bg-background-light dark:bg-background-dark overflow-x-hidden shadow-2xl">
<!-- Header -->
<header class="sticky top-0 z-50 flex items-center justify-between bg-surface-light/95 dark:bg-surface-dark/95 backdrop-blur-sm p-4 border-b border-border-light dark:border-border-dark transition-colors">
<button class="flex items-center text-text-sub-light dark:text-text-sub-dark hover:text-text-main-light dark:hover:text-text-main-dark transition-colors">
<span class="text-base font-medium">Cancel</span>
</button>
<h2 class="text-lg font-bold leading-tight tracking-[-0.015em] absolute left-1/2 -translate-x-1/2">Edit Lot Details</h2>
<button class="flex items-center justify-end">
<p class="text-primary dark:text-primary font-bold text-base hover:text-primary-dark transition-colors">Save</p>
</button>
</header>
<!-- Main Content -->
<main class="flex-1 p-4 flex flex-col gap-6 pb-32">
<!-- Lot Identification Card -->
<div class="flex items-stretch justify-between gap-4 rounded-xl bg-surface-light dark:bg-surface-dark p-4 shadow-sm border border-border-light dark:border-border-dark">
<div class="flex flex-col justify-center gap-1 flex-[2_2_0px]">
<p class="text-text-main-light dark:text-text-main-dark text-lg font-bold leading-tight">Lot A-12</p>
<p class="text-text-sub-light dark:text-text-sub-dark text-sm font-medium">Riverside Glamping Spot</p>
<div class="flex items-center gap-1 mt-2">
<span class="inline-flex items-center rounded-full bg-primary/10 px-2 py-0.5 text-xs font-medium text-primary-dark dark:text-primary ring-1 ring-inset ring-primary/20">
                            Active
                        </span>
</div>
</div>
<div class="w-24 h-24 bg-center bg-no-repeat bg-cover rounded-xl flex-shrink-0" data-alt="Sunny campsite spot by river" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuC3GpIGrHd5QD9vvcnrHmHtKzMMQsyTZKxlD48bZkV74kriWnxo-MBLeZzoLYHdyevdLYuihm_v9P6ZPxgk2tr6NQ7Iaf8v4BivMZks9Yq_WyfeX2G8BlIppFvlNoIthmstcQdMEh1rDDMvwaZig_bB1pccuZ5DxyOX5RbHT6Kg24a_gbY8v4g7D6DbYOjZ75qvbFpdOvPE1k0FzghYDTlou4Md0_oqCAzSbl9jdqZ266K23bMiWNGIEta9LJo_u_4l_bQBJ4fQsA");'></div>
</div>
<!-- Basic Information Section -->
<div class="space-y-4">
<h3 class="text-text-main-light dark:text-text-main-dark text-lg font-bold leading-tight tracking-[-0.015em]">Basic Information</h3>
<!-- Lot Number Input -->
<div class="bg-surface-light dark:bg-surface-dark rounded-xl p-4 shadow-sm border border-border-light dark:border-border-dark space-y-4">
<label class="flex flex-col w-full">
<p class="text-text-main-light dark:text-text-main-dark text-sm font-medium leading-normal pb-2">Lot Number / Name</p>
<input class="w-full rounded-lg border border-border-light dark:border-border-dark bg-background-light dark:bg-background-dark text-text-main-light dark:text-text-main-dark placeholder:text-text-sub-light dark:placeholder:text-text-sub-dark focus:ring-2 focus:ring-primary focus:border-transparent h-12 px-4 transition-all outline-none" type="text" value="Lot A-12"/>
</label>
<!-- Lot Type Select -->
<label class="flex flex-col w-full relative">
<p class="text-text-main-light dark:text-text-main-dark text-sm font-medium leading-normal pb-2">Lot Type</p>
<div class="relative">
<select class="w-full appearance-none rounded-lg border border-border-light dark:border-border-dark bg-background-light dark:bg-background-dark text-text-main-light dark:text-text-main-dark focus:ring-2 focus:ring-primary focus:border-transparent h-12 px-4 pr-10 transition-all outline-none">
<option value="tent">Tent Site</option>
<option value="rv">RV Site</option>
<option selected="" value="glamping">Glamping Pod</option>
<option value="cabin">Cabin</option>
<option value="apartment">Apartment</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-text-sub-light dark:text-text-sub-dark">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</label>
<!-- Description -->
<label class="flex flex-col w-full">
<p class="text-text-main-light dark:text-text-main-dark text-sm font-medium leading-normal pb-2">Description</p>
<textarea class="w-full rounded-lg border border-border-light dark:border-border-dark bg-background-light dark:bg-background-dark text-text-main-light dark:text-text-main-dark placeholder:text-text-sub-light dark:placeholder:text-text-sub-dark focus:ring-2 focus:ring-primary focus:border-transparent min-h-[100px] p-4 resize-none transition-all outline-none">Beautiful riverside spot with morning sun and ample shade in the afternoon. Perfect for small families.</textarea>
</label>
</div>
</div>
<!-- Capacity & Settings Section -->
<div class="space-y-4">
<h3 class="text-text-main-light dark:text-text-main-dark text-lg font-bold leading-tight tracking-[-0.015em]">Capacity &amp; Settings</h3>
<div class="bg-surface-light dark:bg-surface-dark rounded-xl p-4 shadow-sm border border-border-light dark:border-border-dark divide-y divide-border-light dark:divide-border-dark">
<!-- Max Capacity Stepper -->
<div class="flex items-center justify-between py-2 pb-4">
<div class="flex flex-col">
<span class="text-text-main-light dark:text-text-main-dark font-medium">Max Capacity</span>
<span class="text-text-sub-light dark:text-text-sub-dark text-sm">Guests allowed</span>
</div>
<div class="flex items-center gap-3 bg-background-light dark:bg-background-dark rounded-lg p-1 border border-border-light dark:border-border-dark">
<button class="w-8 h-8 flex items-center justify-center rounded-md hover:bg-white dark:hover:bg-surface-dark text-text-sub-light dark:text-text-sub-dark transition-colors">
<span class="material-symbols-outlined text-lg">remove</span>
</button>
<span class="text-text-main-light dark:text-text-main-dark font-semibold w-4 text-center">4</span>
<button class="w-8 h-8 flex items-center justify-center rounded-md bg-white dark:bg-surface-dark shadow-sm text-primary dark:text-primary transition-colors">
<span class="material-symbols-outlined text-lg">add</span>
</button>
</div>
</div>
<!-- Availability Toggle -->
<div class="flex items-center justify-between py-2 pt-4">
<div class="flex flex-col">
<span class="text-text-main-light dark:text-text-main-dark font-medium">Availability Status</span>
<span class="text-text-sub-light dark:text-text-sub-dark text-sm">Visible for booking</span>
</div>
<!-- Toggle Switch -->
<button aria-checked="true" class="group relative inline-flex h-7 w-12 flex-shrink-0 cursor-pointer items-center justify-center rounded-full focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 bg-primary" role="switch" type="button">
<span class="sr-only">Use setting</span>
<span aria-hidden="true" class="pointer-events-none absolute h-full w-full rounded-md bg-white/0"></span>
<span aria-hidden="true" class="pointer-events-none absolute mx-auto h-5 w-10 rounded-full transition-colors duration-200 ease-in-out bg-primary"></span>
<span aria-hidden="true" class="pointer-events-none absolute left-0 inline-block h-5 w-5 transform rounded-full bg-white shadow ring-0 transition-transform duration-200 ease-in-out translate-x-6 mx-1"></span>
</button>
</div>
</div>
</div>
<!-- Amenities Section -->
<div class="space-y-4">
<h3 class="text-text-main-light dark:text-text-main-dark text-lg font-bold leading-tight tracking-[-0.015em]">Amenities Included</h3>
<div class="bg-surface-light dark:bg-surface-dark rounded-xl p-4 shadow-sm border border-border-light dark:border-border-dark">
<div class="flex flex-wrap gap-2">
<!-- Selected Chip -->
<button class="group flex items-center gap-2 rounded-full border border-primary bg-primary/10 px-4 py-2 text-sm font-semibold text-primary-dark dark:text-primary transition-all hover:bg-primary/20">
<span class="material-symbols-outlined text-[18px]">table_restaurant</span>
                            Picnic Table
                            <span class="material-symbols-outlined text-[16px]">check</span>
</button>
<!-- Selected Chip -->
<button class="group flex items-center gap-2 rounded-full border border-primary bg-primary/10 px-4 py-2 text-sm font-semibold text-primary-dark dark:text-primary transition-all hover:bg-primary/20">
<span class="material-symbols-outlined text-[18px]">local_fire_department</span>
                            Fire Pit
                            <span class="material-symbols-outlined text-[16px]">check</span>
</button>
<!-- Unselected Chip -->
<button class="group flex items-center gap-2 rounded-full border border-border-light dark:border-border-dark bg-background-light dark:bg-background-dark px-4 py-2 text-sm font-medium text-text-sub-light dark:text-text-sub-dark transition-all hover:border-primary/50 hover:text-text-main-light dark:hover:text-text-main-dark">
<span class="material-symbols-outlined text-[18px]">wifi</span>
                            WiFi
                        </button>
<!-- Unselected Chip -->
<button class="group flex items-center gap-2 rounded-full border border-border-light dark:border-border-dark bg-background-light dark:bg-background-dark px-4 py-2 text-sm font-medium text-text-sub-light dark:text-text-sub-dark transition-all hover:border-primary/50 hover:text-text-main-light dark:hover:text-text-main-dark">
<span class="material-symbols-outlined text-[18px]">water_drop</span>
                            Water Hookup
                        </button>
<!-- Unselected Chip -->
<button class="group flex items-center gap-2 rounded-full border border-border-light dark:border-border-dark bg-background-light dark:bg-background-dark px-4 py-2 text-sm font-medium text-text-sub-light dark:text-text-sub-dark transition-all hover:border-primary/50 hover:text-text-main-light dark:hover:text-text-main-dark">
<span class="material-symbols-outlined text-[18px]">electrical_services</span>
                            Electric
                        </button>
<!-- Unselected Chip -->
<button class="group flex items-center gap-2 rounded-full border border-border-light dark:border-border-dark bg-background-light dark:bg-background-dark px-4 py-2 text-sm font-medium text-text-sub-light dark:text-text-sub-dark transition-all hover:border-primary/50 hover:text-text-main-light dark:hover:text-text-main-dark">
<span class="material-symbols-outlined text-[18px]">pets</span>
                            Pet Friendly
                        </button>
</div>
<button class="mt-4 w-full py-2 text-sm font-medium text-primary dark:text-primary hover:underline flex items-center justify-center gap-1">
<span class="material-symbols-outlined text-[18px]">add</span>
                        Add Custom Amenity
                    </button>
</div>
</div>
<!-- Danger Zone -->
<div class="mt-4 pt-4 border-t border-border-light dark:border-border-dark">
<button class="w-full py-3 rounded-lg text-red-500 font-medium hover:bg-red-50 dark:hover:bg-red-900/20 transition-colors flex items-center justify-center gap-2">
<span class="material-symbols-outlined">delete</span>
                    Delete Lot
                </button>
</div>
</main>
<!-- Fixed Bottom Action Bar (Optional, mirroring header save for easier reach on mobile) -->
<div class="fixed bottom-0 left-0 right-0 p-4 bg-surface-light/95 dark:bg-surface-dark/95 border-t border-border-light dark:border-border-dark backdrop-blur-md max-w-md mx-auto">
<button class="w-full bg-primary hover:bg-primary-dark text-surface-dark font-bold text-base py-3.5 px-6 rounded-xl shadow-lg shadow-primary/20 transition-all active:scale-[0.98]">
                Save Changes
            </button>
</div>
</div>
</body></html>
