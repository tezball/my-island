<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Inline Validation States - my-island</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec80",
                        "background-light": "#f6f8f7",
                        "background-dark": "#102219",
                        "surface-light": "#ffffff",
                        "surface-dark": "#1a2c24",
                        "border-light": "#dbe6e0",
                        "border-dark": "#2a4035",
                        "text-main": "#111814",
                        "text-light": "#e1ece6",
                        "text-secondary": "#618975",
                        "error": "#ef4444",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                    boxShadow: {
                        'soft': '0 4px 20px -2px rgba(19, 236, 128, 0.1)',
                        'glow': '0 0 0 4px rgba(19, 236, 128, 0.15)',
                    }
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar hide for cleaner mobile look */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased transition-colors duration-200">
<!-- Mobile Container -->
<div class="relative mx-auto flex h-full min-h-screen w-full max-w-md flex-col overflow-hidden bg-background-light dark:bg-background-dark shadow-2xl">
<!-- Header -->
<header class="sticky top-0 z-10 flex items-center justify-between bg-background-light/95 dark:bg-background-dark/95 px-4 py-4 backdrop-blur-md">
<button class="flex size-10 items-center justify-center rounded-full bg-white dark:bg-surface-dark shadow-sm transition-transform active:scale-95 text-text-main dark:text-text-light border border-border-light dark:border-border-dark">
<span class="material-symbols-outlined text-[20px]">arrow_back_ios_new</span>
</button>
<h2 class="flex-1 text-center text-lg font-bold tracking-tight text-text-main dark:text-text-light">
                Registration Details
            </h2>
<div class="size-10"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content -->
<main class="flex flex-1 flex-col px-6 pb-24 pt-2">
<!-- Description -->
<div class="mb-8">
<p class="text-text-main dark:text-text-light text-base font-normal leading-relaxed opacity-90">
                    Please enter your details to register your island spot. Ensure all information matches your official supplier documents.
                </p>
</div>
<!-- Form -->
<form class="flex flex-col gap-6" onsubmit="event.preventDefault()">
<!-- 1. Default State -->
<div class="group flex flex-col gap-2">
<label class="text-sm font-semibold text-text-main dark:text-text-light ml-1" for="island-name">
                        Island Name
                    </label>
<div class="relative">
<input class="w-full rounded-xl border border-border-light dark:border-border-dark bg-white dark:bg-surface-dark px-4 py-3.5 text-base text-text-main dark:text-text-light placeholder:text-text-secondary dark:placeholder:text-gray-500 focus:border-primary focus:ring-4 focus:ring-primary/20 transition-all outline-none" id="island-name" placeholder="e.g. Emerald Bay" type="text"/>
</div>
</div>
<!-- 2. Active State (Simulated Focus) -->
<div class="group flex flex-col gap-2">
<label class="text-sm font-semibold text-primary ml-1 transition-colors" for="owner-name">
                        Owner Name
                    </label>
<div class="relative">
<input autofocus="" class="w-full rounded-xl border border-primary bg-white dark:bg-surface-dark px-4 py-3.5 text-base text-text-main dark:text-text-light placeholder:text-text-secondary shadow-glow outline-none transition-all" id="owner-name" placeholder="Full Name" type="text" value="Jona"/>
<!-- Blinking Cursor Simulation (CSS animation not strictly added, but implied by value) -->
<div class="absolute right-4 top-1/2 -translate-y-1/2 text-primary">
<span class="material-symbols-outlined text-[20px] animate-pulse">edit</span>
</div>
</div>
</div>
<!-- 3. Valid/Success State -->
<div class="group flex flex-col gap-2">
<label class="text-sm font-semibold text-text-main dark:text-text-light ml-1" for="email">
                        Email Address
                    </label>
<div class="relative">
<input class="w-full rounded-xl border border-primary bg-white dark:bg-surface-dark pl-4 pr-12 py-3.5 text-base text-text-main dark:text-text-light outline-none transition-all" id="email" readonly="" type="email" value="contact@my-island.com"/>
<div class="absolute right-4 top-1/2 flex -translate-y-1/2 items-center justify-center rounded-full bg-primary p-0.5">
<span class="material-symbols-outlined text-[16px] text-white font-bold">check</span>
</div>
</div>
</div>
<!-- 4. Error State -->
<div class="group flex flex-col gap-2">
<label class="text-sm font-semibold text-error ml-1" for="supplier-id">
                        Supplier ID
                    </label>
<div class="relative">
<input class="w-full rounded-xl border border-error bg-error/5 dark:bg-error/10 pl-4 pr-12 py-3.5 text-base text-text-main dark:text-text-light placeholder:text-text-secondary focus:border-error focus:ring-4 focus:ring-error/10 outline-none transition-all" id="supplier-id" placeholder="6-digit ID" type="text" value="123"/>
<div class="absolute right-4 top-1/2 -translate-y-1/2 text-error flex items-center">
<span class="material-symbols-outlined text-[24px]">error</span>
</div>
</div>
<!-- Inline Error Message -->
<div class="flex items-center gap-1.5 ml-1 animate-pulse">
<span class="text-xs font-medium text-error">ID must be exactly 6 digits</span>
</div>
</div>
</form>
</main>
<!-- Bottom Action Area -->
<div class="fixed bottom-0 left-0 right-0 p-6 bg-gradient-to-t from-background-light via-background-light to-transparent dark:from-background-dark dark:via-background-dark pt-12">
<div class="mx-auto max-w-md">
<button class="w-full rounded-xl bg-gray-200 dark:bg-gray-800 text-gray-400 dark:text-gray-500 py-4 text-base font-bold shadow-none transition-all cursor-not-allowed flex items-center justify-center gap-2" disabled="">
                    Continue
                </button>
</div>
</div>
<!-- Decorative background element for nature theme -->
<div class="pointer-events-none absolute top-0 left-0 -z-10 h-64 w-full opacity-30">
<div class="absolute -left-10 -top-10 h-64 w-64 rounded-full bg-primary/20 blur-3xl"></div>
<div class="absolute right-0 top-0 h-48 w-48 rounded-full bg-blue-400/10 blur-3xl"></div>
</div>
</div>
</body></html>
