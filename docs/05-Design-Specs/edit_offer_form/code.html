<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Edit Offer - my-island</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec80",
                        "primary-hover": "#0fd673",
                        "primary-light": "#e0fdf0",
                        "background-light": "#ffffff",
                        "background-off": "#f8fcfa",
                        "background-dark": "#102219",
                        "text-main": "#0d1b14",
                        "text-secondary": "#4c9a73",
                        "border-color": "#cfe7db",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"],
                        "body": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "2xl": "2rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar hiding for cleaner mobile look */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-text-main dark:text-white font-display antialiased h-screen overflow-hidden flex flex-col">
<!-- Header -->
<header class="flex-none px-4 pt-12 pb-2 bg-background-light dark:bg-background-dark border-b border-gray-100 dark:border-gray-800 z-10">
<div class="flex items-center justify-between">
<button aria-label="Go back" class="flex size-10 shrink-0 items-center justify-center rounded-full active:bg-gray-100 dark:active:bg-gray-800 transition-colors text-text-main dark:text-white">
<span class="material-symbols-outlined" style="font-size: 24px;">arrow_back_ios_new</span>
</button>
<h1 class="text-lg font-bold leading-tight tracking-[-0.015em] text-text-main dark:text-white">Edit Offer</h1>
<button aria-label="Delete offer" class="flex size-10 shrink-0 items-center justify-center rounded-full active:bg-red-50 dark:active:bg-red-900/20 text-red-500 transition-colors">
<span class="material-symbols-outlined" style="font-size: 24px;">delete</span>
</button>
</div>
</header>
<!-- Scrollable Content -->
<main class="flex-1 overflow-y-auto no-scrollbar bg-background-off dark:bg-background-dark pb-24">
<!-- Image Section -->
<section class="p-4">
<div class="flex flex-col rounded-xl bg-white dark:bg-gray-900 shadow-sm border border-border-color dark:border-gray-800 overflow-hidden">
<div class="relative w-full aspect-video bg-gray-200 dark:bg-gray-800 group cursor-pointer">
<div class="absolute inset-0 bg-cover bg-center transition-transform duration-500 group-hover:scale-105" data-alt="Scenic glamping tent at sunset with warm lighting" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuACiS-9sN3wzYVMei4fmcdaqn6eeonW1B4OD5GEckupvukoqJpB0EXs95LnGhku83DVId2OS_aHQaVquj3opxErdDeOGHyq4wU3lKTLmvCkA5uFA2P80y8QvrSpevMkjJ5bl8URi7C1KtXnY6G42jpqI1BcwGoDkF_wynzxucEKkuqaUxv5Y1li0NGR-XvjiDMFLr6yt8IOv_Hj4SYxwUJEwmIeLJkBBFxvrputQkMAw1QR_bCPSrIdlkWAGQ7GzShhHZOadIZzag");'>
</div>
<div class="absolute inset-0 bg-black/20 group-hover:bg-black/30 transition-colors"></div>
<button class="absolute bottom-3 right-3 flex items-center gap-2 bg-white/90 dark:bg-black/60 backdrop-blur-sm px-3 py-1.5 rounded-lg shadow-sm hover:bg-white dark:hover:bg-black/80 transition-all">
<span class="material-symbols-outlined text-primary text-[20px]">photo_camera</span>
<span class="text-xs font-semibold text-text-main dark:text-white">Change Photo</span>
</button>
</div>
</div>
</section>
<!-- Form Fields -->
<form class="flex flex-col gap-6 px-4 pb-8" onsubmit="event.preventDefault();">
<!-- Title -->
<div class="flex flex-col gap-2">
<label class="text-sm font-semibold text-text-main dark:text-gray-200 ml-1" for="offer-title">Offer Title</label>
<div class="relative">
<input class="w-full h-14 rounded-xl border-transparent bg-white dark:bg-gray-900 focus:bg-white dark:focus:bg-gray-800 focus:border-primary focus:ring-0 shadow-sm text-base font-medium text-text-main dark:text-white placeholder:text-gray-400 pl-4 pr-10 transition-all" id="offer-title" type="text" value="Sunset Glamping Spot"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-primary" style="font-size: 20px;">edit</span>
</div>
</div>
<!-- Description -->
<div class="flex flex-col gap-2">
<label class="text-sm font-semibold text-text-main dark:text-gray-200 ml-1" for="offer-desc">Description</label>
<div class="relative">
<textarea class="w-full min-h-[140px] rounded-xl border-transparent bg-white dark:bg-gray-900 focus:bg-white dark:focus:bg-gray-800 focus:border-primary focus:ring-0 shadow-sm text-base font-normal text-text-main dark:text-white placeholder:text-gray-400 p-4 resize-none transition-all leading-relaxed" id="offer-desc">Experience the wild with our premium tent setup. Includes queen bed, heater, and private deck overlooking the valley. Perfect for couples.</textarea>
<div class="absolute bottom-3 right-3 text-xs font-medium text-gray-400 bg-white/50 dark:bg-black/20 backdrop-blur-sm px-2 py-0.5 rounded-md">
                        124/300
                    </div>
</div>
</div>
<!-- Pricing Row -->
<div class="flex gap-4">
<div class="flex flex-col gap-2 flex-1">
<label class="text-sm font-semibold text-text-main dark:text-gray-200 ml-1" for="price-original">Original Price</label>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-500 font-medium">$</span>
<input class="w-full h-14 rounded-xl border-transparent bg-white dark:bg-gray-900 focus:bg-white dark:focus:bg-gray-800 focus:border-primary focus:ring-0 shadow-sm text-base font-medium text-text-main dark:text-white pl-8 pr-4 transition-all" id="price-original" type="number" value="150.00"/>
</div>
</div>
<div class="flex flex-col gap-2 flex-1">
<label class="text-sm font-semibold text-text-main dark:text-gray-200 ml-1" for="price-discount">Discounted Price</label>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 text-primary font-medium">$</span>
<input class="w-full h-14 rounded-xl border-transparent bg-primary-light/30 dark:bg-primary/10 focus:bg-white dark:focus:bg-gray-800 border border-primary/20 focus:border-primary focus:ring-0 shadow-sm text-base font-bold text-primary pl-8 pr-4 transition-all" id="price-discount" type="number" value="120.00"/>
</div>
</div>
</div>
<!-- Expiration Date -->
<div class="flex flex-col gap-2">
<label class="text-sm font-semibold text-text-main dark:text-gray-200 ml-1" for="offer-expiry">Offer Expires</label>
<button class="relative flex items-center w-full h-14 rounded-xl bg-white dark:bg-gray-900 border border-transparent hover:border-border-color dark:hover:border-gray-700 shadow-sm px-4 transition-all group" type="button">
<span class="flex items-center justify-center size-8 rounded-lg bg-primary-light dark:bg-primary/20 mr-3 group-hover:scale-105 transition-transform">
<span class="material-symbols-outlined text-primary text-[20px]">calendar_today</span>
</span>
<span class="flex-1 text-left text-base font-medium text-text-main dark:text-white">Oct 24, 2023</span>
<span class="material-symbols-outlined text-gray-400" style="font-size: 20px;">expand_more</span>
</button>
</div>
<!-- Settings / Toggles (Optional Bonus) -->
<div class="p-4 rounded-xl bg-white dark:bg-gray-900 shadow-sm border border-transparent">
<div class="flex items-center justify-between">
<div class="flex flex-col">
<span class="text-sm font-semibold text-text-main dark:text-white">Active Offer</span>
<span class="text-xs text-gray-500 dark:text-gray-400">Make visible to campers</span>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-primary"></div>
</label>
</div>
</div>
</form>
</main>
<!-- Fixed Bottom Actions -->
<div class="flex-none bg-white dark:bg-gray-900 border-t border-gray-100 dark:border-gray-800 p-4 pb-8 z-20 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
<div class="flex flex-col gap-3 max-w-[480px] mx-auto w-full">
<button class="flex w-full items-center justify-center rounded-xl h-14 bg-primary hover:bg-primary-hover active:scale-[0.98] transition-all shadow-lg shadow-primary/20 text-text-main font-bold text-base tracking-wide">
                Save Changes
            </button>
<button class="flex w-full items-center justify-center rounded-xl h-12 bg-transparent hover:bg-gray-50 dark:hover:bg-gray-800 text-gray-500 dark:text-gray-400 font-medium text-base transition-colors">
                Cancel
            </button>
</div>
</div>
</body></html>
