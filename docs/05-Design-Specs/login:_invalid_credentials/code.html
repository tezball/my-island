<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - My Island</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec80",
                        "background-light": "#f6f8f7",
                        "background-dark": "#102219",
                        "error": "#ef4444",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "Noto Sans", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px" },
                },
            },
        }
    </script>
<style>
        /* Custom styles to refine the look */
        .form-input:focus {
            box-shadow: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-[#111814] dark:text-white font-display min-h-screen flex flex-col items-center justify-center">
<div class="relative flex h-full min-h-screen w-full max-w-md flex-col bg-white dark:bg-[#1a2c24] shadow-xl overflow-hidden">
<!-- Top App Bar -->
<div class="flex items-center p-4 pb-2 justify-between">
<div class="text-[#111814] dark:text-white flex size-12 shrink-0 items-center justify-center rounded-full hover:bg-gray-100 dark:hover:bg-white/10 cursor-pointer transition-colors">
<span class="material-symbols-outlined" style="font-size: 24px;">arrow_back</span>
</div>
<h2 class="text-[#111814] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12">my-island</h2>
</div>
<!-- Spacer -->
<div class="h-4"></div>
<!-- Headline -->
<h1 class="text-[#111814] dark:text-white tracking-tight text-[32px] font-bold leading-tight px-6 text-left pb-2 pt-2">Welcome back</h1>
<p class="text-[#618975] dark:text-[#a0bgb0] text-base font-medium leading-normal px-6 pb-6">Enter your details to sign in to your account.</p>
<!-- Form Section -->
<div class="flex flex-col gap-4 px-6 py-2 w-full">
<!-- Email Field (Error State) -->
<label class="flex flex-col w-full">
<p class="text-[#111814] dark:text-white text-base font-medium leading-normal pb-2">Email Address</p>
<div class="group flex w-full items-center rounded-xl border border-error bg-white dark:bg-[#102219] overflow-hidden focus-within:border-error focus-within:ring-1 focus-within:ring-error transition-all">
<input class="form-input flex-1 min-w-0 bg-transparent text-[#111814] dark:text-white border-none focus:ring-0 h-14 px-4 placeholder:text-[#618975] text-base font-normal leading-normal" placeholder="Enter your email" type="email" value="camper@nature.com"/>
<div class="pr-4 text-error flex items-center justify-center">
<span class="material-symbols-outlined" style="font-size: 24px;">error</span>
</div>
</div>
</label>
<!-- Password Field (Error State) -->
<label class="flex flex-col w-full">
<div class="flex justify-between items-center pb-2">
<p class="text-[#111814] dark:text-white text-base font-medium leading-normal">Password</p>
<a class="text-sm font-medium text-primary hover:underline" href="#">Forgot Password?</a>
</div>
<div class="group flex w-full items-center rounded-xl border border-error bg-white dark:bg-[#102219] overflow-hidden focus-within:border-error focus-within:ring-1 focus-within:ring-error transition-all">
<input class="form-input flex-1 min-w-0 bg-transparent text-[#111814] dark:text-white border-none focus:ring-0 h-14 px-4 placeholder:text-[#618975] text-base font-normal leading-normal" placeholder="Enter your password" type="password" value="password123"/>
<div class="pr-4 text-error flex items-center justify-center gap-2">
<span class="material-symbols-outlined cursor-pointer text-[#618975]" style="font-size: 24px;">visibility_off</span>
<span class="material-symbols-outlined" style="font-size: 24px;">error</span>
</div>
</div>
</label>
<!-- Error Message Component -->
<div class="flex items-start gap-2 pt-1">
<span class="material-symbols-outlined text-error text-sm mt-0.5" style="font-size: 16px;">info</span>
<p class="text-error text-sm font-medium leading-tight">Incorrect email or password. Please try again.</p>
</div>
<!-- Sign In Button -->
<div class="pt-6">
<button class="w-full bg-primary hover:bg-[#0fd671] text-[#102219] font-bold text-base h-14 rounded-full transition-colors flex items-center justify-center">
                    Sign In
                </button>
</div>
</div>
<!-- Footer / Sign Up Link -->
<div class="mt-auto pb-8 flex justify-center w-full">
<p class="text-[#618975] text-sm font-medium">
                Don't have an account? 
                <a class="text-[#111814] dark:text-white font-bold hover:underline" href="#">Register Campsite</a>
</p>
</div>
<!-- Decorative Bottom Image -->
<div class="w-full h-32 relative mt-4 overflow-hidden rounded-t-[2rem]">
<div class="absolute inset-0 bg-gradient-to-t from-primary/20 to-transparent"></div>
<!-- Abstract nature pattern -->
<div class="absolute -bottom-10 -left-10 w-40 h-40 bg-primary/10 rounded-full blur-2xl"></div>
<div class="absolute -bottom-10 -right-10 w-60 h-60 bg-primary/20 rounded-full blur-3xl"></div>
</div>
</div>
</body></html>
