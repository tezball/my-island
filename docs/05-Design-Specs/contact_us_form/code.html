<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Contact Us - my-island</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec80",
                        "background-light": "#f6f8f7",
                        "background-dark": "#102219",
                        "surface-light": "#ffffff",
                        "surface-dark": "#1A2C23",
                        "text-main-light": "#111814",
                        "text-main-dark": "#ffffff",
                        "text-sub-light": "#637588",
                        "text-sub-dark": "#9ca3af",
                        "border-light": "#dbe6e0",
                        "border-dark": "#2e4538",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-text-main-light dark:text-text-main-dark font-display antialiased selection:bg-primary/30">
<div class="relative flex h-full min-h-screen w-full flex-col overflow-x-hidden max-w-md mx-auto shadow-sm">
<!-- Header -->
<div class="flex items-center bg-background-light dark:bg-background-dark p-4 pb-2 justify-between sticky top-0 z-10 backdrop-blur-md bg-opacity-90 dark:bg-opacity-90">
<button class="text-text-main-light dark:text-text-main-dark flex size-10 shrink-0 items-center justify-center rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined">arrow_back_ios_new</span>
</button>
<h2 class="text-text-main-light dark:text-text-main-dark text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-10">Contact Support</h2>
</div>
<div class="flex-1 flex flex-col px-4 pb-8">
<!-- Hero Text -->
<div class="py-4">
<h2 class="text-text-main-light dark:text-text-main-dark tracking-tight text-[28px] font-bold leading-tight text-left mb-2">We'd love to hear from you</h2>
<p class="text-text-sub-light dark:text-text-sub-dark text-base font-normal leading-relaxed">Have a question about a campsite or registration? Send us a message below.</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-5 mt-2" onsubmit="event.preventDefault();">
<!-- Name Field -->
<div class="flex flex-col gap-2">
<label class="text-text-main-light dark:text-text-main-dark text-sm font-medium leading-normal ml-1">Full Name</label>
<div class="relative">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-text-main-light dark:text-text-main-dark focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-border-light dark:border-border-dark bg-surface-light dark:bg-surface-dark focus:border-primary h-14 placeholder:text-text-sub-light/60 dark:placeholder:text-text-sub-dark/60 p-[15px] text-base font-normal leading-normal transition-all" placeholder="e.g., John Doe" type="text"/>
</div>
</div>
<!-- Email Field -->
<div class="flex flex-col gap-2">
<label class="text-text-main-light dark:text-text-main-dark text-sm font-medium leading-normal ml-1">Email Address</label>
<div class="relative">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-text-main-light dark:text-text-main-dark focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-border-light dark:border-border-dark bg-surface-light dark:bg-surface-dark focus:border-primary h-14 placeholder:text-text-sub-light/60 dark:placeholder:text-text-sub-dark/60 p-[15px] text-base font-normal leading-normal transition-all" placeholder="name@example.com" type="email"/>
</div>
</div>
<!-- Subject Field -->
<div class="flex flex-col gap-2">
<label class="text-text-main-light dark:text-text-main-dark text-sm font-medium leading-normal ml-1">Subject</label>
<div class="relative">
<div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-text-sub-light dark:text-text-sub-dark">
<span class="material-symbols-outlined text-xl">expand_more</span>
</div>
<select class="form-select flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-text-main-light dark:text-text-main-dark focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-border-light dark:border-border-dark bg-surface-light dark:bg-surface-dark focus:border-primary h-14 p-[15px] text-base font-normal leading-normal appearance-none cursor-pointer transition-all">
<option disabled="" selected="" value="">Select a topic</option>
<option value="registration">Registration Issue</option>
<option value="campsite">Campsite Feedback</option>
<option value="supplier">Supplier Alert</option>
<option value="other">Other</option>
</select>
</div>
</div>
<!-- Message Field -->
<div class="flex flex-col gap-2">
<label class="text-text-main-light dark:text-text-main-dark text-sm font-medium leading-normal ml-1">Your Message</label>
<div class="relative">
<textarea class="form-textarea flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-text-main-light dark:text-text-main-dark focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-border-light dark:border-border-dark bg-surface-light dark:bg-surface-dark focus:border-primary min-h-[160px] placeholder:text-text-sub-light/60 dark:placeholder:text-text-sub-dark/60 p-[15px] text-base font-normal leading-normal transition-all" placeholder="How can we help you today?"></textarea>
</div>
</div>
<!-- Spacer -->
<div class="h-4"></div>
<!-- Submit Button -->
<button class="group w-full bg-primary hover:bg-[#0fd672] active:bg-[#0cb862] text-background-dark font-bold text-base h-14 rounded-xl shadow-lg shadow-primary/20 transition-all transform active:scale-[0.98] flex items-center justify-center gap-2">
<span>Send Message</span>
<span class="material-symbols-outlined group-hover:translate-x-1 transition-transform" style="font-size: 20px;">send</span>
</button>
</form>
<!-- Footer Links -->
<div class="mt-8 flex flex-col items-center gap-4">
<p class="text-sm text-text-sub-light dark:text-text-sub-dark text-center">
                    Urgent issue with a campsite?
                </p>
<div class="flex items-center gap-6">
<button class="flex items-center gap-2 text-text-main-light dark:text-text-main-dark hover:text-primary dark:hover:text-primary transition-colors text-sm font-medium">
<span class="material-symbols-outlined text-[18px]">help</span>
                        FAQ
                    </button>
<div class="h-4 w-px bg-border-light dark:bg-border-dark"></div>
<button class="flex items-center gap-2 text-text-main-light dark:text-text-main-dark hover:text-primary dark:hover:text-primary transition-colors text-sm font-medium">
<span class="material-symbols-outlined text-[18px]">call</span>
                        Call Support
                    </button>
</div>
</div>
<div class="h-10"></div>
</div>
</div>
</body></html>
