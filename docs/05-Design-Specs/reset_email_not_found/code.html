<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Reset Email Confirmation</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
            extend: {
                colors: {
                "primary": "#13ec80",
                "background-light": "#f6f8f7",
                "background-dark": "#102219",
                },
                fontFamily: {
                "display": ["Plus Jakarta Sans", "Noto Sans", "sans-serif"]
                },
                borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
            },
            },
        }
    </script>
<style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 48; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="relative flex h-full min-h-screen w-full flex-col bg-background-light dark:bg-background-dark overflow-x-hidden font-display transition-colors duration-200">
<!-- TopAppBar -->
<div class="flex items-center p-4 pb-2 justify-between sticky top-0 z-10 bg-background-light/95 dark:bg-background-dark/95 backdrop-blur-sm">
<div class="text-slate-900 dark:text-white flex size-12 shrink-0 items-center justify-center cursor-pointer hover:bg-black/5 dark:hover:bg-white/10 rounded-full transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
</div>
<h2 class="text-slate-900 dark:text-white text-lg font-bold leading-tight flex-1 text-center pr-12">Reset Password</h2>
</div>
<!-- Main Content Area -->
<div class="flex-1 flex flex-col items-center justify-center px-4 w-full max-w-md mx-auto">
<!-- Status Icon / Illustration -->
<div class="relative mb-8">
<!-- Background Glow -->
<div class="absolute inset-0 bg-primary/20 rounded-full blur-2xl transform scale-125"></div>
<!-- Icon Container -->
<div class="relative flex items-center justify-center w-28 h-28 bg-white dark:bg-slate-800/50 rounded-full border-4 border-white dark:border-background-dark shadow-sm">
<div class="flex items-center justify-center w-full h-full rounded-full bg-primary/10">
<span class="material-symbols-outlined text-primary text-[56px]">mark_email_read</span>
</div>
<!-- Success Badge -->
<div class="absolute -bottom-1 -right-1 w-9 h-9 bg-primary rounded-full flex items-center justify-center border-4 border-white dark:border-background-dark">
<span class="material-symbols-outlined text-[#111814] text-[18px] font-bold">check</span>
</div>
</div>
</div>
<!-- HeadlineText -->
<h1 class="text-slate-900 dark:text-white tracking-tight text-[32px] font-bold leading-tight px-4 text-center pb-3 pt-2">
            Check your inbox
        </h1>
<!-- BodyText -->
<p class="text-slate-600 dark:text-slate-400 text-base font-normal leading-relaxed pb-8 px-4 text-center max-w-xs mx-auto">
            If an account with that email address exists, we've sent a password reset link to it. Please check your inbox and spam folder.
        </p>
<!-- SingleButton -->
<div class="w-full px-4 py-2">
<button class="flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-xl h-14 px-5 bg-primary hover:bg-[#0fd671] active:scale-[0.98] transition-all text-[#111814] text-base font-bold leading-normal tracking-[0.015em] shadow-lg shadow-primary/20">
<span class="truncate">Return to Login</span>
</button>
</div>
<!-- Secondary Action -->
<div class="w-full px-4 pt-4 pb-8">
<button class="flex w-full cursor-pointer items-center justify-center rounded-xl h-10 px-5 text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 text-sm font-semibold leading-normal transition-colors">
<span class="truncate">Resend link</span>
</button>
</div>
</div>
<!-- Bottom Spacer -->
<div class="h-5 bg-background-light dark:bg-background-dark"></div>
</body></html>
