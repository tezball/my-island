<div class="bg-center bg-no-repeat bg-cover rounded-full size-20 shadow-sm border-2 border-white dark:border-surface-dark" data-alt="Portrait of the campsite host smiling outdoors" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuCO1alLOpfcb2u0U88AHLmJ_41xeG1D20tPLcqhP7ForyIgyWfRTIiIWWe4ZaF_DxYfv8UGcjxry_ErVjUOH4bzb-EA5aLdGGhuisTXEaDJLIqo0btVLCdclLL0L_SRVe6amfTLYgJorkKWwJwk4Y0LCL2kchLgSgQZ_918jiJgsbh9ZWdMrUUEXW1SfWtcyUtwXA8KQ43VN3T8kv960pvq19wIqRBJtYIYG9cFK9a1mo_XKzuB_Ro1E67dDB0jwPF6aupUSOmjaw");'>

<div class="flex flex-col items-center text-center">
<p class="text-[#111814] dark:text-white text-xl font-bold leading-tight tracking-tight">Message Sarah Jenkins</p>
<p class="text-[#618975] dark:text-gray-400 text-sm font-medium mt-1 flex items-center gap-1">
<span class="material-symbols-outlined text-sm" style="font-size: 16px;">bolt</span>

<!-- Booking Context Card -->

<div class="bg-center bg-no-repeat aspect-square bg-cover rounded-lg size-16 shrink-0" data-alt="Scenic view of Emerald Lake campsite with trees and water" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuDFO-fPcbuwEULclaOISjkSOwjK_ePIz5uwZad2ZQUyA6-hfVFWUDq8ytYfO3225hbQG-0Ri6uwDWrHqAd-LXB3FjlvGY68__w4TXzUfgutE9fHlg4kgSd213n2HwkFbvLv6JXzt_4u2tXRpTSH2E-7JB4wUznMFXx4JjuFrZBMqZ7kZ1MhzZubMkG-KplOPd7QRN9EANlyv5O-_BfbzCtxbqz8A3AsaUX4FfNheNYNiesZf9SAvH40JSlxj--H0LqhZ7GgD2Wspw");'></div>
<div class="flex flex-col justify-center min-w-0">

<p class="text-[#111814] dark:text-white text-sm font-semibold leading-snug truncate">Emerald Lake Camp</p>
<p class="text-gray-500 dark:text-gray-400 text-xs font-normal leading-normal truncate">Jul 14 - Jul 17 • 3 Guests</p>

<!-- Form Fields -->
<form class="flex flex-col gap-5 mt-2" onsubmit="event.preventDefault();">
<!-- Subject Field -->
<div class="flex flex-col gap-2">
<label class="text-[#111814] dark:text-gray-200 text-sm font-semibold leading-normal ml-1" for="subject">Subject</label>
<div class="relative">
<input class="w-full rounded-xl bg-background-light dark:bg-surface-dark border-transparent focus:border-primary focus:ring-0 text-[#111814] dark:text-white placeholder:text-gray-400 dark:placeholder:text-gray-500 h-14 px-4 text-base font-normal transition-all" id="subject" placeholder="Late check-in query..." type="text"/>
<span class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 dark:text-gray-500 material-symbols-outlined pointer-events-none">edit</span>
</div>
</div>
<!-- Message Field -->
<div class="flex flex-col gap-2 flex-1">
<label class="text-[#111814] dark:text-gray-200 text-sm font-semibold leading-normal ml-1" for="message">Message</label>
<textarea class="w-full flex-1 min-h-[160px] rounded-xl bg-background-light dark:bg-surface-dark border-transparent focus:border-primary focus:ring-0 text-[#111814] dark:text-white placeholder:text-gray-400 dark:placeholder:text-gray-500 p-4 text-base font-normal resize-none transition-all" id="message" placeholder="Hi Sarah, I wanted to ask about..."></textarea>

<span class="material-symbols-outlined text-[#0a1f14]">send</span>
</button>
</div>
