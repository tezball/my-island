<body class="bg-background-light dark:bg-background-dark font-display antialiased min-h-screen flex flex-col items-center justify-center">
<div class="relative w-full max-w-md h-full min-h-screen flex flex-col bg-background-light dark:bg-background-dark overflow-x-hidden">
<header class="flex items-center p-4 justify-between bg-transparent">
<button class="text-slate-900 dark:text-white flex size-12 shrink-0 items-center justify-center rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
<span class="material-symbols-outlined text-[24px]">arrow_back_ios_new</span>
</button>
</header>
<main class="flex-1 px-6 pb-8 pt-2">
<div class="mb-6">
<h1 class="text-slate-900 dark:text-white text-[32px] font-bold leading-tight mb-2 tracking-tight">Create account</h1>
<p class="text-slate-500 dark:text-slate-400 text-base font-normal leading-normal">Start your adventure with my-island.</p>
</div>
<form class="flex flex-col gap-5">
<div class="flex flex-col gap-3">
<button class="relative w-full h-14 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl flex items-center justify-center gap-3 hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors group" type="button">
<svg class="w-5 h-5 absolute left-5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.84z" fill="#FBBC05"></path><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path></svg>
<span class="text-slate-700 dark:text-white font-bold text-base">Continue with Google</span>
</button>
<button class="relative w-full h-14 bg-slate-900 dark:bg-white rounded-xl flex items-center justify-center gap-3 hover:opacity-90 transition-opacity" type="button">
<svg class="w-5 h-5 absolute left-5 text-white dark:text-slate-900" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M16.606 12.37C16.606 10.15 18.232 9.176 18.334 9.115C17.257 7.55 15.589 7.377 14.99 7.357C13.568 7.214 12.227 8.21 11.516 8.21C10.784 8.21 9.686 7.316 8.527 7.336C6.983 7.357 5.56 8.23 4.767 9.613C3.12 12.472 4.36 16.66 5.926 18.917C6.699 20.015 7.614 21.235 8.832 21.194C9.99 21.154 10.458 20.442 11.882 20.442C13.305 20.442 13.732 21.194 14.972 21.174C16.273 21.154 17.087 19.995 17.839 18.877C18.734 17.595 19.1 16.335 19.12 16.253C19.08 16.233 16.606 15.297 16.606 12.37ZM14.461 5.384C15.112 4.591 15.539 3.513 15.417 2.456C14.502 2.496 13.344 3.066 12.693 3.839C12.083 4.55 11.636 5.669 11.779 6.706C12.795 6.787 13.83 5.954 14.461 5.384Z"></path></svg>
<span class="text-white dark:text-slate-900 font-bold text-base">Continue with Apple</span>
</button>
</div>
<div class="relative flex py-1 items-center">
<div class="flex-grow border-t border-slate-200 dark:border-slate-700"></div>
<span class="flex-shrink-0 mx-4 text-slate-400 dark:text-slate-500 text-sm font-medium">Or continue with email</span>
<div class="flex-grow border-t border-slate-200 dark:border-slate-700"></div>
</div>
<div class="flex flex-col gap-2">
<label class="text-slate-900 dark:text-white text-base font-medium" for="email">Email Address</label>
<div class="relative">
<input class="form-input w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white focus:border-primary focus:ring-1 focus:ring-primary h-14 px-4 placeholder:text-slate-400 text-base font-normal transition-all" id="email" placeholder="name@example.com" type="email" value=""/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none">mail</span>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="text-slate-900 dark:text-white text-base font-medium" for="password">Password</label>
<div class="relative flex items-center">
<input class="form-input w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white focus:border-primary focus:ring-1 focus:ring-primary h-14 px-4 pr-12 placeholder:text-slate-400 text-base font-normal transition-all" id="password" placeholder="Enter your password" type="password" value="MySecretPassword"/>
<button class="absolute right-0 top-0 h-full px-4 text-slate-400 hover:text-primary transition-colors flex items-center justify-center" type="button">
<span class="material-symbols-outlined text-[24px]">visibility_off</span>
</button>
</div>
<div class="mt-1">
<div class="flex gap-2 h-1.5 w-full">
<div class="h-full flex-1 rounded-full bg-primary"></div>
<div class="h-full flex-1 rounded-full bg-primary"></div>
<div class="h-full flex-1 rounded-full bg-primary/30 dark:bg-primary/20"></div>
<div class="h-full flex-1 rounded-full bg-slate-200 dark:bg-slate-700"></div>
</div>
<p class="text-xs text-slate-500 dark:text-slate-400 mt-1.5 font-medium">Strength: <span class="text-primary">Medium</span></p>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="text-slate-900 dark:text-white text-base font-medium" for="confirm-password">Confirm Password</label>
<div class="relative flex items-center">
<input class="form-input w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white focus:border-primary focus:ring-1 focus:ring-primary h-14 px-4 pr-12 placeholder:text-slate-400 text-base font-normal transition-all" id="confirm-password" placeholder="Re-enter your password" type="password" value=""/>
<button class="absolute right-0 top-0 h-full px-4 text-slate-400 hover:text-primary transition-colors flex items-center justify-center" type="button">
<span class="material-symbols-outlined text-[24px]">visibility_off</span>
</button>
</div>
</div>
<div class="h-2"></div>
<button class="w-full bg-primary hover:bg-emerald-400 active:bg-emerald-500 text-slate-900 font-bold h-14 rounded-xl text-lg shadow-sm hover:shadow-md hover:shadow-primary/20 transition-all transform active:scale-[0.98]" type="button">
                    Create Account
                </button>
<div class="text-center mt-2">
<p class="text-slate-500 dark:text-slate-400 text-base">
                        Already have an account? 
                        <a class="text-primary font-semibold hover:underline decoration-2 underline-offset-4" href="#">Log in</a>
</p>
</div>
</form>
</main>
<div class="w-full h-32 opacity-10 pointer-events-none absolute bottom-0 left-0 bg-gradient-to-t from-primary to-transparent" data-alt="Subtle green gradient at bottom"></div>
