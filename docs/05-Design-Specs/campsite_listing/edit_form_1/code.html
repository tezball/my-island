<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Campsite Listing Form</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec5b",
                        "background-light": "#ffffff",
                        "background-dark": "#102216",
                        "surface-light": "#f3f4f6",
                        "surface-dark": "#1c3324",
                        "text-main": "#0d1b12",
                        "text-subtle": "#6b7280",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar hiding for cleaner mobile look */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-text-main dark:text-white font-display antialiased">
<div class="relative flex h-full min-h-screen w-full flex-col overflow-x-hidden max-w-md mx-auto bg-background-light dark:bg-background-dark shadow-xl">
<!-- Top App Bar -->
<header class="sticky top-0 z-50 flex items-center justify-between bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md px-4 py-3 border-b border-gray-100 dark:border-gray-800">
<button class="flex items-center justify-center p-2 -ml-2 rounded-full hover:bg-surface-light dark:hover:bg-surface-dark transition-colors text-text-main dark:text-white">
<span class="material-symbols-outlined text-2xl">close</span>
</button>
<h1 class="text-lg font-bold tracking-tight text-center">Add New Campsite</h1>
<button class="text-primary font-bold text-base hover:text-green-600 transition-colors">
                Save
            </button>
</header>
<!-- Main Content Scroll Area -->
<main class="flex-1 overflow-y-auto pb-24">
<!-- Section: Photos -->
<section class="mt-6">
<div class="flex items-center justify-between px-4 mb-3">
<h2 class="text-lg font-bold text-text-main dark:text-white">Photos</h2>
<span class="text-sm font-medium text-text-subtle dark:text-gray-400">0/5</span>
</div>
<!-- Horizontal Scroll Container for Photos -->
<div class="flex overflow-x-auto gap-3 px-4 pb-4 no-scrollbar snap-x">
<!-- Add Photo Button -->
<button class="flex-none w-32 h-32 flex flex-col items-center justify-center gap-2 bg-surface-light dark:bg-surface-dark rounded-xl border-2 border-dashed border-primary/40 hover:border-primary transition-colors snap-start">
<div class="p-2 bg-primary/10 rounded-full text-primary">
<span class="material-symbols-outlined">add_a_photo</span>
</div>
<span class="text-xs font-semibold text-primary">Add Photo</span>
</button>
<!-- Example Uploaded Photo 1 -->
<div class="flex-none w-32 h-32 relative group snap-start">
<div class="w-full h-full bg-center bg-cover rounded-xl shadow-sm" data-alt="Sunny campsite clearing with trees" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuBoMwxoTFm0Mja9FZloDgmBOSgCuLvrU9UYGX1I1HBeZiOmxpafKMlDobl7SkdK0cPTjyLWV-LEK7jIA8VAa-WoHHfExis0jBp2ljt3yUbFJykQXMAoFyKSX2XxD96MLDe4TKhgZMxZgu9DqcRtYI4plDVK2C_jAkdPwwHOh0XjeMrlyVn-_VKhV0flGwni4VLufnVltSUs7Eme4aw1SBiuF0nc0cjgwxVFVKbGuom_WnZqxa5aCfHjrrSD_tpy-AZyWyBIpwD9QA");'></div>
<button class="absolute top-1 right-1 p-1 bg-black/50 text-white rounded-full opacity-0 group-hover:opacity-100 transition-opacity backdrop-blur-sm">
<span class="material-symbols-outlined text-sm">close</span>
</button>
</div>
<!-- Example Uploaded Photo 2 -->
<div class="flex-none w-32 h-32 relative group snap-start">
<div class="w-full h-full bg-center bg-cover rounded-xl shadow-sm" data-alt="Tent by a lake at sunset" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuBcSLvc1vA1ILi53ZSsOxiU0cYqUKMMaOyqOdzQL3or0vQwSHjHypzeKjDOLiPjS5QpO4gjGrtQqBdq_yFYqCcmyiIZgWT_3uKSXUXl1kzuj9GPNpnIQwmKwtRWqZtKn2vHE7zK5VvVAvshGyLqUyFY--FT-uf4tmYcBbRKxGgojduxE5ASzQpryekzwSorHxI8S_QsqJSsAWOhfVXkunrKtWyFUZOOIn7HbrW3ncDDGIaKQx2eiEshRmu8jYG9BEoIuX8FeN0CJw");'></div>
<button class="absolute top-1 right-1 p-1 bg-black/50 text-white rounded-full opacity-0 group-hover:opacity-100 transition-opacity backdrop-blur-sm">
<span class="material-symbols-outlined text-sm">close</span>
</button>
</div>
</div>
</section>
<!-- Section: Basic Info -->
<section class="px-4 mt-4 space-y-5">
<h2 class="text-lg font-bold text-text-main dark:text-white">Basic Info</h2>
<div class="space-y-4">
<!-- Campsite Name -->
<div class="relative">
<label class="block text-sm font-medium text-text-subtle dark:text-gray-400 mb-1.5 ml-1" for="campsite-name">Campsite Name</label>
<input class="w-full bg-surface-light dark:bg-surface-dark border-transparent focus:border-primary focus:ring-primary rounded-xl px-4 py-3 text-text-main dark:text-white placeholder-gray-400 transition-all font-medium" id="campsite-name" placeholder="e.g. Whispering Pines" type="text"/>
</div>
<!-- Price Input Group -->
<div class="relative">
<label class="block text-sm font-medium text-text-subtle dark:text-gray-400 mb-1.5 ml-1" for="price">Price per night</label>
<div class="relative rounded-xl shadow-sm">
<div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-4">
<span class="text-text-subtle dark:text-gray-400 font-semibold">$</span>
</div>
<input class="block w-full rounded-xl border-transparent bg-surface-light dark:bg-surface-dark py-3 pl-8 pr-12 text-text-main dark:text-white focus:border-primary focus:ring-primary placeholder-gray-400 font-medium" id="price" name="price" placeholder="0.00" type="number"/>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-4">
<span class="text-text-subtle dark:text-gray-400 text-sm">USD</span>
</div>
</div>
</div>
<!-- Description -->
<div class="relative">
<label class="block text-sm font-medium text-text-subtle dark:text-gray-400 mb-1.5 ml-1" for="description">Description</label>
<textarea class="w-full bg-surface-light dark:bg-surface-dark border-transparent focus:border-primary focus:ring-primary rounded-xl px-4 py-3 text-text-main dark:text-white placeholder-gray-400 transition-all resize-none" id="description" placeholder="Tell guests what makes your site unique..." rows="4"></textarea>
<div class="text-right text-xs text-text-subtle dark:text-gray-500 mt-1 mr-1">0/500</div>
</div>
</div>
</section>
<!-- Section: Location -->
<section class="px-4 mt-8 space-y-4">
<div class="flex items-center justify-between">
<h2 class="text-lg font-bold text-text-main dark:text-white">Location</h2>
<button class="text-primary text-sm font-bold flex items-center gap-1 hover:text-green-600 transition-colors">
<span class="material-symbols-outlined text-[18px]">my_location</span>
                        Use Current
                    </button>
</div>
<div class="bg-surface-light dark:bg-surface-dark rounded-xl p-1 shadow-sm overflow-hidden">
<div class="relative w-full h-40 bg-gray-200 dark:bg-gray-700 rounded-lg overflow-hidden group cursor-pointer">
<!-- Map Placeholder -->
<div class="w-full h-full bg-cover bg-center opacity-80 group-hover:scale-105 transition-transform duration-500" data-alt="Map showing a green forest area" data-location="Oregon, USA" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuCSM_1uAY-_uhnn2p9me45v1BRMCiY57T4gI5Tmtnoy00dWtUgBgmwy0cFSn5mFw3kM0ovKqqKCsArdx0073RamYygPpr-reX9bUFko75YTP79Ucyrv_nbc-nlQXkXrLBjby_fESPH3Sd6Zk3_Sx4zfwc-vsDNNum8Gdsij0_i9ei94qDKYsPm4y1FjByLrwXU_c0OEWFmpyBzjv9slVf1bNWroE2ZuP3B1rdVwW_B3fZV9fsNG6KBkMwL_hJPgzRIaqBNrJxZPMA");'>
</div>
<!-- Pin Overlay -->
<div class="absolute inset-0 flex items-center justify-center">
<span class="material-symbols-outlined text-4xl text-primary drop-shadow-md animate-bounce">location_on</span>
</div>
<div class="absolute bottom-2 right-2 bg-white/90 dark:bg-black/80 px-2 py-1 rounded text-xs font-semibold shadow-sm backdrop-blur-sm">
                            Edit on Map
                        </div>
</div>
<div class="p-3">
<div class="relative">
<span class="absolute top-3.5 left-0 material-symbols-outlined text-text-subtle dark:text-gray-400 text-xl">search</span>
<input class="w-full bg-transparent border-0 border-b border-gray-200 dark:border-gray-700 focus:border-primary focus:ring-0 pl-8 pr-2 py-3 text-text-main dark:text-white placeholder-gray-400 text-sm" placeholder="Enter address or coordinates" type="text"/>
</div>
</div>
</div>
</section>
<!-- Section: Facilities/Amenities -->
<section class="px-4 mt-8 mb-6">
<h2 class="text-lg font-bold text-text-main dark:text-white mb-4">What does this site offer?</h2>
<div class="grid grid-cols-2 gap-3">
<!-- Amenity Checkbox Item -->
<label class="relative flex items-center gap-3 p-3 rounded-xl border-2 border-transparent bg-surface-light dark:bg-surface-dark cursor-pointer transition-all hover:bg-gray-100 dark:hover:bg-gray-800 [&amp;:has(input:checked)]:border-primary [&amp;:has(input:checked)]:bg-primary/5 dark:[&amp;:has(input:checked)]:bg-primary/10">
<input class="peer sr-only" type="checkbox"/>
<div class="flex items-center justify-center w-8 h-8 rounded-full bg-white dark:bg-gray-700 text-text-subtle peer-checked:text-primary peer-checked:bg-primary/20 transition-colors">
<span class="material-symbols-outlined text-[20px]">wifi</span>
</div>
<span class="text-sm font-medium text-text-main dark:text-white peer-checked:text-primary transition-colors">WiFi</span>
<div class="absolute top-3 right-3 opacity-0 peer-checked:opacity-100 text-primary transition-opacity">
<span class="material-symbols-outlined text-[18px] font-bold">check</span>
</div>
</label>
<label class="relative flex items-center gap-3 p-3 rounded-xl border-2 border-transparent bg-surface-light dark:bg-surface-dark cursor-pointer transition-all hover:bg-gray-100 dark:hover:bg-gray-800 [&amp;:has(input:checked)]:border-primary [&amp;:has(input:checked)]:bg-primary/5 dark:[&amp;:has(input:checked)]:bg-primary/10">
<input checked="" class="peer sr-only" type="checkbox"/>
<div class="flex items-center justify-center w-8 h-8 rounded-full bg-white dark:bg-gray-700 text-text-subtle peer-checked:text-primary peer-checked:bg-primary/20 transition-colors">
<span class="material-symbols-outlined text-[20px]">shower</span>
</div>
<span class="text-sm font-medium text-text-main dark:text-white peer-checked:text-primary transition-colors">Showers</span>
<div class="absolute top-3 right-3 opacity-0 peer-checked:opacity-100 text-primary transition-opacity">
<span class="material-symbols-outlined text-[18px] font-bold">check</span>
</div>
</label>
<label class="relative flex items-center gap-3 p-3 rounded-xl border-2 border-transparent bg-surface-light dark:bg-surface-dark cursor-pointer transition-all hover:bg-gray-100 dark:hover:bg-gray-800 [&amp;:has(input:checked)]:border-primary [&amp;:has(input:checked)]:bg-primary/5 dark:[&amp;:has(input:checked)]:bg-primary/10">
<input class="peer sr-only" type="checkbox"/>
<div class="flex items-center justify-center w-8 h-8 rounded-full bg-white dark:bg-gray-700 text-text-subtle peer-checked:text-primary peer-checked:bg-primary/20 transition-colors">
<span class="material-symbols-outlined text-[20px]">pets</span>
</div>
<span class="text-sm font-medium text-text-main dark:text-white peer-checked:text-primary transition-colors">Pet Friendly</span>
<div class="absolute top-3 right-3 opacity-0 peer-checked:opacity-100 text-primary transition-opacity">
<span class="material-symbols-outlined text-[18px] font-bold">check</span>
</div>
</label>
<label class="relative flex items-center gap-3 p-3 rounded-xl border-2 border-transparent bg-surface-light dark:bg-surface-dark cursor-pointer transition-all hover:bg-gray-100 dark:hover:bg-gray-800 [&amp;:has(input:checked)]:border-primary [&amp;:has(input:checked)]:bg-primary/5 dark:[&amp;:has(input:checked)]:bg-primary/10">
<input class="peer sr-only" type="checkbox"/>
<div class="flex items-center justify-center w-8 h-8 rounded-full bg-white dark:bg-gray-700 text-text-subtle peer-checked:text-primary peer-checked:bg-primary/20 transition-colors">
<span class="material-symbols-outlined text-[20px]">local_fire_department</span>
</div>
<span class="text-sm font-medium text-text-main dark:text-white peer-checked:text-primary transition-colors">Fire Pit</span>
<div class="absolute top-3 right-3 opacity-0 peer-checked:opacity-100 text-primary transition-opacity">
<span class="material-symbols-outlined text-[18px] font-bold">check</span>
</div>
</label>
<label class="relative flex items-center gap-3 p-3 rounded-xl border-2 border-transparent bg-surface-light dark:bg-surface-dark cursor-pointer transition-all hover:bg-gray-100 dark:hover:bg-gray-800 [&amp;:has(input:checked)]:border-primary [&amp;:has(input:checked)]:bg-primary/5 dark:[&amp;:has(input:checked)]:bg-primary/10">
<input class="peer sr-only" type="checkbox"/>
<div class="flex items-center justify-center w-8 h-8 rounded-full bg-white dark:bg-gray-700 text-text-subtle peer-checked:text-primary peer-checked:bg-primary/20 transition-colors">
<span class="material-symbols-outlined text-[20px]">water_drop</span>
</div>
<span class="text-sm font-medium text-text-main dark:text-white peer-checked:text-primary transition-colors">Potable Water</span>
<div class="absolute top-3 right-3 opacity-0 peer-checked:opacity-100 text-primary transition-opacity">
<span class="material-symbols-outlined text-[18px] font-bold">check</span>
</div>
</label>
<label class="relative flex items-center gap-3 p-3 rounded-xl border-2 border-transparent bg-surface-light dark:bg-surface-dark cursor-pointer transition-all hover:bg-gray-100 dark:hover:bg-gray-800 [&amp;:has(input:checked)]:border-primary [&amp;:has(input:checked)]:bg-primary/5 dark:[&amp;:has(input:checked)]:bg-primary/10">
<input class="peer sr-only" type="checkbox"/>
<div class="flex items-center justify-center w-8 h-8 rounded-full bg-white dark:bg-gray-700 text-text-subtle peer-checked:text-primary peer-checked:bg-primary/20 transition-colors">
<span class="material-symbols-outlined text-[20px]">electric_bolt</span>
</div>
<span class="text-sm font-medium text-text-main dark:text-white peer-checked:text-primary transition-colors">Power</span>
<div class="absolute top-3 right-3 opacity-0 peer-checked:opacity-100 text-primary transition-opacity">
<span class="material-symbols-outlined text-[18px] font-bold">check</span>
</div>
</label>
</div>
</section>
</main>
<!-- Sticky Bottom Bar -->
<div class="fixed bottom-0 left-0 right-0 p-4 bg-background-light/90 dark:bg-background-dark/90 backdrop-blur-lg border-t border-gray-100 dark:border-gray-800 max-w-md mx-auto z-40">
<button class="w-full bg-primary hover:bg-green-500 text-black font-bold py-4 rounded-xl shadow-lg shadow-primary/20 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined">save</span>
                Save Listing
            </button>
</div>
</div>
</body></html>
