<!DOCTYPE html>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

        tailwind.config = {
            darkMode: "class",
            theme: {

                    colors: {
                        "primary": "#13ec80",

                        "background-dark": "#102219",

                        "border-dark": "#2a4235",

                    fontFamily: {

                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},

        .no-scrollbar::-webkit-scrollbar {
            display: none;

            -ms-overflow-style: none;
            scrollbar-width: none;
        }

    body {
      min-height: max(884px, 100dvh);

<body class="bg-background-light dark:bg-background-dark font-display text-text-main-light dark:text-text-main-dark antialiased selection:bg-primary selection:text-background-dark">
<div class="relative flex h-full min-h-screen w-full flex-col overflow-x-hidden max-w-md mx-auto shadow-2xl bg-background-light dark:bg-background-dark">
<!-- Top App Bar -->
<header class="sticky top-0 z-50 flex items-center justify-between bg-surface-light/95 dark:bg-background-dark/95 backdrop-blur-md p-4 pb-2 border-b border-transparent dark:border-border-dark transition-colors duration-300">
<button class="flex size-10 shrink-0 items-center justify-center rounded-full hover:bg-gray-100 dark:hover:bg-surface-dark transition-colors group">
<span class="material-symbols-outlined text-text-main-light dark:text-text-main-dark group-hover:text-primary transition-colors" style="font-size: 24px;">arrow_back_ios_new</span>
</button>
<h2 class="text-text-main-light dark:text-text-main-dark text-lg font-bold leading-tight tracking-tight flex-1 text-center pr-10">Personal Info</h2>
</header>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col px-4 pb-24 pt-4">
<!-- Profile Header -->
<div class="flex flex-col items-center gap-6 mb-8 w-full animate-fade-in-down">
<div class="relative group cursor-pointer">
<div class="bg-center bg-no-repeat bg-cover rounded-full h-32 w-32 border-4 border-white dark:border-surface-dark shadow-lg transition-transform transform group-hover:scale-105" data-alt="Portrait of Sarah Jenkins smiling in outdoor gear" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuDGREIYH5AWdrVzVMjfoTJ4oFSJJyBaZOg63KYRy9kdPeYItibFsFG1CNSF2DyY_BnPj4T6JolVvTEOSBReK7_rs6JvNwnSqhb_tyRWARrBevQCxBeDmhaxcBb481kdkK2KjzsHs1RomWq9U7Yp943xN4rnXlYErYHB8nJOvrMIq3YYNpSz8JglKby6W8I7mqo51maDeRMxCoTtSdtFu64nSB-d2jWeBGuqd5C5AcOWFZWngdkE79Wuzk9DNZh09azWCYHEyYxDQA");'>
</div>
<div class="absolute bottom-0 right-0 bg-primary rounded-full p-2 border-4 border-background-light dark:border-background-dark shadow-sm">
<span class="material-symbols-outlined text-background-dark text-lg font-bold block">edit</span>
</div>
</div>
<div class="flex flex-col items-center justify-center gap-1">
<p class="text-text-main-light dark:text-text-main-dark text-[22px] font-bold leading-tight tracking-tight text-center">Sarah Jenkins</p>
<button class="text-primary hover:text-green-400 text-sm font-semibold leading-normal text-center transition-colors">Change Profile Photo</button>
</div>
</div>
<!-- Form Fields -->
<form class="flex flex-col gap-5 w-full">
<!-- Name Row -->
<div class="flex flex-col sm:flex-row gap-5">
<div class="flex flex-col flex-1 gap-2">
<label class="text-text-main-light dark:text-text-main-dark text-sm font-semibold leading-normal ml-1">First Name</label>
<div class="relative">
<input class="w-full rounded-xl border border-border-light dark:border-border-dark bg-white dark:bg-surface-dark text-text-main-light dark:text-text-main-dark focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary h-14 px-4 text-base font-medium transition-all shadow-sm placeholder:text-text-sub-light dark:placeholder:text-text-sub-dark" type="text" value="Sarah"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-primary text-xl pointer-events-none">check_circle</span>
</div>
</div>
<div class="flex flex-col flex-1 gap-2">
<label class="text-text-main-light dark:text-text-main-dark text-sm font-semibold leading-normal ml-1">Last Name</label>
<div class="relative">
<input class="w-full rounded-xl border border-border-light dark:border-border-dark bg-white dark:bg-surface-dark text-text-main-light dark:text-text-main-dark focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary h-14 px-4 text-base font-medium transition-all shadow-sm placeholder:text-text-sub-light dark:placeholder:text-text-sub-dark" type="text" value="Jenkins"/>
</div>
</div>
</div>
<!-- Email Field -->
<div class="flex flex-col gap-2">
<label class="text-text-main-light dark:text-text-main-dark text-sm font-semibold leading-normal ml-1">Email Address</label>
<div class="relative group/input">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-text-sub-light dark:text-text-sub-dark text-xl pointer-events-none group-focus-within/input:text-primary transition-colors">mail</span>
<input class="w-full rounded-xl border border-border-light dark:border-border-dark bg-white dark:bg-surface-dark text-text-main-light dark:text-text-main-dark focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary h-14 pl-12 pr-4 text-base font-medium transition-all shadow-sm placeholder:text-text-sub-light dark:placeholder:text-text-sub-dark" type="email" value="sarah.j@example.com"/>
</div>
</div>
<!-- Phone Field -->
<div class="flex flex-col gap-2">
<label class="text-text-main-light dark:text-text-main-dark text-sm font-semibold leading-normal ml-1">Phone Number</label>
<div class="relative group/input">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-text-sub-light dark:text-text-sub-dark text-xl pointer-events-none group-focus-within/input:text-primary transition-colors">call</span>
<input class="w-full rounded-xl border border-border-light dark:border-border-dark bg-white dark:bg-surface-dark text-text-main-light dark:text-text-main-dark focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary h-14 pl-12 pr-4 text-base font-medium transition-all shadow-sm placeholder:text-text-sub-light dark:placeholder:text-text-sub-dark" type="tel" value="+1 (555) 012-3456"/>
</div>
</div>
</form>
</main>
<!-- Bottom Action Bar (Sticky) -->
<footer class="fixed bottom-0 w-full max-w-md bg-white/80 dark:bg-background-dark/80 backdrop-blur-xl border-t border-border-light dark:border-border-dark p-4 pb-8 z-40">
<div class="flex flex-col gap-3">
<button class="flex w-full items-center justify-center rounded-xl bg-primary h-14 px-6 text-background-dark text-base font-bold tracking-tight shadow-lg shadow-primary/25 hover:bg-[#0fdc75] active:scale-[0.98] transition-all">
                    Save Changes
                </button>
<button class="flex w-full items-center justify-center rounded-xl bg-transparent h-14 px-6 text-text-sub-light dark:text-text-sub-dark hover:text-text-main-light dark:hover:text-text-main-dark text-base font-semibold hover:bg-gray-100 dark:hover:bg-surface-dark transition-all">
                    Cancel
                </button>
</div>
</footer>
</div>
</body></html>
