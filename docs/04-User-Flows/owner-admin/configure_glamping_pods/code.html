<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Configure Glamping Pods</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#13ec80",
              "background-light": "#f6f8f7",
              "background-dark": "#102219",
              "surface-light": "#ffffff",
              "surface-dark": "#182d23",
              "text-main-light": "#111814",
              "text-main-dark": "#e0e6e3",
              "text-secondary-light": "#618975",
              "text-secondary-dark": "#8fa89b",
            },
            fontFamily: {
              "display": ["Manrope", "Noto Sans", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "2xl": "2rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased transition-colors duration-200">
<div class="relative flex h-full min-h-screen w-full max-w-md mx-auto flex-col overflow-x-hidden shadow-2xl bg-surface-light dark:bg-surface-dark sm:rounded-[32px] sm:my-8 sm:h-[90vh] sm:border-8 sm:border-gray-900">
<!-- Header -->
<header class="flex items-center px-4 pt-6 pb-2 justify-between sticky top-0 z-10 bg-surface-light dark:bg-surface-dark">
<button class="flex size-10 shrink-0 items-center justify-center rounded-full hover:bg-background-light dark:hover:bg-background-dark transition-colors text-text-main-light dark:text-text-main-dark">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h2 class="text-text-main-light dark:text-text-main-dark text-lg font-bold leading-tight tracking-[-0.015em]">Property Setup</h2>
<button class="flex w-10 items-center justify-center">
<span class="text-primary text-base font-bold leading-normal tracking-[0.015em] hover:opacity-80 transition-opacity">Save</span>
</button>
</header>
<!-- Progress Indicator -->
<div class="flex w-full flex-row items-center justify-center gap-2 py-4 px-6">
<div class="h-1.5 flex-1 rounded-full bg-primary"></div>
<div class="h-1.5 flex-1 rounded-full bg-primary"></div>
<div class="h-1.5 flex-1 rounded-full bg-primary"></div>
<div class="h-1.5 flex-1 rounded-full bg-gray-200 dark:bg-gray-700"></div>
<div class="h-1.5 flex-1 rounded-full bg-gray-200 dark:bg-gray-700"></div>
</div>
<!-- Main Content Scroll Area -->
<main class="flex-1 overflow-y-auto px-6 pb-24">
<!-- Headline Section -->
<div class="pt-2 pb-6">
<h1 class="text-text-main-light dark:text-text-main-dark tracking-tight text-[28px] font-bold leading-tight mb-2">Configure Glamping Pods</h1>
<p class="text-text-secondary-light dark:text-text-secondary-dark text-base font-medium leading-normal">Tell us about the specifics of your units so guests know what to expect.</p>
</div>
<!-- Number of Units Section -->
<section class="mb-8 bg-background-light dark:bg-background-dark p-5 rounded-2xl border border-transparent dark:border-gray-800">
<h3 class="text-text-main-light dark:text-text-main-dark text-lg font-bold leading-tight tracking-[-0.015em] mb-4">Number of Pods</h3>
<div class="flex items-center justify-between">
<span class="text-text-secondary-light dark:text-text-secondary-dark font-medium text-sm">How many units do you have?</span>
<div class="flex items-center gap-4 bg-surface-light dark:bg-surface-dark rounded-xl p-1.5 shadow-sm border border-gray-100 dark:border-gray-700">
<button class="size-10 flex items-center justify-center rounded-lg bg-background-light dark:bg-background-dark text-text-main-light dark:text-text-main-dark hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">
<span class="material-symbols-outlined text-[20px]">remove</span>
</button>
<span class="w-8 text-center text-xl font-bold text-text-main-light dark:text-text-main-dark">4</span>
<button class="size-10 flex items-center justify-center rounded-lg bg-primary text-text-main-light font-bold hover:brightness-105 transition-all shadow-sm shadow-primary/30">
<span class="material-symbols-outlined text-[20px]">add</span>
</button>
</div>
</div>
</section>
<!-- Amenities Section -->
<section class="mb-8">
<div class="flex items-center gap-2 mb-4">
<span class="material-symbols-outlined text-primary">wifi</span>
<h3 class="text-text-main-light dark:text-text-main-dark text-lg font-bold leading-tight tracking-[-0.015em]">Standard Amenities</h3>
</div>
<div class="grid grid-cols-2 gap-3">
<!-- Amenity Card: Selected -->
<label class="group relative flex cursor-pointer flex-col items-start gap-3 rounded-2xl border-2 border-primary bg-primary/5 p-4 transition-all dark:bg-primary/10">
<input checked="" class="peer sr-only" type="checkbox"/>
<div class="flex size-8 items-center justify-center rounded-full bg-white dark:bg-surface-dark text-primary shadow-sm">
<span class="material-symbols-outlined text-[20px]">water_drop</span>
</div>
<span class="font-semibold text-text-main-light dark:text-text-main-dark">Private Bath</span>
<div class="absolute top-3 right-3 text-primary opacity-100 transition-opacity">
<span class="material-symbols-outlined text-[20px] font-bold">check_circle</span>
</div>
</label>
<!-- Amenity Card: Unselected -->
<label class="group relative flex cursor-pointer flex-col items-start gap-3 rounded-2xl border-2 border-transparent bg-background-light dark:bg-background-dark p-4 transition-all hover:bg-gray-100 dark:hover:bg-gray-800 dark:border-gray-800">
<input class="peer sr-only" type="checkbox"/>
<div class="flex size-8 items-center justify-center rounded-full bg-white dark:bg-surface-dark text-text-secondary-light dark:text-text-secondary-dark shadow-sm">
<span class="material-symbols-outlined text-[20px]">kitchen</span>
</div>
<span class="font-medium text-text-main-light dark:text-text-main-dark">Kitchenette</span>
<div class="absolute top-3 right-3 text-primary opacity-0 transition-opacity peer-checked:opacity-100">
<span class="material-symbols-outlined text-[20px] font-bold">check_circle</span>
</div>
</label>
<!-- Amenity Card: Selected -->
<label class="group relative flex cursor-pointer flex-col items-start gap-3 rounded-2xl border-2 border-primary bg-primary/5 p-4 transition-all dark:bg-primary/10">
<input checked="" class="peer sr-only" type="checkbox"/>
<div class="flex size-8 items-center justify-center rounded-full bg-white dark:bg-surface-dark text-primary shadow-sm">
<span class="material-symbols-outlined text-[20px]">ac_unit</span>
</div>
<span class="font-semibold text-text-main-light dark:text-text-main-dark">Heating/AC</span>
<div class="absolute top-3 right-3 text-primary opacity-100 transition-opacity">
<span class="material-symbols-outlined text-[20px] font-bold">check_circle</span>
</div>
</label>
<!-- Amenity Card: Unselected -->
<label class="group relative flex cursor-pointer flex-col items-start gap-3 rounded-2xl border-2 border-transparent bg-background-light dark:bg-background-dark p-4 transition-all hover:bg-gray-100 dark:hover:bg-gray-800 dark:border-gray-800">
<input class="peer sr-only" type="checkbox"/>
<div class="flex size-8 items-center justify-center rounded-full bg-white dark:bg-surface-dark text-text-secondary-light dark:text-text-secondary-dark shadow-sm">
<span class="material-symbols-outlined text-[20px]">bed</span>
</div>
<span class="font-medium text-text-main-light dark:text-text-main-dark">Queen Bed</span>
<div class="absolute top-3 right-3 text-primary opacity-0 transition-opacity peer-checked:opacity-100">
<span class="material-symbols-outlined text-[20px] font-bold">check_circle</span>
</div>
</label>
<!-- Amenity Card: Unselected -->
<label class="group relative flex cursor-pointer flex-col items-start gap-3 rounded-2xl border-2 border-transparent bg-background-light dark:bg-background-dark p-4 transition-all hover:bg-gray-100 dark:hover:bg-gray-800 dark:border-gray-800">
<input class="peer sr-only" type="checkbox"/>
<div class="flex size-8 items-center justify-center rounded-full bg-white dark:bg-surface-dark text-text-secondary-light dark:text-text-secondary-dark shadow-sm">
<span class="material-symbols-outlined text-[20px]">deck</span>
</div>
<span class="font-medium text-text-main-light dark:text-text-main-dark">Outdoor Seat</span>
<div class="absolute top-3 right-3 text-primary opacity-0 transition-opacity peer-checked:opacity-100">
<span class="material-symbols-outlined text-[20px] font-bold">check_circle</span>
</div>
</label>
<!-- Amenity Card: Unselected -->
<label class="group relative flex cursor-pointer flex-col items-start gap-3 rounded-2xl border-2 border-transparent bg-background-light dark:bg-background-dark p-4 transition-all hover:bg-gray-100 dark:hover:bg-gray-800 dark:border-gray-800">
<input class="peer sr-only" type="checkbox"/>
<div class="flex size-8 items-center justify-center rounded-full bg-white dark:bg-surface-dark text-text-secondary-light dark:text-text-secondary-dark shadow-sm">
<span class="material-symbols-outlined text-[20px]">wifi</span>
</div>
<span class="font-medium text-text-main-light dark:text-text-main-dark">Free WiFi</span>
<div class="absolute top-3 right-3 text-primary opacity-0 transition-opacity peer-checked:opacity-100">
<span class="material-symbols-outlined text-[20px] font-bold">check_circle</span>
</div>
</label>
</div>
<!-- Other Input -->
<div class="mt-4">
<div class="relative flex items-center rounded-2xl bg-background-light dark:bg-background-dark px-4 py-3 border border-transparent focus-within:border-primary focus-within:ring-1 focus-within:ring-primary dark:border-gray-800">
<span class="material-symbols-outlined text-text-secondary-light dark:text-text-secondary-dark mr-3">add_circle</span>
<input class="w-full bg-transparent text-text-main-light dark:text-text-main-dark placeholder-text-secondary-light/70 dark:placeholder-text-secondary-dark/70 focus:outline-none border-none p-0 text-base font-medium" placeholder="Other amenity (e.g. Fire pit)" type="text"/>
</div>
</div>
</section>
<!-- Capacity Section -->
<section class="mb-4">
<h3 class="text-text-main-light dark:text-text-main-dark text-lg font-bold leading-tight tracking-[-0.015em] mb-4">Max Capacity</h3>
<div class="rounded-2xl bg-background-light dark:bg-background-dark p-6 border border-transparent dark:border-gray-800">
<div class="flex justify-between items-center mb-2">
<label class="text-sm font-medium text-text-secondary-light dark:text-text-secondary-dark">Guests per unit</label>
<span class="text-xl font-bold text-text-main-light dark:text-text-main-dark">2 People</span>
</div>
<input class="w-full h-2 bg-gray-200 dark:bg-gray-700 rounded-lg appearance-none cursor-pointer accent-primary" max="10" min="1" type="range" value="2"/>
<div class="flex justify-between mt-2 text-xs text-text-secondary-light dark:text-text-secondary-dark font-medium">
<span>1</span>
<span>5</span>
<span>10+</span>
</div>
</div>
</section>
</main>
<!-- Fixed Bottom Action -->
<div class="absolute bottom-0 left-0 w-full p-4 bg-surface-light dark:bg-surface-dark border-t border-gray-100 dark:border-gray-800 z-20">
<button class="flex w-full items-center justify-center gap-2 rounded-xl bg-primary px-6 py-4 transition-transform hover:scale-[1.01] active:scale-[0.98] shadow-lg shadow-primary/20">
<span class="text-text-main-light text-base font-bold leading-normal">Next: Review Property</span>
<span class="material-symbols-outlined text-text-main-light">arrow_forward</span>
</button>
</div>
</div>
</body></html>
