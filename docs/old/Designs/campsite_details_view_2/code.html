<body class="font-display bg-background-light dark:bg-background-dark text-[#111418] dark:text-white">

<div class="w-10"></div>

<input class="w-full rounded-xl border-gray-200 bg-white dark:bg-gray-800 pl-10 p-3.5 text-sm font-medium focus:border-primary focus:ring-primary dark:border-gray-700 dark:text-white placeholder-gray-400 shadow-sm" placeholder="City, County" type="text" value="Bantry, Co. Cork, Ireland"/>
</div>
</div>
<div class="flex flex-col gap-3">

<button class="rounded-full bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-300 px-4 py-2 text-xs font-bold hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">

                    </button>
<button class="rounded-full bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-300 px-4 py-2 text-xs font-bold hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors flex items-center gap-1">

<p class="text-xs text-right text-gray-400">243/500</p>

<button class="absolute top-1.5 right-1.5 bg-black/50 backdrop-blur-sm text-white rounded-full p-1 hover:bg-red-500 transition-colors"><span class="material-symbols-outlined text-xs">close</span></button>
</div>
</div>
<p class="text-xs text-gray-500 dark:text-gray-400">Drag to reorder. Add at least 3 photos to showcase your campsite.</p>
</div>
<div class="h-px bg-gray-200 dark:bg-gray-800 w-full"></div>
<div class="flex flex-col gap-5">

<div class="grid grid-cols-2 gap-3">
<button class="group flex items-center gap-3 p-3.5 rounded-xl bg-primary/5 border border-primary transition-all text-left shadow-sm">
<span class="material-symbols-outlined text-primary">wifi</span>

<span class="material-symbols-outlined text-primary ml-auto text-lg" style="font-variation-settings: 'FILL' 1;">check_circle</span>

<button class="group flex items-center gap-3 p-3.5 rounded-xl bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 hover:border-gray-300 dark:hover:border-gray-600 transition-all text-left shadow-sm">

<span class="material-symbols-outlined text-gray-400 group-hover:text-gray-600 dark:group-hover:text-gray-300">local_laundry_service</span>
<span class="text-sm font-medium text-gray-600 dark:text-gray-300 group-hover:text-gray-900 dark:group-hover:text-white">Laundry</span>
</button>
</div>
<button class="text-primary text-sm font-bold self-start hover:underline flex items-center gap-1">
<span class="material-symbols-outlined text-lg">add_circle</span> Show more amenities
            </button>

<div class="h-px bg-gray-200 dark:bg-gray-800 w-full"></div>
