<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Forgot Password - my-island</title>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Theme Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec80",
                        "primary-dark": "#0fb964",
                        "background-light": "#ffffff",
                        "background-dark": "#102219",
                        "surface-light": "#f6f8f7",
                        "surface-dark": "#1a2c24",
                        "text-primary-light": "#0d1b14",
                        "text-primary-dark": "#ffffff",
                        "text-secondary-light": "#4b5563",
                        "text-secondary-dark": "#9ca3af",
                        "border-light": "#e5e7eb",
                        "border-dark": "#2d4538",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-text-primary-light dark:text-text-primary-dark font-display antialiased min-h-screen flex flex-col transition-colors duration-200">
<!-- Top Navigation -->
<div class="flex items-center px-4 py-4 justify-between bg-background-light dark:bg-background-dark sticky top-0 z-10">
<button aria-label="Go back" class="flex size-10 items-center justify-center rounded-full hover:bg-surface-light dark:hover:bg-surface-dark transition-colors text-text-primary-light dark:text-text-primary-dark">
<span class="material-symbols-outlined !text-[24px]">arrow_back_ios_new</span>
</button>
<!-- Center Title (Optional on iOS, often omitted for cleaner look on utility pages, but included per common patterns) -->
<h2 class="text-lg font-bold leading-tight tracking-tight flex-1 text-center pr-10 opacity-0 md:opacity-100 transition-opacity">Reset Password</h2>
</div>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col w-full max-w-md mx-auto px-6 pt-4 pb-8">
<!-- Headline Section -->
<div class="mb-2">
<h1 class="text-3xl font-bold leading-tight tracking-tight text-text-primary-light dark:text-text-primary-dark mb-4">
                Forgot Password?
            </h1>
<p class="text-text-secondary-light dark:text-text-secondary-dark text-base font-normal leading-relaxed">
                Don't worry! It happens. Please enter the email address associated with your account and we’ll send you a link to reset your password.
            </p>
</div>
<!-- Illustration / Visual Element (Subtle) -->
<div class="py-8 flex justify-center">
<div class="size-32 rounded-full bg-primary/10 dark:bg-primary/5 flex items-center justify-center relative overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-tr from-primary/20 to-transparent"></div>
<span class="material-symbols-outlined !text-[48px] text-primary">lock_reset</span>
</div>
</div>
<!-- Input Form -->
<div class="flex flex-col gap-6 w-full">
<label class="flex flex-col w-full gap-2">
<span class="text-sm font-medium text-text-primary-light dark:text-text-primary-dark ml-1">Email Address</span>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-text-secondary-light dark:text-text-secondary-dark !text-[20px]">mail</span>
</div>
<input class="w-full h-14 pl-10 pr-4 rounded-xl border border-border-light dark:border-border-dark bg-surface-light dark:bg-surface-dark text-text-primary-light dark:text-text-primary-dark placeholder:text-text-secondary-light/60 dark:placeholder:text-text-secondary-dark/60 focus:ring-2 focus:ring-primary focus:border-transparent transition-all outline-none" placeholder="hello@myisland.com" type="email" value=""/>
</div>
</label>
<!-- Send Button -->
<button class="w-full h-12 mt-2 bg-primary hover:bg-primary-dark active:scale-[0.98] transition-all rounded-full flex items-center justify-center shadow-lg shadow-primary/20 text-background-dark font-bold text-base tracking-wide">
                Send Reset Link
            </button>
</div>
<!-- Spacer to push footer down if content is short, or just visual space -->
<div class="flex-1 min-h-[40px]"></div>
<!-- Footer Link -->
<div class="mt-auto py-6 text-center">
<p class="text-sm text-text-secondary-light dark:text-text-secondary-dark">
                Remember it? 
                <a class="font-bold text-primary hover:text-primary-dark transition-colors ml-1" href="#">Return to Login</a>
</p>
</div>
</main>
<!-- Simple decorative bottom pattern (optional) -->
<div class="h-2 w-full bg-gradient-to-r from-background-light via-primary/30 to-background-light dark:from-background-dark dark:via-primary/20 dark:to-background-dark"></div>
</body></html>
