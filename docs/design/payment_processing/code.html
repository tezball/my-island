<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Payment Processing</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#13ec80",
              "primary-dark": "#0fae5e",
              "background-light": "#ffffff",
              "background-dark": "#102219",
              "surface-light": "#f3f4f6",
              "surface-dark": "#1a3326",
              "text-main": "#0d1b14",
              "text-muted": "#4c9a73",
              "text-light": "#9ca3af",
            },
            fontFamily: {
              "display": ["Manrope", "sans-serif"]
            },
            borderRadius: {
              "DEFAULT": "0.375rem", 
              "md": "0.375rem",
              "lg": "0.5rem", 
              "xl": "0.75rem", 
              "2xl": "1rem",
              "full": "9999px"
            },
            boxShadow: {
              'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
            }
          },
        },
      }
    </script>
<style>
        body {
            font-family: 'Manrope', sans-serif;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex flex-col items-center justify-start overflow-x-hidden">
<!-- Mobile Container -->
<div class="w-full max-w-md bg-background-light dark:bg-background-dark min-h-screen flex flex-col relative pb-24">
<!-- Header -->
<header class="sticky top-0 z-50 bg-background-light/95 dark:bg-background-dark/95 backdrop-blur-sm p-4 flex items-center justify-between border-b border-gray-100 dark:border-white/5">
<button class="flex items-center justify-center p-2 rounded-full hover:bg-surface-light dark:hover:bg-surface-dark transition-colors text-text-main dark:text-white">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</button>
<h1 class="text-text-main dark:text-white text-lg font-bold leading-tight tracking-tight">Secure Payment</h1>
<div class="w-10"></div> <!-- Spacer for alignment -->
</header>
<!-- Main Content -->
<main class="flex-1 flex flex-col p-4 gap-6">
<!-- Order Summary Item -->
<div class="bg-surface-light dark:bg-surface-dark rounded-xl p-4 shadow-sm border border-transparent dark:border-white/5">
<div class="flex gap-4">
<div class="relative shrink-0 w-[70px] h-[70px] rounded-lg overflow-hidden bg-gray-200">
<img alt="Tent in a lush green pine forest campsite" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBiWjU5EOJLjYP1l_ffiPXtSR-UFRoXCoAwLSyx3HQ-SY_GkZsm7v3z4llbLxoZE_zRTlTBNQ1FiMOrb_GQcC3ozDoF0XRki3heE-q1i7o_nQuPTtnPjrgcOCLxScGgG4_X9w7oJQRparvES0_6YIvvun8-vhNJ_gGax_RpS6FQeW_PH0SoYciLuseygCR6hEkGMxWQOgkzElIBkqlGvZs6TIuHYID3z99s4wRt18e8sCiFCLM02ge0-wIl8OB8Ipznu2U8iUMExg"/>
</div>
<div class="flex flex-1 flex-col justify-center">
<div class="flex justify-between items-start w-full">
<h3 class="text-text-main dark:text-white text-base font-bold">Pine Valley Campsite</h3>
<span class="text-primary-dark dark:text-primary font-bold text-base">$120.00</span>
</div>
<p class="text-text-muted dark:text-gray-400 text-sm mt-1 flex items-center gap-1">
<span class="material-symbols-outlined text-sm">calendar_today</span>
                            Oct 12 - Oct 14 (2 Nights)
                        </p>
</div>
</div>
</div>
<!-- Payment Methods -->
<div>
<label class="text-text-main dark:text-white text-sm font-semibold mb-3 block px-1">Payment Method</label>
<div class="flex p-1 bg-surface-light dark:bg-surface-dark rounded-xl">
<label class="flex-1 cursor-pointer">
<input checked="" class="peer sr-only" name="payment_method" type="radio" value="card"/>
<div class="h-10 flex items-center justify-center rounded-lg text-sm font-medium text-text-muted dark:text-gray-400 transition-all peer-checked:bg-white dark:peer-checked:bg-background-dark peer-checked:text-text-main dark:peer-checked:text-white peer-checked:shadow-sm">
<span class="material-symbols-outlined mr-2 text-lg">credit_card</span>
                            Card
                        </div>
</label>
<label class="flex-1 cursor-pointer">
<input class="peer sr-only" name="payment_method" type="radio" value="apple"/>
<div class="h-10 flex items-center justify-center rounded-lg text-sm font-medium text-text-muted dark:text-gray-400 transition-all peer-checked:bg-white dark:peer-checked:bg-background-dark peer-checked:text-text-main dark:peer-checked:text-white peer-checked:shadow-sm">
<span class="material-symbols-outlined mr-2 text-lg">phone_iphone</span>
                            Apple Pay
                        </div>
</label>
<label class="flex-1 cursor-pointer">
<input class="peer sr-only" name="payment_method" type="radio" value="paypal"/>
<div class="h-10 flex items-center justify-center rounded-lg text-sm font-medium text-text-muted dark:text-gray-400 transition-all peer-checked:bg-white dark:peer-checked:bg-background-dark peer-checked:text-text-main dark:peer-checked:text-white peer-checked:shadow-sm">
<span class="material-symbols-outlined mr-2 text-lg">account_balance_wallet</span>
                            PayPal
                        </div>
</label>
</div>
</div>
<!-- Credit Card Visual -->
<div class="relative w-full aspect-[1.586/1] rounded-2xl overflow-hidden shadow-soft transition-transform hover:scale-[1.01] duration-300">
<div class="absolute inset-0 bg-gradient-to-br from-gray-800 to-black dark:from-gray-900 dark:to-black p-6 flex flex-col justify-between" data-alt="Abstract dark gradient background for credit card visualization">
<!-- Top Row -->
<div class="flex justify-between items-start z-10">
<div class="w-12 h-8 bg-white/20 rounded flex items-center justify-center backdrop-blur-md">
<div class="w-6 h-4 bg-yellow-400/80 rounded-sm"></div>
</div>
<span class="text-white/90 font-bold tracking-wider italic">VISA</span>
</div>
<!-- Middle (Number) -->
<div class="z-10 mt-4">
<p class="text-white font-mono text-xl sm:text-2xl tracking-widest drop-shadow-md">4242 4242 4242 4242</p>
</div>
<!-- Bottom -->
<div class="flex justify-between items-end z-10">
<div>
<p class="text-xs text-white/60 uppercase tracking-wide mb-1">Card Holder</p>
<p class="text-sm text-white font-medium tracking-wide">JOHN DOE</p>
</div>
<div class="text-right">
<p class="text-xs text-white/60 uppercase tracking-wide mb-1">Expires</p>
<p class="text-sm text-white font-medium tracking-wide">12/25</p>
</div>
</div>
<!-- Decorative Circle -->
<div class="absolute -bottom-12 -right-12 w-48 h-48 bg-primary/20 rounded-full blur-3xl"></div>
<div class="absolute -top-12 -left-12 w-48 h-48 bg-emerald-600/20 rounded-full blur-3xl"></div>
</div>
</div>
<!-- Card Details Form -->
<form class="flex flex-col gap-4">
<!-- Card Number -->
<div class="space-y-1.5">
<label class="text-sm font-medium text-text-main dark:text-white ml-1">Card Number</label>
<div class="relative">
<input class="w-full bg-surface-light dark:bg-surface-dark border-transparent focus:border-primary focus:ring-0 text-text-main dark:text-white rounded-lg h-12 pl-4 pr-10 placeholder:text-text-light transition-all" inputmode="numeric" placeholder="0000 0000 0000 0000" type="text"/>
<div class="absolute right-3 top-1/2 -translate-y-1/2 text-primary">
<span class="material-symbols-outlined">check_circle</span>
</div>
</div>
</div>
<!-- Name on Card -->
<div class="space-y-1.5">
<label class="text-sm font-medium text-text-main dark:text-white ml-1">Cardholder Name</label>
<input class="w-full bg-surface-light dark:bg-surface-dark border-transparent focus:border-primary focus:ring-0 text-text-main dark:text-white rounded-lg h-12 px-4 placeholder:text-text-light transition-all" placeholder="John Doe" type="text"/>
</div>
<!-- Expiry & CVV -->
<div class="flex gap-4">
<div class="flex-1 space-y-1.5">
<label class="text-sm font-medium text-text-main dark:text-white ml-1">Expiry Date</label>
<input class="w-full bg-surface-light dark:bg-surface-dark border-transparent focus:border-primary focus:ring-0 text-text-main dark:text-white rounded-lg h-12 px-4 placeholder:text-text-light transition-all text-center" inputmode="numeric" placeholder="MM/YY" type="text"/>
</div>
<div class="flex-1 space-y-1.5">
<label class="text-sm font-medium text-text-main dark:text-white ml-1 flex items-center gap-1">
                            CVV
                            <span class="material-symbols-outlined text-text-light text-[16px] cursor-help" title="3 digits on back of card">help</span>
</label>
<input class="w-full bg-surface-light dark:bg-surface-dark border-transparent focus:border-primary focus:ring-0 text-text-main dark:text-white rounded-lg h-12 px-4 placeholder:text-text-light transition-all text-center" inputmode="numeric" maxlength="3" placeholder="•••" type="password"/>
</div>
</div>
<!-- Save Card Toggle -->
<div class="flex items-center justify-between py-2">
<div class="flex items-center gap-3">
<div class="p-2 bg-primary/10 rounded-full text-primary-dark dark:text-primary">
<span class="material-symbols-outlined text-xl">save</span>
</div>
<span class="text-sm font-medium text-text-main dark:text-white">Save for future bookings</span>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-primary"></div>
</label>
</div>
</form>
</main>
<!-- Sticky Footer Action -->
<div class="sticky bottom-0 left-0 w-full p-4 bg-background-light dark:bg-background-dark border-t border-gray-100 dark:border-white/5 backdrop-blur-lg bg-opacity-90">
<div class="flex flex-col gap-3">
<div class="flex items-center justify-center gap-2 text-xs text-text-muted dark:text-gray-400 mb-1">
<span class="material-symbols-outlined text-sm">lock</span>
                    Payments are secure and encrypted
                </div>
<button class="w-full h-14 bg-primary hover:bg-primary-dark text-background-dark font-bold text-lg rounded-xl shadow-lg shadow-primary/30 transition-all active:scale-[0.98] flex items-center justify-center gap-2">
                    Pay $120.00
                    <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</div>
</div>
</body></html>
