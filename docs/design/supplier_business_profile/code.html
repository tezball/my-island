<!DOCTYPE html>

<body class="bg-background-light dark:bg-background-dark min-h-screen flex flex-col antialiased transition-colors duration-200">
<div class="relative flex h-full w-full flex-col overflow-x-hidden max-w-md mx-auto bg-background-light dark:bg-background-dark min-h-screen pb-safe">
<header class="sticky top-0 z-10 bg-background-light/90 dark:bg-background-dark/90 backdrop-blur-md px-4 py-3 flex items-center justify-between border-b border-transparent dark:border-border-dark/30">
<button class="flex items-center justify-center size-10 rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition-colors text-text-main-light dark:text-text-main-dark">
<span class="material-symbols-outlined text-[24px]">arrow_back_ios_new</span>
</button>
<h1 class="text-lg font-bold text-text-main-light dark:text-text-main-dark flex-1 text-center pr-10">Business Profile</h1>
</header>
<main class="flex-1 flex flex-col px-4 pt-4 pb-8 space-y-6">
<section class="flex flex-col items-center justify-center pt-2">
<div class="relative group cursor-pointer">
<div class="size-32 rounded-full overflow-hidden border-4 border-white dark:border-surface-dark shadow-sm bg-surface-light dark:bg-surface-dark">
<div class="w-full h-full bg-cover bg-center" data-alt="Close up of a green forest canopy representing nature business" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuC8n9ct8Jlk6ucKAmvpc97wm1ykDwVm2VgsywDo_O4bobXeTbwoNvxyh0TweFOZ1GcqZX34_yK3GvR4hORD574RTMyAQ-HlvIJ_cWWhUsJcti7J5Q1ug15T4exIgFNqQ0jomWhJDtaKb3WNycun_3yduVUvRVen9Pd8nEip8cTo6L1Rm7orTF4b79wXDfWnZSkAwKsZLHYBYRsW8l8FQEmMnXJJEuRJy29TMeoumxyBlpT9PzoahuAgSCfV-tl1hwUuHNaIJY_QfA');">
</div>
</div>
<div class="absolute bottom-0 right-0 bg-primary text-background-dark p-2 rounded-full shadow-lg border-2 border-background-light dark:border-background-dark flex items-center justify-center transform transition-transform group-hover:scale-110">
<span class="material-symbols-outlined text-[20px]">photo_camera</span>
</div>
</div>
<div class="mt-3 text-center">
<h2 class="text-text-main-light dark:text-text-main-dark text-lg font-semibold">Business Logo</h2>
<p class="text-text-secondary-light dark:text-text-secondary-dark text-sm">Tap to update your public image</p>
</div>
</section>
<form class="flex flex-col gap-5 w-full">
<div class="space-y-4">
<div class="flex items-center gap-2 mb-1">
<span class="material-symbols-outlined text-primary text-[20px]">storefront</span>
<h3 class="text-sm font-semibold uppercase tracking-wider text-text-secondary-light dark:text-text-secondary-dark">Public Details</h3>
</div>
<label class="flex flex-col gap-2">
<span class="text-text-main-light dark:text-text-main-dark text-sm font-medium">Business Name</span>
<input class="form-input w-full rounded-xl border border-border-light dark:border-border-dark bg-white dark:bg-surface-dark text-text-main-light dark:text-text-main-dark placeholder:text-text-secondary-light/70 dark:placeholder:text-text-secondary-dark/50 focus:border-primary focus:ring-1 focus:ring-primary h-12 px-4 transition-all" placeholder="e.g. Sunny Side Camping" type="text"/>
</label>
<label class="flex flex-col gap-2">
<span class="text-text-main-light dark:text-text-main-dark text-sm font-medium">Description</span>
<textarea class="form-textarea w-full rounded-xl border border-border-light dark:border-border-dark bg-white dark:bg-surface-dark text-text-main-light dark:text-text-main-dark placeholder:text-text-secondary-light/70 dark:placeholder:text-text-secondary-dark/50 focus:border-primary focus:ring-1 focus:ring-primary min-h-[120px] px-4 py-3 resize-none transition-all" placeholder="Tell campers what makes your site unique..."></textarea>
</label>
</div>
<div class="h-px bg-border-light dark:bg-border-dark/50 w-full my-1"></div>
<div class="space-y-4">
<div class="flex items-center gap-2 mb-1">
<span class="material-symbols-outlined text-primary text-[20px]">contact_phone</span>
<h3 class="text-sm font-semibold uppercase tracking-wider text-text-secondary-light dark:text-text-secondary-dark">Contact Information</h3>
</div>
<label class="flex flex-col gap-2">
<span class="text-text-main-light dark:text-text-main-dark text-sm font-medium">Location</span>
<div class="relative">
<input class="form-input w-full rounded-xl border border-border-light dark:border-border-dark bg-white dark:bg-surface-dark text-text-main-light dark:text-text-main-dark placeholder:text-text-secondary-light/70 dark:placeholder:text-text-secondary-dark/50 focus:border-primary focus:ring-1 focus:ring-primary h-12 pl-11 pr-4 transition-all" placeholder="e.g. 123 Forest Road, Green Valley" type="text"/>
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-text-secondary-light dark:text-text-secondary-dark">location_on</span>
</div>
</label>
<label class="flex flex-col gap-2">
<span class="text-text-main-light dark:text-text-main-dark text-sm font-medium">Contact Email</span>
<div class="relative">
<input class="form-input w-full rounded-xl border border-border-light dark:border-border-dark bg-white dark:bg-surface-dark text-text-main-light dark:text-text-main-dark placeholder:text-text-secondary-light/70 dark:placeholder:text-text-secondary-dark/50 focus:border-primary focus:ring-1 focus:ring-primary h-12 pl-11 pr-4 transition-all" placeholder="contact@business.com" type="email"/>
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-text-secondary-light dark:text-text-secondary-dark">mail</span>
</div>
</label>
<label class="flex flex-col gap-2">
<span class="text-text-main-light dark:text-text-main-dark text-sm font-medium">Phone Number</span>
<div class="relative">
<input class="form-input w-full rounded-xl border border-border-light dark:border-border-dark bg-white dark:bg-surface-dark text-text-main-light dark:text-text-main-dark placeholder:text-text-secondary-light/70 dark:placeholder:text-text-secondary-dark/50 focus:border-primary focus:ring-1 focus:ring-primary h-12 pl-11 pr-4 transition-all" placeholder="+1 (555) 000-0000" type="tel"/>
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-text-secondary-light dark:text-text-secondary-dark">call</span>
</div>
</label>
</div>
</form>
</main>
<div class="sticky bottom-0 w-full bg-background-light/90 dark:bg-background-dark/90 backdrop-blur-lg border-t border-border-light dark:border-border-dark p-4 pb-8 flex flex-col gap-3">
<button class="w-full h-12 bg-primary hover:bg-primary-dark active:scale-[0.98] rounded-xl text-background-dark font-bold text-base shadow-sm transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[20px]">save</span>
                Save Changes
            </button>
<button class="w-full h-12 bg-transparent hover:bg-black/5 dark:hover:bg-white/5 active:scale-[0.98] rounded-xl text-text-secondary-light dark:text-text-secondary-dark font-medium text-base transition-all">
                Cancel
            </button>
</div>
</div>
