<body class="bg-background-light dark:bg-background-dark font-display antialiased overflow-x-hidden">
<div class="relative flex h-full min-h-screen w-full flex-col max-w-md mx-auto shadow-2xl overflow-hidden bg-background-light dark:bg-background-dark">
<!-- Header -->
<header class="flex items-center justify-between p-4 sticky top-0 z-20 bg-background-light/95 dark:bg-background-dark/95 backdrop-blur-sm">
<button class="text-text-main dark:text-white flex size-10 shrink-0 items-center justify-center rounded-full hover:bg-surface-light dark:hover:bg-surface-dark transition-colors">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<div class="flex flex-col text-center">
<h1 class="text-text-main dark:text-white text-lg font-bold leading-tight">Choose Your Spot</h1>
<p class="text-text-secondary text-xs font-medium">Oct 12 - Oct 14 • 2 Guests</p>
</div>
<button class="flex size-10 items-center justify-center">
<span class="material-symbols-outlined text-text-secondary text-[24px]">tune</span>
</button>
</header>
<!-- View Toggle (Segmented Control) -->
<div class="px-4 pb-4">
<div class="flex h-12 w-full items-center rounded-xl bg-surface-light dark:bg-surface-dark p-1 relative">
<!-- Active Indicator Background -->
<div class="absolute left-1 top-1 bottom-1 w-[calc(50%-4px)] rounded-lg bg-white dark:bg-background-dark shadow-sm transition-transform duration-300 ease-out translate-x-0" id="toggle-indicator"></div>
<button class="flex-1 z-10 flex items-center justify-center gap-2 text-sm font-semibold text-text-main dark:text-white transition-colors" onclick="toggleView('map')">
<span class="material-symbols-outlined text-[20px] fill-1">map</span>
                    Map View
                </button>
<button class="flex-1 z-10 flex items-center justify-center gap-2 text-sm font-medium text-text-secondary transition-colors" onclick="toggleView('list')">
<span class="material-symbols-outlined text-[20px]">format_list_bulleted</span>
                    List View
                </button>
</div>
</div>
<!-- Filter Chips -->
<div class="flex gap-2 px-4 pb-4 overflow-x-auto no-scrollbar">
<button class="flex h-9 shrink-0 items-center justify-center gap-x-2 rounded-full bg-primary text-text-main px-4 shadow-sm shadow-primary/20">
<span class="text-sm font-bold">All Sites</span>
</button>
<button class="flex h-9 shrink-0 items-center justify-center gap-x-2 rounded-full bg-surface-light dark:bg-surface-dark border border-transparent hover:border-primary/30 px-4 transition-all">
<span class="material-symbols-outlined text-[18px] text-text-secondary">rv_hookup</span>
<span class="text-text-main dark:text-white text-sm font-medium">RV</span>
</button>
<button class="flex h-9 shrink-0 items-center justify-center gap-x-2 rounded-full bg-surface-light dark:bg-surface-dark border border-transparent hover:border-primary/30 px-4 transition-all">
<span class="material-symbols-outlined text-[18px] text-text-secondary">camping</span>
<span class="text-text-main dark:text-white text-sm font-medium">Tent</span>
</button>
<button class="flex h-9 shrink-0 items-center justify-center gap-x-2 rounded-full bg-surface-light dark:bg-surface-dark border border-transparent hover:border-primary/30 px-4 transition-all">
<span class="material-symbols-outlined text-[18px] text-text-secondary">cottage</span>
<span class="text-text-main dark:text-white text-sm font-medium">Glamping</span>
</button>
<button class="flex h-9 shrink-0 items-center justify-center gap-x-2 rounded-full bg-surface-light dark:bg-surface-dark border border-transparent hover:border-primary/30 px-4 transition-all">
<span class="material-symbols-outlined text-[18px] text-text-secondary">water_drop</span>
<span class="text-text-main dark:text-white text-sm font-medium">Waterfront</span>
</button>
</div>
<!-- Main Content Area -->
<div class="flex-1 relative bg-surface-light dark:bg-surface-dark rounded-t-2xl overflow-hidden shadow-[0_-4px_16px_rgba(0,0,0,0.02)]">
<!-- Map Layer (Ideally this would be a canvas or map lib, simulating with image and absolute markers) -->
<div class="absolute inset-0 z-0 overflow-hidden">
<div class="relative w-full h-full bg-[#e5eadd] dark:bg-[#1a2c24] bg-[url('https://images.unsplash.com/photo-1524661135-423995f22d0b?ixlib=rb-4.0.3&amp;auto=format&amp;fit=crop&amp;w=1000&amp;q=80')] bg-cover bg-center opacity-80" data-alt="Top down illustration of a green campsite map with trees and paths" data-location="Campsite Map" style="https://placeholder.pics/svg/300">

<div class="absolute top-4 left-4 right-4 z-10">
<div class="flex items-center bg-white dark:bg-surface-dark rounded-xl shadow-lg p-1 pr-2">
<div class="flex items-center justify-center w-10 h-10 text-text-secondary">
<span class="material-symbols-outlined">search</span>
</div>
<input class="flex-1 bg-transparent border-none focus:ring-0 text-text-main dark:text-white text-sm placeholder:text-text-secondary/70" placeholder="Search lot number..." type="text"/>
</div>
</div>
<!-- Map Controls -->
<div class="absolute right-4 bottom-32 z-10 flex flex-col gap-2">
<button class="size-10 bg-white dark:bg-surface-dark rounded-xl shadow-lg flex items-center justify-center text-text-main dark:text-white hover:bg-gray-50 dark:hover:bg-gray-800">
<span class="material-symbols-outlined">my_location</span>
</button>
<div class="bg-white dark:bg-surface-dark rounded-xl shadow-lg flex flex-col overflow-hidden">
<button class="size-10 flex items-center justify-center text-text-main dark:text-white hover:bg-gray-50 dark:hover:bg-gray-800 border-b border-gray-100 dark:border-gray-700">
<span class="material-symbols-outlined">add</span>
</button>
<button class="size-10 flex items-center justify-center text-text-main dark:text-white hover:bg-gray-50 dark:hover:bg-gray-800">
<span class="material-symbols-outlined">remove</span>
</button>
</div>
</div>
<!-- Map Pins (Simulated) -->
<!-- Active Pin -->
<button class="absolute top-[45%] left-[30%] -translate-x-1/2 -translate-y-1/2 group flex flex-col items-center gap-1 z-20">
<div class="bg-text-main text-white text-[10px] font-bold px-2 py-0.5 rounded-full opacity-0 group-hover:opacity-100 transition-opacity shadow-sm whitespace-nowrap">$45</div>
<div class="size-8 bg-primary rounded-full shadow-[0_2px_8px_rgba(19,236,128,0.5)] border-2 border-white dark:border-surface-dark flex items-center justify-center transform group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-text-main text-[18px]">camping</span>
</div>
</button>
<!-- Inactive Pins -->
<button class="absolute top-[35%] left-[60%] -translate-x-1/2 -translate-y-1/2 flex flex-col items-center gap-1">
<div class="size-6 bg-white dark:bg-surface-dark text-text-main dark:text-white rounded-full shadow-md flex items-center justify-center text-xs font-bold hover:scale-110 transition-transform">
                            14
                        </div>
</button>
<button class="absolute top-[55%] left-[75%] -translate-x-1/2 -translate-y-1/2 flex flex-col items-center gap-1">
<div class="size-6 bg-white dark:bg-surface-dark text-text-main dark:text-white rounded-full shadow-md flex items-center justify-center text-xs font-bold hover:scale-110 transition-transform">
                            15
                        </div>
</button>
<!-- Occupied Pin -->
<button class="absolute top-[25%] left-[40%] -translate-x-1/2 -translate-y-1/2 flex flex-col items-center gap-1 opacity-60">
<div class="size-4 bg-gray-400 rounded-full shadow-sm border border-white"></div>
</button>
</div>
</div>
<!-- Bottom Sheet (Lot Preview) -->
<div class="absolute bottom-0 left-0 right-0 z-30 bg-background-light dark:bg-surface-dark rounded-t-3xl shadow-[0_-8px_30px_rgba(0,0,0,0.12)] p-5 transform transition-transform duration-300">
<div class="w-12 h-1 bg-gray-200 dark:bg-gray-700 rounded-full mx-auto mb-4"></div>
<div class="flex gap-4">
<div class="w-24 h-24 rounded-xl bg-gray-100 overflow-hidden shrink-0 relative">
<div class="absolute inset-0 bg-cover bg-center" data-alt="Sunny campsite with a tent set up near trees" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuACG6Md8ia4whKeUAgFD80P5KgAZlSrJkzpwn2JSHEWyMkl7o0PPh8C2SZ7sgK-A-LSiN1Bkgftc7ACzFYAToW3msZJb_U8a0FBGgLhRzDxU8kKk7ASsY7zTKyX3i84gzvLxaYMKv-UHohq5VW6e_tMXIB-Loke-x-K6nQ_L6Fd-enBRJSKLC9avGgwYXWWpB-W_ptCvR89Z5i9iIuPJwpRr2lLNLpCAE54lJIfZoD0AO9VgDquQk56Im5DcUl-osRVXXgIglgPLg')"></div>
<div class="absolute top-1 right-1 bg-white/90 backdrop-blur-sm rounded-md px-1.5 py-0.5">
<span class="text-[10px] font-bold text-text-main">4.8★</span>
</div>
</div>
<div class="flex-1 flex flex-col justify-between">
<div>
<div class="flex justify-between items-start">
<div>
<h3 class="text-text-main dark:text-white font-bold text-lg leading-tight">Site 12 - Forest Edge</h3>
<p class="text-text-secondary text-xs mt-0.5">Tent Only • No Hookups</p>
</div>
<div class="flex flex-col items-end">
<span class="text-lg font-bold text-primary">$45</span>
<span class="text-[10px] text-text-secondary">/ night</span>
</div>
</div>
</div>
<div class="flex items-center gap-3 mt-2">
<div class="flex items-center gap-1 text-text-secondary" title="Fire Pit">
<span class="material-symbols-outlined text-[16px]">local_fire_department</span>
<span class="text-[10px] font-medium">Fire Pit</span>
</div>
<div class="flex items-center gap-1 text-text-secondary" title="Pet Friendly">
<span class="material-symbols-outlined text-[16px]">pets</span>
<span class="text-[10px] font-medium">Pets</span>
</div>
</div>
</div>
</div>
<div class="mt-5">
<button class="w-full h-12 bg-primary hover:bg-primary-dark active:scale-[0.98] transition-all rounded-xl text-text-main font-bold text-base shadow-lg shadow-primary/25 flex items-center justify-center gap-2">
                        Select Site
                        <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</div>
</div>
<!-- Hidden List View (Overlay for demo purposes, in real app this would toggle display) -->
<!-- Just adding a hint of the list view logic to be comprehensive, 
             though visually represented by the "Map View" primarily requested by the layout complexity. 
             If user clicks 'List View' we'd swap the 'Main Content Area' content. -->
</div>
<script>
        // Simple logic to toggle visual state for the demo
        function toggleView(view) {
            const indicator = document.getElementById('toggle-indicator');
            if (view === 'list') {
                indicator.style.transform = 'translateX(100%)';
                // In a real app, this would hide the map div and show a list div
            } else {
                indicator.style.transform = 'translateX(0)';
            }
        }
    </script>
</body></html>
