<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Add Payment - my-island</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
            extend: {
                colors: {
                "primary": "#13ec80",
                "background-light": "#f6f8f7",
                "background-dark": "#102219",
                },
                fontFamily: {
                "display": ["Inter", "sans-serif"]
                },
                borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
            },
            },
        }
    </script>
<style>
        /* Custom scrollbar for cleaner look if needed */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
        
        /* Glassmorphism utility for the card */
        .glass-panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-[#111814] dark:text-white antialiased">
<div class="relative flex h-full min-h-screen w-full flex-col overflow-x-hidden max-w-md mx-auto bg-background-light dark:bg-background-dark shadow-2xl">
<!-- Top Navigation -->
<div class="flex items-center px-4 py-4 justify-between sticky top-0 z-20 bg-background-light/90 dark:bg-background-dark/90 backdrop-blur-sm">
<button class="flex size-10 shrink-0 items-center justify-center rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined text-[#111814] dark:text-white" style="font-size: 24px;">arrow_back</span>
</button>
<h2 class="text-[#111814] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-10">Add Payment</h2>
</div>
<!-- Scrollable Content -->
<div class="flex-1 flex flex-col px-4 pb-24">
<!-- Card Visualization -->
<div class="py-6">
<div class="relative w-full aspect-[1.58/1] rounded-xl shadow-xl overflow-hidden transition-all duration-300 hover:shadow-2xl hover:scale-[1.01]" data-alt="Abstract emerald green gradient pattern representing nature">
<!-- Dynamic Nature Gradient Background -->
<div class="absolute inset-0 bg-gradient-to-br from-[#13ec80] via-[#0e7a46] to-[#052e1f]"></div>
<!-- Decorative Abstract Circles -->
<div class="absolute top-[-50%] right-[-20%] w-[80%] h-[80%] rounded-full border border-white/10"></div>
<div class="absolute bottom-[-20%] left-[-20%] w-[60%] h-[60%] rounded-full bg-[#13ec80]/20 blur-3xl"></div>
<!-- Card Content -->
<div class="relative z-10 flex flex-col justify-between h-full p-6 text-white">
<div class="flex justify-between items-start">
<span class="material-symbols-outlined text-3xl opacity-80">contactless</span>
<span class="font-bold text-lg italic opacity-90">VISA</span>
</div>
<div class="flex flex-col gap-6">
<div class="flex gap-3 items-center">
<p class="font-mono text-2xl tracking-widest text-shadow-sm">4254</p>
<p class="font-mono text-2xl tracking-widest text-shadow-sm">••••</p>
<p class="font-mono text-2xl tracking-widest text-shadow-sm">••••</p>
<p class="font-mono text-2xl tracking-widest text-shadow-sm">1234</p>
</div>
<div class="flex justify-between items-end">
<div class="flex flex-col gap-1">
<span class="text-[10px] uppercase tracking-wider opacity-70">Card Holder</span>
<p class="font-medium text-sm tracking-wide">JOHN DOE</p>
</div>
<div class="flex flex-col gap-1 items-end">
<span class="text-[10px] uppercase tracking-wider opacity-70">Expires</span>
<p class="font-medium text-sm tracking-wide">12/25</p>
</div>
</div>
</div>
</div>
<!-- Glossy Sheen Overlay -->
<div class="absolute inset-0 bg-gradient-to-br from-white/10 to-transparent opacity-50 pointer-events-none"></div>
</div>
</div>
<!-- Form Fields -->
<div class="flex flex-col gap-5 mt-2">
<!-- Card Number -->
<label class="flex flex-col w-full group">
<p class="text-[#111814] dark:text-gray-300 text-sm font-medium leading-normal pb-2 ml-1">Card Number</p>
<div class="flex w-full items-stretch rounded-xl bg-white dark:bg-[#1a2c24] border border-[#dbe6e0] dark:border-[#2a4538] focus-within:border-primary focus-within:ring-1 focus-within:ring-primary transition-all shadow-sm">
<span class="material-symbols-outlined self-center pl-4 text-gray-400 dark:text-gray-500">credit_card</span>
<input class="flex w-full min-w-0 flex-1 resize-none overflow-hidden bg-transparent text-[#111814] dark:text-white placeholder:text-[#9ca3af] dark:placeholder:text-[#4b5563] h-12 p-3 text-base font-normal leading-normal focus:outline-0 border-none focus:ring-0" placeholder="0000 0000 0000 0000" type="tel"/>
<button class="flex items-center justify-center pr-4 text-gray-400 hover:text-primary transition-colors">
<span class="material-symbols-outlined">center_focus_strong</span>
</button>
</div>
</label>
<!-- Cardholder Name -->
<label class="flex flex-col w-full group">
<p class="text-[#111814] dark:text-gray-300 text-sm font-medium leading-normal pb-2 ml-1">Cardholder Name</p>
<div class="flex w-full items-stretch rounded-xl bg-white dark:bg-[#1a2c24] border border-[#dbe6e0] dark:border-[#2a4538] focus-within:border-primary focus-within:ring-1 focus-within:ring-primary transition-all shadow-sm">
<span class="material-symbols-outlined self-center pl-4 text-gray-400 dark:text-gray-500">person</span>
<input class="flex w-full min-w-0 flex-1 resize-none overflow-hidden bg-transparent text-[#111814] dark:text-white placeholder:text-[#9ca3af] dark:placeholder:text-[#4b5563] h-12 p-3 text-base font-normal leading-normal focus:outline-0 border-none focus:ring-0" placeholder="John Doe" type="text"/>
</div>
</label>
<!-- Expiry & CVV Row -->
<div class="flex gap-4">
<label class="flex flex-col flex-1 group">
<p class="text-[#111814] dark:text-gray-300 text-sm font-medium leading-normal pb-2 ml-1">Expiry Date</p>
<div class="flex w-full items-stretch rounded-xl bg-white dark:bg-[#1a2c24] border border-[#dbe6e0] dark:border-[#2a4538] focus-within:border-primary focus-within:ring-1 focus-within:ring-primary transition-all shadow-sm">
<input class="flex w-full min-w-0 flex-1 bg-transparent text-[#111814] dark:text-white placeholder:text-[#9ca3af] dark:placeholder:text-[#4b5563] h-12 p-3 px-4 text-base font-normal leading-normal focus:outline-0 border-none focus:ring-0" placeholder="MM/YY" type="tel"/>
</div>
</label>
<label class="flex flex-col flex-1 group">
<p class="text-[#111814] dark:text-gray-300 text-sm font-medium leading-normal pb-2 ml-1">CVV</p>
<div class="flex w-full items-stretch rounded-xl bg-white dark:bg-[#1a2c24] border border-[#dbe6e0] dark:border-[#2a4538] focus-within:border-primary focus-within:ring-1 focus-within:ring-primary transition-all shadow-sm">
<input class="flex w-full min-w-0 flex-1 bg-transparent text-[#111814] dark:text-white placeholder:text-[#9ca3af] dark:placeholder:text-[#4b5563] h-12 p-3 px-4 text-base font-normal leading-normal focus:outline-0 border-none focus:ring-0" maxlength="4" placeholder="123" type="tel"/>
<div class="flex items-center pr-3 group relative cursor-help">
<span class="material-symbols-outlined text-gray-400 text-[20px]">help</span>
</div>
</div>
</label>
</div>
<!-- Toggle Switch -->
<div class="flex items-center justify-between py-2 mt-2 px-1">
<span class="text-[#111814] dark:text-white text-base font-medium">Set as default payment method</span>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox" value=""/>
<div class="w-12 h-7 bg-gray-200 peer-focus:outline-none dark:bg-gray-700 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-6 after:w-6 after:transition-all peer-checked:bg-primary border-transparent"></div>
</label>
</div>
</div>
</div>
<!-- Sticky Footer Action -->
<div class="sticky bottom-0 left-0 w-full p-4 bg-background-light dark:bg-background-dark border-t border-gray-100 dark:border-white/5 pb-8">
<button class="w-full bg-primary hover:bg-[#0fd975] active:scale-[0.98] transition-all text-[#102219] font-bold h-14 rounded-xl text-lg shadow-lg shadow-primary/20 flex items-center justify-center gap-2">
<span>Save Card</span>
</button>
<div class="flex items-center justify-center gap-1.5 mt-4 opacity-60">
<span class="material-symbols-outlined text-[16px] text-gray-500 dark:text-gray-400">lock</span>
<p class="text-xs text-gray-500 dark:text-gray-400 font-medium">Your payment info is stored securely</p>
</div>
</div>
</div>
</body></html>
