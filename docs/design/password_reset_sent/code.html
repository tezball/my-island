<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Password Reset Sent</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Noto+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#13ec80",
              "background-light": "#f6f8f7",
              "background-dark": "#102219",
            },
            fontFamily: {
              "display": ["Plus Jakarta Sans", "Noto Sans", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
            animation: {
                'float': 'float 6s ease-in-out infinite',
            },
            keyframes: {
                float: {
                    '0%, 100%': { transform: 'translateY(0)' },
                    '50%': { transform: 'translateY(-10px)' },
                }
            }
          },
        },
      }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-[#0d1b14] dark:text-white font-display antialiased overflow-x-hidden selection:bg-primary selection:text-[#0d1b14]">
<div class="relative flex min-h-screen w-full flex-col justify-between group/design-root transition-colors duration-300 ease-in-out">
<!-- Top Navigation -->
<div class="flex items-center p-4 justify-between sticky top-0 z-10 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-sm">
<!-- Using a button for better accessibility on the back action -->
<button class="flex size-12 shrink-0 items-center justify-center rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition-colors text-[#0d1b14] dark:text-white">
<span class="material-symbols-outlined">arrow_back</span>
</button>
</div>
<!-- Main Content Area (Centered) -->
<div class="flex flex-1 flex-col items-center justify-center px-6 -mt-10 w-full max-w-md mx-auto">
<!-- Hero Icon / Visual -->
<div class="mb-8 relative group">
<!-- Decorative background glow behind the icon -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-40 h-40 bg-primary/20 rounded-full blur-3xl dark:bg-primary/10"></div>
<!-- Icon Container -->
<div class="relative flex items-center justify-center w-32 h-32 bg-white dark:bg-[#1a2e25] rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)] dark:shadow-none border border-white dark:border-[#2a4034] ring-1 ring-primary/10 animate-float">
<!-- Checkmark Badge -->
<div class="absolute -top-1 -right-1 w-10 h-10 bg-primary rounded-full flex items-center justify-center border-[4px] border-background-light dark:border-background-dark shadow-sm z-10">
<span class="material-symbols-outlined text-[#0d1b14] text-[20px] font-bold">check</span>
</div>
<!-- Main Icon -->
<span class="material-symbols-outlined text-primary text-[64px]" style="font-variation-settings: 'FILL' 1, 'wght' 300, 'GRAD' 0, 'opsz' 48;">
                        mark_email_read
                    </span>
</div>
</div>
<!-- Headline -->
<h1 class="text-[#0d1b14] dark:text-white tracking-tight text-[32px] font-bold leading-tight px-4 text-center pb-4">
                Check your mail
            </h1>
<!-- Body Text -->
<div class="max-w-[320px] mx-auto text-center space-y-4">
<p class="text-[#4f6458] dark:text-[#a0b3a8] text-base font-normal leading-relaxed">
                    We have sent password recovery instructions to your email <span class="text-[#0d1b14] dark:text-white font-semibold">user@example.com</span>.
                </p>
<div class="h-px w-16 bg-gradient-to-r from-transparent via-gray-200 dark:via-gray-700 to-transparent mx-auto"></div>
<p class="text-sm text-[#4f6458] dark:text-[#a0b3a8]">
                    Did not receive the email? Check your spam filter or <button class="text-primary font-bold hover:underline cursor-pointer inline-flex items-center gap-1 align-bottom">try another email</button>.
                </p>
</div>
<!-- Spacer -->
<div class="h-10"></div>
<!-- Actions -->
<div class="w-full space-y-3">
<!-- Primary Action -->
<button class="flex w-full items-center justify-center gap-2 bg-primary hover:bg-[#0fdc75] text-[#0d1b14] h-14 rounded-xl font-bold text-base transition-all active:scale-[0.98] shadow-[0_4px_16px_rgba(19,236,128,0.25)] hover:shadow-[0_6px_20px_rgba(19,236,128,0.35)]">
<span class="material-symbols-outlined text-[20px]">mail</span>
                    Open Email App
                </button>
<!-- Secondary Action -->
<button class="flex w-full items-center justify-center gap-2 bg-transparent text-[#0d1b14] dark:text-white h-14 rounded-xl font-semibold text-base transition-colors hover:bg-black/5 dark:hover:bg-white/5 border border-transparent hover:border-gray-200 dark:hover:border-gray-800">
                    Return to Login
                </button>
</div>
</div>
<!-- Footer / Resend Link -->
<div class="p-6 text-center pb-8">
<p class="text-[#4f6458] dark:text-[#a0b3a8] text-sm font-medium">
                Wrong email address? 
                <button class="text-primary font-bold hover:underline ml-1 transition-colors hover:text-[#0ebd63]">Resend email</button>
</p>
</div>
</div>
</body></html>
