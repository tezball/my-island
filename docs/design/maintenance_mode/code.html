<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Maintenance Mode - my-island</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec80",
                        "background-light": "#f6f8f7",
                        "background-dark": "#102219",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "Noto Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased text-slate-900 dark:text-white transition-colors duration-200">
<div class="relative flex min-h-screen w-full flex-col justify-between overflow-x-hidden p-6 md:justify-center">
<!-- Header / Logo Area (Empty for centering focus, or minimal branding) -->
<div class="flex justify-center pt-4 md:hidden opacity-0">
<!-- Spacer to balance layout -->
</div>
<!-- Main Content Card -->
<div class="flex w-full flex-col items-center gap-8 md:mx-auto md:max-w-[400px]">
<!-- Hero Section -->
<div class="flex flex-col items-center gap-6 w-full">
<!-- Image Container with soft shadow and rounded corners -->
<div class="relative group w-full aspect-square max-w-[280px]">
<!-- Decorative backdrop -->
<div class="absolute inset-0 bg-primary/20 rounded-full blur-3xl transform scale-75 group-hover:scale-90 transition-transform duration-700"></div>
<!-- Main Image -->
<div class="relative h-full w-full bg-center bg-no-repeat bg-cover rounded-[2rem] shadow-2xl shadow-primary/10 overflow-hidden border-4 border-white dark:border-slate-800" data-alt="A peaceful camping tent in a green forest clearing" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuBwL-_XiOux3FKi4Xb7C2CKSZM91mpAEUOmYkrcV2c5D2x9OhRmREubE-M0bBzOjvXT0cCjiuQy2N1ZhvwfnxEJa9kyyTHeD6sHInpeCpR3ClcgxVzJSMVmdgJaPkMsU6p8Np0ZE66yvxPTXRejpfGbcHAIzqtVH6nNLY-uvKhP47SdhIwFFzlAfmzMnacjWig2tMW5rWZR6HEZrA4e6Pu8cI2Ov04OwAFmEJa-QOKHqW8Ybx9q_S0oGVlLg8gBdDTxyQ1GZZY0JQ");'>
<div class="absolute inset-0 bg-gradient-to-t from-black/40 to-transparent"></div>
</div>
<!-- Status Icon Badge -->
<div class="absolute -bottom-4 -right-4 bg-white dark:bg-slate-800 p-3 rounded-full shadow-lg border border-slate-100 dark:border-slate-700">
<span class="material-symbols-outlined text-primary text-3xl">construction</span>
</div>
</div>
<!-- Text Content -->
<div class="flex flex-col items-center gap-3 text-center px-2">
<h1 class="text-[#111814] dark:text-white text-2xl font-bold leading-tight tracking-tight">
                        We're tidying up<br/>the campsite
                    </h1>
<p class="text-slate-500 dark:text-slate-400 text-sm font-medium leading-relaxed max-w-[320px]">
                        We are currently improving the my-island experience. We'll be back shortly so you can get back to booking your perfect spot.
                    </p>
</div>
</div>
<!-- Chips: Estimated Time -->
<div class="flex flex-wrap justify-center gap-2">
<div class="flex h-10 items-center justify-center gap-x-2 rounded-xl bg-[#f0f4f2] dark:bg-slate-800 px-5 py-2 border border-slate-200 dark:border-slate-700">
<span class="material-symbols-outlined text-primary text-[20px]">schedule</span>
<p class="text-[#111814] dark:text-slate-200 text-sm font-bold leading-normal">
                        Est. Return: <span class="text-primary ml-1">2:00 PM EST</span>
</p>
</div>
</div>
<!-- Action Buttons -->
<div class="flex w-full flex-col gap-3 mt-2">
<!-- Primary: Refresh -->
<button class="group flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-xl h-12 px-6 bg-primary hover:bg-[#0fd673] active:scale-[0.98] transition-all duration-200 text-[#102219] text-sm font-bold leading-normal tracking-[0.015em] shadow-lg shadow-primary/25">
<span class="truncate">Try Again</span>
<span class="material-symbols-outlined ml-2 text-[18px] group-hover:rotate-180 transition-transform duration-500">refresh</span>
</button>
<!-- Secondary: Status -->
<button class="flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-xl h-12 px-6 bg-white dark:bg-white/5 border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-white/10 active:scale-[0.98] transition-all duration-200 text-slate-600 dark:text-slate-300 text-sm font-bold leading-normal tracking-[0.015em]">
<span class="truncate">Check System Status</span>
<span class="material-symbols-outlined ml-2 text-[18px]">open_in_new</span>
</button>
</div>
</div>
<!-- Footer / Branding -->
<div class="flex flex-col items-center gap-2 pb-4 opacity-70 md:hidden">
<div class="h-1 w-12 rounded-full bg-slate-200 dark:bg-slate-700"></div>
</div>
</div>
</body></html>
