<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Edit Profile - my-island</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec80",
                        "background-light": "#f6f8f7",
                        "background-dark": "#102219",
                        "surface-light": "#ffffff",
                        "surface-dark": "#1a2c23",
                        "border-light": "#dbe6e0",
                        "border-dark": "#2a4034",
                        "text-main-light": "#111814",
                        "text-main-dark": "#f0f4f2",
                        "text-secondary-light": "#618975",
                        "text-secondary-dark": "#8baaa0",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "2xl": "2rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar hiding for cleaner mobile look if needed */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased text-text-main-light dark:text-text-main-dark selection:bg-primary selection:text-black">
<div class="relative flex h-full min-h-screen w-full flex-col overflow-x-hidden max-w-md mx-auto bg-background-light dark:bg-background-dark shadow-xl">
<!-- Navigation Bar -->
<div class="sticky top-0 z-50 flex items-center bg-background-light/95 dark:bg-background-dark/95 backdrop-blur-md p-4 justify-between border-b border-border-light/20 dark:border-border-dark/20">
<button class="flex size-10 shrink-0 items-center justify-center rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition-colors text-text-main-light dark:text-text-main-dark">
<span class="material-symbols-outlined" style="font-size: 24px;">arrow_back_ios_new</span>
</button>
<h2 class="text-text-main-light dark:text-text-main-dark text-lg font-bold leading-tight tracking-tight flex-1 text-center pr-10">Edit Profile</h2>
</div>
<div class="flex-1 flex flex-col items-center w-full px-4 pb-8">
<!-- Profile Avatar Section -->
<div class="flex flex-col items-center py-6 gap-4 w-full">
<div class="relative group cursor-pointer">
<div class="bg-center bg-no-repeat bg-cover rounded-full h-32 w-32 shadow-md ring-4 ring-white dark:ring-surface-dark relative overflow-hidden" data-alt="Portrait of a smiling young woman with backpack in a forest setting" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuAn5NlAlpoMuVOTWIlayU_bxfgXXJUudkPtdhtIyTfRxClx9d4hQFhs51wXDybpb4itUqW_xLqiDEhODOKS_6NQ1fkP3rWulMQi9LHMvvQrcVOraDoUtamd6-IICEUPtQY7oAX_B9SbA5p4h8N94q-CX715vLyJecM8EgNAdqF2wPzbIuz2LviahFqD6SOVyhd-mfzK71kzqSp5eBhek7apqJ3nvzloE2kJLMvkdf9mu2ICcbxA528kE9HjKZnV-tAP2mpoDd68uQ");'>
<div class="absolute inset-0 bg-black/20 group-hover:bg-black/40 transition-colors flex items-center justify-center opacity-0 group-hover:opacity-100">
<span class="material-symbols-outlined text-white" style="font-size: 32px;">photo_camera</span>
</div>
</div>
<button class="absolute bottom-0 right-0 bg-primary text-black p-2 rounded-full shadow-lg hover:scale-105 transition-transform flex items-center justify-center border-2 border-white dark:border-background-dark">
<span class="material-symbols-outlined" style="font-size: 20px;">edit</span>
</button>
</div>
<button class="text-primary font-bold text-base hover:text-green-400 dark:hover:text-green-300 transition-colors">
                    Change Profile Photo
                </button>
</div>
<!-- Form Fields -->
<form class="w-full flex flex-col gap-5 mt-2">
<!-- Name Row -->
<div class="flex flex-row gap-4">
<label class="flex flex-col min-w-0 flex-1 gap-2">
<span class="text-text-main-light dark:text-text-main-dark text-sm font-semibold ml-1">First Name</span>
<input class="form-input w-full rounded-xl border border-border-light dark:border-border-dark bg-surface-light dark:bg-surface-dark text-text-main-light dark:text-text-main-dark h-14 px-4 text-base focus:ring-2 focus:ring-primary/50 focus:border-primary placeholder:text-text-secondary-light/70 dark:placeholder:text-text-secondary-dark/70 transition-all" placeholder="First Name" type="text" value="Sarah"/>
</label>
<label class="flex flex-col min-w-0 flex-1 gap-2">
<span class="text-text-main-light dark:text-text-main-dark text-sm font-semibold ml-1">Last Name</span>
<input class="form-input w-full rounded-xl border border-border-light dark:border-border-dark bg-surface-light dark:bg-surface-dark text-text-main-light dark:text-text-main-dark h-14 px-4 text-base focus:ring-2 focus:ring-primary/50 focus:border-primary placeholder:text-text-secondary-light/70 dark:placeholder:text-text-secondary-dark/70 transition-all" placeholder="Last Name" type="text" value="Jenkins"/>
</label>
</div>
<!-- Email (Locked) -->
<label class="flex flex-col gap-2">
<span class="text-text-main-light dark:text-text-main-dark text-sm font-semibold ml-1">Email Address</span>
<div class="relative flex w-full items-center">
<input class="form-input w-full rounded-xl border-none bg-border-light/30 dark:bg-surface-dark/50 text-text-secondary-light dark:text-text-secondary-dark h-14 pl-4 pr-12 text-base cursor-not-allowed focus:ring-0" readonly="" type="email" value="sarah.jenkins@example.com"/>
<span class="material-symbols-outlined absolute right-4 text-text-secondary-light dark:text-text-secondary-dark" style="font-size: 20px;">lock</span>
</div>
</label>
<!-- Phone -->
<label class="flex flex-col gap-2">
<span class="text-text-main-light dark:text-text-main-dark text-sm font-semibold ml-1">Phone Number</span>
<div class="relative flex w-full items-center">
<input class="form-input w-full rounded-xl border border-border-light dark:border-border-dark bg-surface-light dark:bg-surface-dark text-text-main-light dark:text-text-main-dark h-14 pl-4 pr-10 text-base focus:ring-2 focus:ring-primary/50 focus:border-primary placeholder:text-text-secondary-light/70 dark:placeholder:text-text-secondary-dark/70 transition-all" placeholder="+1 (000) 000-0000" type="tel" value="+1 (555) 123-4567"/>
<!-- Validation Icon -->
<span class="material-symbols-outlined absolute right-4 text-primary" style="font-size: 20px;">check_circle</span>
</div>
</label>
</form>
<!-- Spacing -->
<div class="h-10"></div>
<!-- Action Buttons -->
<div class="w-full mt-auto flex flex-col gap-3">
<button class="flex w-full items-center justify-center rounded-full bg-primary h-14 px-8 text-black text-lg font-bold shadow-lg shadow-primary/20 hover:bg-green-400 hover:shadow-primary/40 active:scale-[0.98] transition-all duration-200">
                    Save Changes
                </button>
<button class="flex w-full items-center justify-center rounded-full bg-transparent h-12 px-8 text-text-secondary-light dark:text-text-secondary-dark text-base font-medium hover:bg-black/5 dark:hover:bg-white/5 active:scale-[0.98] transition-all">
                    Cancel
                </button>
</div>
</div>
</div>
</body></html>
