<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Create Owner Ticket - my-island</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Icons -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec80",
                        "background-light": "#f6f8f7",
                        "background-dark": "#102219",
                        "surface-light": "#ffffff",
                        "surface-dark": "#1a2c24",
                        "text-primary-light": "#111814",
                        "text-primary-dark": "#e0e6e3",
                        "text-secondary-light": "#618975",
                        "text-secondary-dark": "#8fa899",
                        "border-light": "#dbe6e0",
                        "border-dark": "#2a3d33",
                        "input-bg-light": "#ffffff",
                        "input-bg-dark": "#152a21",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "Noto Sans", "sans-serif"],
                        "body": ["Plus Jakarta Sans", "Noto Sans", "sans-serif"],
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar for textarea */
        textarea::-webkit-scrollbar {
            width: 8px;
        }
        textarea::-webkit-scrollbar-track {
            background: transparent;
        }
        textarea::-webkit-scrollbar-thumb {
            background-color: #d1d5db;
            border-radius: 20px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-text-primary-light dark:text-text-primary-dark font-display antialiased overflow-x-hidden transition-colors duration-200">
<div class="relative flex h-full min-h-screen w-full flex-col max-w-md mx-auto bg-background-light dark:bg-background-dark shadow-xl overflow-hidden">
<!-- Header -->
<header class="sticky top-0 z-10 bg-background-light/95 dark:bg-background-dark/95 backdrop-blur-md border-b border-border-light dark:border-border-dark transition-colors duration-200">
<div class="flex items-center p-4 justify-between h-16">
<button aria-label="Go back" class="flex size-10 shrink-0 items-center justify-center rounded-full hover:bg-black/5 dark:hover:bg-white/10 active:scale-95 transition-all text-text-primary-light dark:text-text-primary-dark">
<span class="material-symbols-outlined text-[24px]">arrow_back_ios_new</span>
</button>
<h2 class="text-lg font-bold leading-tight tracking-tight flex-1 text-center pr-10 text-text-primary-light dark:text-text-primary-dark">New Ticket</h2>
</div>
</header>
<!-- Main Content Scroll Area -->
<main class="flex-1 overflow-y-auto pb-32">
<!-- Intro Text -->
<div class="px-5 pt-6 pb-2">
<p class="text-text-secondary-light dark:text-text-secondary-dark text-base font-normal leading-relaxed">
                    How can we help with your campsite today? Fill out the details below and our team will jump right on it.
                </p>
</div>
<!-- Form Fields Container -->
<div class="flex flex-col gap-6 px-5 py-4">
<!-- Issue Category Dropdown -->
<div class="group">
<label class="block text-sm font-semibold text-text-primary-light dark:text-text-primary-dark mb-2 ml-1">
                        Issue Category
                    </label>
<div class="relative">
<select class="w-full appearance-none rounded-xl border border-border-light dark:border-border-dark bg-input-bg-light dark:bg-input-bg-dark py-4 px-4 text-base text-text-primary-light dark:text-text-primary-dark placeholder-text-secondary-light focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-shadow cursor-pointer">
<option disabled="" selected="" value="">Select a category</option>
<option value="maintenance">Facility Maintenance</option>
<option value="booking">Booking Issue</option>
<option value="billing">Billing &amp; Payments</option>
<option value="guest">Guest Relations</option>
<option value="other">Other</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-text-secondary-light dark:text-text-secondary-dark">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</div>
<!-- Ticket Subject Input -->
<div class="group">
<label class="block text-sm font-semibold text-text-primary-light dark:text-text-primary-dark mb-2 ml-1">
                        Ticket Subject
                    </label>
<input class="w-full rounded-xl border border-border-light dark:border-border-dark bg-input-bg-light dark:bg-input-bg-dark py-4 px-4 text-base text-text-primary-light dark:text-text-primary-dark placeholder:text-text-secondary-light dark:placeholder:text-text-secondary-dark focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-shadow" placeholder="e.g., Water supply issue at Plot 4" type="text"/>
</div>
<!-- Description Textarea -->
<div class="group">
<label class="block text-sm font-semibold text-text-primary-light dark:text-text-primary-dark mb-2 ml-1">
                        Description
                    </label>
<textarea class="w-full min-h-[160px] rounded-xl border border-border-light dark:border-border-dark bg-input-bg-light dark:bg-input-bg-dark py-4 px-4 text-base text-text-primary-light dark:text-text-primary-dark placeholder:text-text-secondary-light dark:placeholder:text-text-secondary-dark focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none resize-none transition-shadow" placeholder="Please describe the problem in detail so we can assist you better..."></textarea>
<div class="flex justify-end mt-2">
<span class="text-xs text-text-secondary-light dark:text-text-secondary-dark font-medium">0/500</span>
</div>
</div>
<!-- Attachment Zone -->
<div class="group">
<label class="block text-sm font-semibold text-text-primary-light dark:text-text-primary-dark mb-2 ml-1">
                        Attachments <span class="text-text-secondary-light font-normal text-xs ml-1">(Optional)</span>
</label>
<button class="w-full flex flex-col items-center justify-center gap-3 rounded-xl border-2 border-dashed border-border-light dark:border-border-dark hover:border-primary/50 dark:hover:border-primary/50 bg-surface-light dark:bg-surface-dark py-8 px-4 transition-all active:scale-[0.99] group/upload">
<div class="h-12 w-12 rounded-full bg-primary/10 flex items-center justify-center group-hover/upload:bg-primary/20 transition-colors">
<span class="material-symbols-outlined text-primary text-[28px]">add_a_photo</span>
</div>
<div class="text-center">
<p class="text-sm font-medium text-text-primary-light dark:text-text-primary-dark">Tap to upload photos</p>
<p class="text-xs text-text-secondary-light dark:text-text-secondary-dark mt-1">PNG, JPG up to 5MB</p>
</div>
</button>
<!-- Example of an attached file (Hidden by default, shown for design completeness) -->

                    <div class="flex items-center justify-between p-3 mt-3 bg-surface-light dark:bg-surface-dark border border-border-light dark:border-border-dark rounded-lg">
                        <div class="flex items-center gap-3 overflow-hidden">
                            <div class="h-10 w-10 rounded bg-gray-200 shrink-0 bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1590602392437-080c5415757d?q=80&w=200&auto=format&fit=crop');" data-alt="Screenshot of campsite map"></div>
                            <div class="flex flex-col min-w-0">
                                <p class="text-sm font-medium truncate">screenshot_issue_01.jpg</p>
                                <p class="text-xs text-text-secondary-light">1.2 MB</p>
                            </div>
                        </div>
                        <button class="text-text-secondary-light hover:text-red-500 p-2">
                            <span class="material-symbols-outlined text-[20px]">close</span>
                        </button>
                    </div>
                    -->
</div>
</div>
<!-- Bottom spacing for scroll -->
<div class="h-8"></div>
</main>
<!-- Fixed Action Bar -->
<div class="absolute bottom-0 left-0 right-0 p-5 bg-background-light dark:bg-background-dark border-t border-border-light dark:border-border-dark backdrop-blur-lg bg-opacity-90 dark:bg-opacity-90">
<div class="flex flex-col gap-3">
<button class="flex w-full items-center justify-center rounded-xl bg-primary h-14 px-6 text-base font-bold text-[#102219] shadow-lg shadow-primary/20 hover:bg-[#0fd671] active:scale-[0.98] transition-all disabled:opacity-50 disabled:cursor-not-allowed">
                    Submit Ticket
                </button>
<button class="flex w-full items-center justify-center rounded-xl bg-transparent h-12 px-6 text-sm font-semibold text-text-secondary-light dark:text-text-secondary-dark hover:text-text-primary-light dark:hover:text-text-primary-dark active:scale-[0.98] transition-colors">
                    Cancel
                </button>
</div>
</div>
</div>
</body></html>
