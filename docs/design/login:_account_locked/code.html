<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login: Account Locked - my-island</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#13ec80",
            "background-light": "#f6f8f7",
            "background-dark": "#102219",
            "secondary-text": "#618975",
            "main-text": "#111814",
          },
          fontFamily: {
            "display": ["Plus Jakarta Sans", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "0.5rem",
            "lg": "1rem",
            "xl": "1.5rem",
            "2xl": "2rem",
            "full": "9999px"
          },
          boxShadow: {
             'soft': '0 4px 20px -2px rgba(19, 236, 128, 0.1)',
          }
        },
      },
    }
  </script>
<style>
    /* Custom utility for the specific nature-inspired aesthetic */
    .bg-nature-gradient {
      background: linear-gradient(180deg, rgba(246,248,247,0) 0%, rgba(19,236,128,0.05) 100%);
    }
    
    /* Ensure icons are centered properly */
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .icon-filled {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased">
<div class="relative flex h-full min-h-screen w-full flex-col overflow-x-hidden max-w-md mx-auto shadow-2xl bg-white dark:bg-[#152e22]">
<!-- Top Bar -->
<div class="flex items-center p-4 pb-2 justify-between">
<button aria-label="Go back" class="text-main-text dark:text-white flex size-12 shrink-0 items-center justify-center rounded-full hover:bg-gray-100 dark:hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<div class="flex items-center gap-2">
<!-- Brand Logo / Name Small -->
<span class="material-symbols-outlined text-primary text-[20px] icon-filled">camping</span>
<span class="text-sm font-bold text-main-text dark:text-white tracking-wide">my-island</span>
</div>
<div class="size-12"></div> <!-- Spacer for visual balance -->
</div>
<!-- Main Content Area -->
<div class="flex-1 flex flex-col items-center justify-center px-6 pb-8">
<!-- Icon/Illustration Area -->
<div class="w-full flex justify-center mb-6">
<div class="relative size-32 rounded-full bg-primary/10 flex items-center justify-center mb-4 ring-8 ring-primary/5">
<span class="material-symbols-outlined text-primary text-[64px] icon-filled">lock</span>
<div class="absolute bottom-0 right-0 bg-white dark:bg-[#152e22] rounded-full p-1.5 shadow-sm border border-gray-100 dark:border-gray-700">
<span class="material-symbols-outlined text-secondary-text text-[24px] block">shield</span>
</div>
</div>
</div>
<!-- Text Content -->
<h1 class="text-main-text dark:text-white tracking-tight text-[32px] font-extrabold leading-tight text-center mb-3">
        Account Locked
      </h1>
<p class="text-secondary-text dark:text-gray-300 text-base font-normal leading-relaxed text-center mb-8 max-w-[300px]">
        For your security, your account has been temporarily locked after too many failed login attempts.
      </p>
<!-- Instruction Card -->
<div class="w-full bg-gray-50 dark:bg-white/5 rounded-2xl p-5 mb-8 border border-gray-100 dark:border-white/10 shadow-sm">
<div class="flex items-start gap-4">
<div class="shrink-0 mt-1 bg-white dark:bg-white/10 rounded-full p-2 text-primary shadow-sm">
<span class="material-symbols-outlined text-[24px]">mark_email_unread</span>
</div>
<div class="flex flex-col gap-1">
<h3 class="text-main-text dark:text-white text-base font-bold leading-tight">Check your email</h3>
<p class="text-secondary-text dark:text-gray-400 text-sm font-normal leading-normal">
              We have sent a secure unlock link to <span class="font-medium text-main-text dark:text-gray-200">use***@email.com</span>. Please click it to verify your identity.
            </p>
</div>
</div>
</div>
<!-- Action Buttons -->
<div class="w-full flex flex-col gap-3 mt-auto">
<button class="flex w-full items-center justify-center gap-2 rounded-xl bg-primary px-6 py-4 transition-transform active:scale-[0.98]">
<span class="material-symbols-outlined text-[#0a2e1d] text-[20px]">support_agent</span>
<span class="text-[#0a2e1d] text-base font-bold leading-none tracking-wide">Contact Support</span>
</button>
<button class="flex w-full items-center justify-center gap-2 rounded-xl bg-transparent px-6 py-4 hover:bg-gray-50 dark:hover:bg-white/5 transition-colors">
<span class="text-secondary-text dark:text-gray-300 text-sm font-semibold leading-none">Back to Login</span>
</button>
</div>
</div>
<!-- Decorative Bottom Wave/Nature Element (CSS Gradient) -->
<div class="h-4 w-full bg-nature-gradient opacity-50"></div>
</div>
</body></html>
