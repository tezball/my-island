<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&amp;family=Noto+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec80",
                        "background-light": "#f6f8f7",
                        "background-dark": "#102219",
                        "surface-light": "#ffffff",
                        "surface-dark": "#162e22",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"],

                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},

<body class="bg-background-light dark:bg-background-dark transition-colors duration-200">

</button>
<h2 class="text-[#111814] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12">

</div>

<div class="flex-1 flex flex-col px-6 py-10 justify-center items-center w-full max-w-md mx-auto">
<div class="flex flex-col items-center gap-8 w-full">
<!-- Illustration Wrapper -->
<div class="relative group">

<div class="absolute inset-0 bg-primary/20 dark:bg-primary/10 rounded-full blur-2xl transform scale-110"></div>
<!-- Image -->
<div class="relative w-48 h-48 rounded-full overflow-hidden border-[6px] border-surface-light dark:border-surface-dark shadow-xl">
<div class="w-full h-full bg-center bg-no-repeat bg-cover transform hover:scale-105 transition-transform duration-700" data-alt="An hourglass placed on a mossy rock in a forest with soft sunlight" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuCMgGa3GiK-zbdQR07KMXIO_9x_yzgIlUjLRfbqVtmtIViLjci7WPTqla12X702oU_0XI9U7st7v1DAOstc7I-LVhXp5gcycsR_tDnTHrZoZ9jBmO3ev9zhDYbDs2sXjARZ_Df72EeJBIrYzj1RSvf7b-i_lVd-0LYTWqqxOePLqrYnzyIkwR10IDmSqD_LbOJQhKH-QoBOQ0CvkPaEmZYlzmO4_iXQTUqkQNnbvRWRSQmriNKysjjzKUIJFDVpWGl9fY4YJPab6w");'>
</div>
</div>

<span class="material-symbols-outlined text-red-500 text-[28px]">link_off</span>
</div>
</div>
<!-- Text Content -->
<div class="flex flex-col items-center gap-3 w-full">
<p class="text-[#111814] dark:text-white text-2xl font-extrabold leading-tight tracking-[-0.015em] text-center">
                        Link Expired
                    </p>
<p class="text-gray-600 dark:text-gray-400 text-base font-normal leading-relaxed text-center max-w-[320px]">
                        This link is no longer valid. To reset your password, please request a new secure link below.
                    </p>
</div>
<!-- Primary Button -->
<button class="flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-xl h-14 px-6 bg-primary hover:bg-[#0fd671] active:scale-95 transition-all text-[#102219] text-base font-bold leading-normal tracking-[0.015em] shadow-lg shadow-primary/20 mt-4">
<span class="truncate">Request New Link</span>
</button>
</div>
</div>
<!-- Secondary Action (SingleButton Adaptation) -->
<div class="flex flex-col px-6 py-8 pb-10 items-center">
<button class="group flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center rounded-xl h-12 px-4 bg-transparent text-gray-500 dark:text-gray-400 hover:text-gray-800 dark:hover:text-white transition-colors text-sm font-bold leading-normal tracking-[0.015em]">

</button>
</div>
