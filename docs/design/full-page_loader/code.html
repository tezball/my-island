<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>My Island - Loader</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Configuration -->
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#13ec80",
              "background-light": "#f6f8f7",
              "background-dark": "#102219",
            },
            fontFamily: {
              "display": ["Plus Jakarta Sans", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
            animation: {
                'spin-slow': 'spin 3s linear infinite',
            }
          },
        },
      }
    </script>
<style>
        .loader-spinner {
            border-right-color: transparent;
            border-bottom-color: transparent;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased transition-colors duration-300">
<div class="relative flex h-screen w-full flex-col items-center justify-center overflow-hidden">
<!-- Background Elements: Subtle nature pattern/blobs -->
<div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-primary/5 rounded-full blur-[100px] pointer-events-none"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-primary/10 rounded-full blur-[100px] pointer-events-none"></div>
<!-- Main Content Container -->
<div class="z-10 flex w-full max-w-md flex-col items-center px-6">
<!-- Central Animation: Spinner -->
<div class="relative flex items-center justify-center mb-8">
<!-- Outer static ring -->
<div class="h-20 w-20 rounded-full border-[6px] border-gray-200 dark:border-gray-800"></div>
<!-- Inner spinning ring -->
<div class="absolute h-20 w-20 rounded-full border-[6px] border-primary loader-spinner animate-spin"></div>
<!-- Center Icon -->
<span class="material-symbols-outlined absolute text-primary text-3xl animate-pulse">forest</span>
</div>
<!-- Text Content -->
<div class="flex flex-col items-center w-full">
<!-- Headline -->
<h2 class="text-background-dark dark:text-white tracking-tight text-[28px] font-bold leading-tight px-4 text-center pb-2">
                    Just a moment...
                </h2>
<!-- Body Text -->
<p class="text-gray-500 dark:text-gray-400 text-base font-normal leading-normal px-4 text-center pb-8">
                    Securing your spot in nature...
                </p>
<!-- Progress Bar Section -->
<div class="w-full max-w-[280px] flex flex-col gap-3">
<div class="flex gap-6 justify-between items-center">
<p class="text-background-dark dark:text-gray-200 text-sm font-medium leading-normal">Verifying details</p>
<span class="text-primary text-xs font-bold bg-primary/10 px-2 py-0.5 rounded-full">30%</span>
</div>
<div class="rounded-full bg-gray-200 dark:bg-gray-800 h-2 w-full overflow-hidden">
<div class="h-full rounded-full bg-primary transition-all duration-1000 ease-out" style="width: 30%;"></div>
</div>
</div>
</div>
</div>
<!-- Footer Logo -->
<div class="absolute bottom-8 flex flex-col items-center gap-2 opacity-50">
<div class="flex items-center gap-2 text-background-dark dark:text-white">
<span class="material-symbols-outlined text-xl">landscape</span>
<span class="text-sm font-semibold tracking-wide">my-island</span>
</div>
</div>
</div>
</body></html>
