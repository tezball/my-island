<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Add Campsite Lot</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Config -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec5b",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102216",
                        "surface-light": "#ffffff",
                        "surface-dark": "#1c2e22",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "2xl": "2rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-50 transition-colors duration-200">
<div class="relative flex h-full min-h-screen w-full flex-col overflow-x-hidden max-w-md mx-auto shadow-2xl bg-background-light dark:bg-background-dark">
<!-- Top App Bar -->
<div class="sticky top-0 z-50 flex items-center justify-between p-4 bg-background-light/90 dark:bg-background-dark/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-800">
<button class="flex size-10 items-center justify-center rounded-full hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors">
<span class="material-symbols-outlined text-slate-600 dark:text-slate-300">close</span>
</button>
<h2 class="text-lg font-bold leading-tight tracking-tight">Add New Lot</h2>
<button class="text-sm font-semibold text-primary hover:text-green-400">Reset</button>
</div>
<!-- Scrollable Content -->
<main class="flex-1 flex flex-col gap-6 p-4 pb-32">
<!-- Section: Essentials -->
<section>
<h3 class="text-xl font-bold mb-4 px-1">Essentials</h3>
<div class="space-y-4">
<!-- Lot Name Input -->
<label class="block">
<span class="text-sm font-medium text-slate-600 dark:text-slate-400 ml-1 mb-1.5 block">Lot Name or Number</span>
<input class="w-full h-14 rounded-xl border-slate-200 bg-white dark:bg-surface-dark dark:border-slate-700 px-4 text-base focus:border-primary focus:ring-primary dark:text-white placeholder-slate-400" placeholder="e.g., Riverside Spot 04" type="text"/>
</label>
<!-- Lot Type Grid -->
<div>
<span class="text-sm font-medium text-slate-600 dark:text-slate-400 ml-1 mb-2 block">Lot Type</span>
<div class="grid grid-cols-2 gap-3">
<!-- Selected State Example -->
<div class="relative flex flex-col items-center justify-center gap-2 rounded-xl border-2 border-primary bg-primary/10 dark:bg-primary/20 p-4 cursor-pointer transition-all">
<div class="absolute top-2 right-2 text-primary">
<span class="material-symbols-outlined text-xl font-bold">check_circle</span>
</div>
<span class="material-symbols-outlined text-3xl text-primary">camping</span>
<span class="font-semibold text-sm">Tent Site</span>
</div>
<!-- Unselected States -->
<div class="flex flex-col items-center justify-center gap-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-surface-dark p-4 cursor-pointer hover:border-primary/50 transition-all">
<span class="material-symbols-outlined text-3xl text-slate-400">rv_hookup</span>
<span class="font-semibold text-sm text-slate-600 dark:text-slate-300">RV Spot</span>
</div>
<div class="flex flex-col items-center justify-center gap-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-surface-dark p-4 cursor-pointer hover:border-primary/50 transition-all">
<span class="material-symbols-outlined text-3xl text-slate-400">cabin</span>
<span class="font-semibold text-sm text-slate-600 dark:text-slate-300">Cabin</span>
</div>
<div class="flex flex-col items-center justify-center gap-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-surface-dark p-4 cursor-pointer hover:border-primary/50 transition-all">
<span class="material-symbols-outlined text-3xl text-slate-400">hotel_class</span>
<span class="font-semibold text-sm text-slate-600 dark:text-slate-300">Glamping</span>
</div>
</div>
</div>
</div>
</section>
<!-- Section: Capacity & Size -->
<section>
<div class="h-px bg-slate-200 dark:bg-slate-800 w-full my-2"></div>
<h3 class="text-xl font-bold mt-6 mb-4 px-1">Capacity &amp; Size</h3>
<div class="flex gap-4">
<!-- Guest Stepper -->
<div class="flex-1 rounded-xl bg-white dark:bg-surface-dark border border-slate-200 dark:border-slate-700 p-4 flex flex-col justify-between">
<span class="text-sm font-medium text-slate-500 dark:text-slate-400">Max Guests</span>
<div class="flex items-center justify-between mt-2">
<button class="size-8 rounded-full bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 flex items-center justify-center text-slate-600 dark:text-slate-300">
<span class="material-symbols-outlined text-lg">remove</span>
</button>
<span class="text-xl font-bold">4</span>
<button class="size-8 rounded-full bg-primary text-slate-900 flex items-center justify-center hover:opacity-90">
<span class="material-symbols-outlined text-lg">add</span>
</button>
</div>
</div>
<!-- Dimensions Input -->
<div class="flex-1">
<label class="flex flex-col h-full">
<span class="sr-only">Dimensions</span>
<div class="flex-1 rounded-xl bg-white dark:bg-surface-dark border border-slate-200 dark:border-slate-700 p-4 flex flex-col">
<span class="text-sm font-medium text-slate-500 dark:text-slate-400 mb-1">Size (ft)</span>
<input class="w-full bg-transparent border-0 p-0 text-xl font-bold placeholder-slate-300 focus:ring-0" placeholder="e.g. 20x20" type="text"/>
</div>
</label>
</div>
</div>
</section>
<!-- Section: Amenities -->
<section>
<div class="h-px bg-slate-200 dark:bg-slate-800 w-full my-2"></div>
<h3 class="text-xl font-bold mt-6 mb-4 px-1">Amenities</h3>
<div class="flex flex-wrap gap-2">
<!-- Amenity Chip: Selected -->
<button class="group flex items-center gap-2 px-4 py-2.5 rounded-full border border-primary bg-primary/10 dark:bg-primary/20 transition-all active:scale-95">
<span class="material-symbols-outlined text-lg text-primary">bolt</span>
<span class="text-sm font-semibold text-slate-900 dark:text-white">Electric</span>
</button>
<!-- Amenity Chip: Unselected -->
<button class="group flex items-center gap-2 px-4 py-2.5 rounded-full border border-slate-200 dark:border-slate-700 bg-white dark:bg-surface-dark hover:border-primary/50 transition-all active:scale-95">
<span class="material-symbols-outlined text-lg text-slate-400 group-hover:text-primary">water_drop</span>
<span class="text-sm font-medium text-slate-600 dark:text-slate-300">Water</span>
</button>
<button class="group flex items-center gap-2 px-4 py-2.5 rounded-full border border-slate-200 dark:border-slate-700 bg-white dark:bg-surface-dark hover:border-primary/50 transition-all active:scale-95">
<span class="material-symbols-outlined text-lg text-slate-400 group-hover:text-primary">wifi</span>
<span class="text-sm font-medium text-slate-600 dark:text-slate-300">Wi-Fi</span>
</button>
<button class="group flex items-center gap-2 px-4 py-2.5 rounded-full border border-slate-200 dark:border-slate-700 bg-white dark:bg-surface-dark hover:border-primary/50 transition-all active:scale-95">
<span class="material-symbols-outlined text-lg text-slate-400 group-hover:text-primary">local_fire_department</span>
<span class="text-sm font-medium text-slate-600 dark:text-slate-300">Fire Pit</span>
</button>
<button class="group flex items-center gap-2 px-4 py-2.5 rounded-full border border-slate-200 dark:border-slate-700 bg-white dark:bg-surface-dark hover:border-primary/50 transition-all active:scale-95">
<span class="material-symbols-outlined text-lg text-slate-400 group-hover:text-primary">pets</span>
<span class="text-sm font-medium text-slate-600 dark:text-slate-300">Pets Allowed</span>
</button>
<button class="group flex items-center gap-2 px-4 py-2.5 rounded-full border border-slate-200 dark:border-slate-700 bg-white dark:bg-surface-dark hover:border-primary/50 transition-all active:scale-95">
<span class="material-symbols-outlined text-lg text-slate-400 group-hover:text-primary">deck</span>
<span class="text-sm font-medium text-slate-600 dark:text-slate-300">Picnic Table</span>
</button>
<!-- Add Custom Amenity -->
<button class="group flex items-center gap-2 px-3 py-2.5 rounded-full border border-dashed border-slate-300 dark:border-slate-600 bg-transparent hover:bg-slate-100 dark:hover:bg-surface-dark transition-all">
<span class="material-symbols-outlined text-lg text-slate-400">add</span>
<span class="text-sm font-medium text-slate-500">Add</span>
</button>
</div>
</section>
<!-- Section: Photos -->
<section>
<div class="h-px bg-slate-200 dark:bg-slate-800 w-full my-2"></div>
<h3 class="text-xl font-bold mt-6 mb-4 px-1">Photos</h3>
<div class="flex gap-3 overflow-x-auto pb-2">
<!-- Existing Photo Preview -->
<div class="relative shrink-0 size-24 rounded-xl overflow-hidden group">
<img alt="Camping tent near lake at sunset" class="size-full object-cover" data-alt="Camping tent near lake at sunset" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA7YVtUeR2XU10j__X1f2kDi5meqszKvtMeCpFnWDnViT6u9MjDRNuKv0CEN_LMvzr5y3oGqiyL391x6xxE0ve0B0IT-4vF0cFxTe1Q7a8QBhKIGcxM8sVUOgm5tcRPQey7M6t-T6hsua6C0hxFXqdXTbEkhj0rCI9ePudkXlslIMEmwZ2b2AEhVdPFCJ1esDClouGxYy9kezIMjSfGKeNH1JYY23aS3hMyZoLc76YvXKbOIZ5S6Opybi4s2GM5dzHkbWSGQR4Qrw"/>
<button class="absolute top-1 right-1 bg-black/50 text-white rounded-full p-1 opacity-0 group-hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-xs">close</span>
</button>
</div>
<!-- Upload Button -->
<button class="shrink-0 size-24 rounded-xl border-2 border-dashed border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-surface-dark flex flex-col items-center justify-center text-slate-400 hover:border-primary hover:text-primary transition-colors">
<span class="material-symbols-outlined text-2xl mb-1">add_a_photo</span>
<span class="text-[10px] font-semibold uppercase tracking-wider">Add Photo</span>
</button>
</div>
</section>
<!-- Section: Status -->
<section class="mt-2">
<div class="rounded-xl bg-white dark:bg-surface-dark border border-slate-200 dark:border-slate-700 p-4 flex items-center justify-between">
<div>
<h4 class="font-semibold text-base">Initial Status</h4>
<p class="text-sm text-slate-500 dark:text-slate-400">Make available for booking immediately?</p>
</div>
<!-- Toggle Switch -->
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-primary"></div>
</label>
</div>
</section>
</main>
<!-- Sticky Footer -->
<div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto p-4 bg-white dark:bg-background-dark border-t border-slate-200 dark:border-slate-800 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-50">
<div class="flex flex-col gap-3">
<button class="w-full h-14 bg-primary hover:bg-green-400 text-slate-900 font-bold text-lg rounded-xl shadow-lg shadow-green-500/20 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined">save</span>
                    Save Lot
                </button>
<button class="w-full text-center text-sm font-semibold text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-200 transition-colors">
                    Save &amp; Add Another
                </button>
</div>
</div>
</div>
</body></html>
