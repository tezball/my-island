# Source of truth for local, Dev Containers, Cloud Agents, and CI.
#   git clone && ./scripts/dev up && ./scripts/dev test
name: my-island

services:
  postgres:
    # PostgreSQL 17 + PostGIS 3.5 (PRD-001 / STACK.md).
    # Official Hub postgis/postgis:17-3.5* is linux/amd64 only — Apple Silicon
    # fails with "no matching manifest for linux/arm64/v8" (WF-024).
    # Bao Systems publishes the same major/minor for amd64 + arm64.
    # Recreate volumes if this machine already ran the Hub alpine image:
    #   docker compose down -v && ./scripts/dev up
    image: ghcr.io/baosystems/postgis:17-3.5
    environment:
      POSTGRES_USER: ops
      POSTGRES_PASSWORD: ops
      POSTGRES_DB: ops
    ports:
      - "${OPS_PG_HOST_PORT:-5433}:5432"
    volumes:
      - ops_pg:/var/lib/postgresql/data
      - ./ops/observability/postgres-init-catalog.sql:/docker-entrypoint-initdb.d/00-catalog.sql:ro
      - ./ops/observability/postgres-init.sql:/docker-entrypoint-initdb.d/01-reader.sql:ro
      - ./ops/observability/postgres-grant-catalog-reader.sql:/docker-entrypoint-initdb.d/02-catalog-reader.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops -d ops"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  loki:
    image: grafana/loki:3.4.2
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "${OPS_LOKI_HOST_PORT:-3101}:3100"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3100/ready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.2.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./ops/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/observability/prometheus/rules:/etc/prometheus/rules:ro
    ports:
      - "${OPS_PROM_HOST_PORT:-9091}:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.28.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    volumes:
      - ./ops/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "${OPS_AM_HOST_PORT:-9094}:9093"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9093/-/healthy || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: light
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    ports:
      - "${OPS_GRAFANA_HOST_PORT:-3030}:3000"
    volumes:
      - ops_grafana:/var/lib/grafana
      - ./ops/observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      alertmanager:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    restart: unless-stopped

  # Toolchain + test runner. Dev Containers attach here. CI uses
  # `docker compose run --rm --no-deps workspace`. Cloud Agents skip this
  # service and run on the VM with Docker-in-Docker instead.
  workspace:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    working_dir: /workspace
    volumes:
      - .:/workspace
      - ops_m2:/cache/m2
      - ops_npm:/cache/npm
    environment:
      IN_WORKSPACE: "1"
      MAVEN_USER_HOME: /cache/m2
      npm_config_cache: /cache/npm
      GRAFANA_URL: http://grafana:3000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ops_reader
      POSTGRES_PASSWORD: ops_reader
      POSTGRES_DB: ops
      PYTEST_ADDOPTS: "-o cache_dir=/tmp/pytest-cache"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      grafana:
        condition: service_healthy
    command: ["sleep", "infinity"]
    init: true

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "8025:8025"
      - "1025:1025"
    restart: unless-stopped

  catalog:
    build:
      context: ./services/catalog
      dockerfile: Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        GIT_COMMIT_SHORT: ${GIT_COMMIT_SHORT:-unknown}
        GIT_BRANCH: ${GIT_BRANCH:-unknown}
        APP_VERSION: ${APP_VERSION:-0.0.1-SNAPSHOT}
        APP_BUILD_TIME: ${APP_BUILD_TIME:-unknown}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/catalog
      SPRING_DATASOURCE_USERNAME: ops
      SPRING_DATASOURCE_PASSWORD: ops
      APP_ENV: local
      APP_SEED_PUBLISH: "true"
      CATALOG_IMPORT_KEY: ${CATALOG_IMPORT_KEY:-local-import}
      CATALOG_SEED_GUEST_USERNAME: ${CATALOG_SEED_GUEST_USERNAME:-guest}
      CATALOG_SEED_GUEST_PASSWORD: ${CATALOG_SEED_GUEST_PASSWORD:-guest}
      CATALOG_SEED_GUEST_EMAIL: ${CATALOG_SEED_GUEST_EMAIL:-guest@local.test}
      CATALOG_MAIL_MODE: smtp
      CATALOG_MAIL_FROM: noreply@localhost
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: "1025"
      APP_PUBLIC_ORIGIN: ${APP_PUBLIC_ORIGIN:-http://localhost:5173}
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
      GIT_COMMIT_SHORT: ${GIT_COMMIT_SHORT:-unknown}
      GIT_BRANCH: ${GIT_BRANCH:-unknown}
      APP_VERSION: ${APP_VERSION:-0.0.1-SNAPSHOT}
      APP_BUILD_TIME: ${APP_BUILD_TIME:-unknown}
    ports:
      - "${OPS_CATALOG_HOST_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/actuator/health/readiness || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 50s
    restart: unless-stopped
    # Chaos Monkey: not in this default service. See compose.chaos.yml.

  web:
    image: node:22-bookworm
    working_dir: /src
    volumes:
      - ./web:/src
      - web_nm:/src/node_modules
    command: ["bash", "-lc", "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"]
    environment:
      CATALOG_PROXY: http://catalog:8080
      # Same Web client as mock-prod. GIS origin is localhost:5173, not 127.0.0.1.
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-${GOOGLE_CLIENT_ID:-}}
    ports:
      - "${OPS_WEB_HOST_PORT:-5173}:5173"
    depends_on:
      catalog:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:5173/',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 90s
    restart: unless-stopped

  # Local house CI (WF-031). JCasC from ops/jenkins/casc; state on ops_jenkins.
  # Repo is bind-mounted at the host path so `docker compose` from Jenkins resolves
  # relative volumes (Docker Desktop File Sharing).
  # CI checkouts go to JENKINS_CI_ROOT only (WF-052), not the primary clone and not ~/Projects.
  # The running container does not see a new volume until jenkins is recreated.
  # GitHub scan cred: GITHUB_USERNAME + JENKINS_GITHUB_TOKEN in .env (username/password Casc).
  jenkins:
    build:
      context: ./ops/jenkins
      dockerfile: Dockerfile
    working_dir: ${PWD}
    environment:
      CASC_JENKINS_CONFIG: /var/jenkins_home/casc_configs
      JENKINS_URL: ${JENKINS_URL:-http://127.0.0.1:8085/}
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:-admin}
      GITHUB_USERNAME: ${GITHUB_USERNAME:-tezball}
      JENKINS_GITHUB_TOKEN: ${JENKINS_GITHUB_TOKEN:-changeme}
      HOST_REPO: ${PWD}
      JENKINS_CI_ROOT: ${JENKINS_CI_ROOT:-${PWD}/../my-island-ci}
      JAVA_OPTS: >-
        -Djenkins.install.runSetupWizard=false
        -Dcasc.jenkins.config=/var/jenkins_home/casc_configs
    ports:
      - "8085:8080"
    volumes:
      - ops_jenkins:/var/jenkins_home
      - ./ops/jenkins/casc:/var/jenkins_home/casc_configs:ro
      - ./ops/jenkins/casc/jobs:/var/jenkins_casc_jobs:ro
      - ${PWD}:${PWD}
      - ${JENKINS_CI_ROOT:-${PWD}/../my-island-ci}:${JENKINS_CI_ROOT:-${PWD}/../my-island-ci}
      - /var/run/docker.sock:/var/run/docker.sock
      # VPS key stays on the mini (MOCK_PROD_SSH_KEY_PATH in .env). Same path inside
      # the controller so deploy-mock-prod.sh can read it. Unset → harmless file mount.
      - ${MOCK_PROD_SSH_KEY_PATH:-./ops/jenkins/plugins.txt}:${MOCK_PROD_SSH_KEY_PATH:-/tmp/mock-prod-ssh-key-unset}:ro
    # Local-only: docker.sock access. Do not expose this pattern on a shared host.
    group_add:
      - "${DOCKER_GID:-0}"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/login >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    restart: unless-stopped

volumes:
  ops_pg:
  ops_grafana:
  ops_jenkins:
  web_nm:
  ops_m2:
  ops_npm:
