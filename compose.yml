name: island-mvp

services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: island
      POSTGRES_PASSWORD: island
      POSTGRES_DB: island
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U island"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    environment:
      JDBC_URL: jdbc:postgresql://db:5432/island
      JDBC_USER: island
      JDBC_PASSWORD: island
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
