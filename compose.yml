name: island-mvp

services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: island
      POSTGRES_PASSWORD: island
      POSTGRES_DB: island
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U island"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    environment:
      JDBC_URL: jdbc:postgresql://db:5432/island
      JDBC_USER: island
      JDBC_PASSWORD: island
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
  prometheus:
    image: prom/prometheus:v3.2.1
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./ops/observe/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/observe/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./ops/observe/alerts.yml:/etc/prometheus/alerts.yml:ro
  loki:
    image: grafana/loki:3.4.2
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
  promtail:
    image: grafana/promtail:3.4.2
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./ops/observe/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
  grafana:
    image: grafana/grafana-oss:11.6.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./ops/observe/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    depends_on:
      - prometheus
      - loki
      - alertmanager
  grafana-mcp:
    image: grafana/mcp-grafana:latest
    environment:
      GRAFANA_URL: http://grafana:3000
      GRAFANA_USAGE_STATS: disabled
    env_file:
      - ops/observe/grafana-mcp.env
    command:
      - -t
      - streamable-http
      - -address
      - 0.0.0.0:8000
      - -allowed-hosts
      - "*"
      - -usage-stats
      - disabled
      - -disable-write
    ports:
      - "8000:8000"
    depends_on:
      - grafana
  alertmanager:
    image: prom/alertmanager:v0.28.1
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./ops/observe/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
