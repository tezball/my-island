name: island-mvp

services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: island
      POSTGRES_PASSWORD: island
      POSTGRES_DB: island
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U island"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    environment:
      JDBC_URL: jdbc:postgresql://db:5432/island
      JDBC_USER: island
      JDBC_PASSWORD: island
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
  prometheus:
    image: prom/prometheus:v3.2.1
    volumes:
      - ./ops/observe/prometheus.yml:/etc/prometheus/prometheus.yml:ro
  loki:
    image: grafana/loki:3.4.2
    command: -config.file=/etc/loki/local-config.yaml
  grafana:
    image: grafana/grafana-oss:11.6.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./ops/observe/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    depends_on:
      - prometheus
      - loki
      - alertmanager
  alertmanager:
    image: prom/alertmanager:v0.28.1
    volumes:
      - ./ops/observe/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
