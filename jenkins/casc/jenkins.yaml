jenkins:
  systemMessage: |
    My Island CI/CD — PRs are AI-reviewed, autofixed, approved, and merged.
    Green main auto-deploys with confirm-prod. Manual job "my-island" still exists.
  numExecutors: 2
  mode: NORMAL
  scmCheckoutRetryCount: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID:-admin}"
          password: "${JENKINS_ADMIN_PASSWORD:-admin}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
  globalNodeProperties:
    - envVars:
        env:
          - key: MY_ISLAND_GIT_URL
            value: "${MY_ISLAND_GIT_URL:-https://github.com/tezball/my-island.git}"
          - key: MY_ISLAND_GIT_BRANCH
            value: "${MY_ISLAND_GIT_BRANCH:-main}"
          - key: PROD_ENV_FILE
            value: "${PROD_ENV_FILE:-/run/secrets/env.prod}"
          - key: CONFIRM_BASE_URL
            value: "${CONFIRM_BASE_URL:-http://host.docker.internal:80}"
          - key: LOCAL_REPO
            value: "/var/my-island"
          - key: GITHUB_REPO
            value: "${GITHUB_REPO:-tezball/my-island}"
          - key: OLLAMA_BASE_URL
            value: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
          - key: OLLAMA_MODEL
            value: "${OLLAMA_MODEL:-llama3.2}"
          - key: AUTO_MERGE_PRS
            value: "${AUTO_MERGE_PRS:-true}"
          - key: AUTO_DEPLOY_MAIN
            value: "${AUTO_DEPLOY_MAIN:-true}"

credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: github-token
              secret: "${GITHUB_TOKEN:-}"
              description: GitHub PAT for PR scan, AI review comments, and squash-merge
          - usernamePassword:
              scope: GLOBAL
              id: github-pat
              username: "${GITHUB_USER:-tezball}"
              password: "${GITHUB_TOKEN:-}"
              description: GitHub username + PAT for Branch Source

unclassified:
  location:
    url: "${JENKINS_URL:-http://localhost:8088/}"
  timestamper:
    allPipelines: true
  gitHubPluginConfig:
    hookUrl: "${JENKINS_URL:-http://localhost:8088/}github-webhook/"

jobs:
  - script: |
      pipelineJob('my-island') {
        description('Manual: build → test → (optional) E2E → deploy prod → confirm. Use SOURCE=local for the bind-mounted repo.')
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url(System.getenv('MY_ISLAND_GIT_URL') ?: 'file:///var/my-island')
                }
                branches('*/main', '**')
                extensions {
                  cleanBeforeCheckout()
                  localBranch()
                }
              }
            }
            scriptPath('Jenkinsfile')
            lightweight(false)
          }
        }
        properties {
          disableConcurrentBuilds()
        }
      }

      def token = System.getenv('GITHUB_TOKEN')
      if (token != null && !token.trim().isEmpty()) {
        def ownerRepo = (System.getenv('GITHUB_REPO') ?: 'tezball/my-island').split('/')
        def owner = ownerRepo[0]
        def repo = ownerRepo.length > 1 ? ownerRepo[1] : 'my-island'
        multibranchPipelineJob('my-island-github') {
          displayName('My Island (GitHub PRs + main)')
          description('On every PR: CI + Ollama AI review + autofix + approve + squash-merge. On main: auto-deploy + confirm-prod.')
          branchSources {
            github {
              id('tezball-my-island')
              repoOwner(owner)
              repository(repo)
              scanCredentialsId('github-pat')
              buildOriginBranch(true)
              buildOriginBranchWithPR(false)
              buildOriginPRHead(true)
              buildOriginPRMerge(false)
              buildForkPRHead(false)
              buildForkPRMerge(false)
            }
          }
          factory {
            workflowBranchProjectFactory {
              scriptPath('Jenkinsfile')
            }
          }
          orphanedItemStrategy {
            discardOldItems {
              daysToKeep(14)
              numToKeep(30)
            }
          }
          triggers {
            periodicFolderTrigger {
              interval('2 minutes')
            }
          }
        }
      }
