app:
  env: ${APP_ENV:local}
  seed-publish: ${APP_SEED_PUBLISH:false}

spring:
  application:
    name: catalog
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5433/catalog}
    username: ${SPRING_DATASOURCE_USERNAME:ops}
    password: ${SPRING_DATASOURCE_PASSWORD:ops}
  flyway:
    enabled: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never
    timeout: 30d
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SERVER_SERVLET_SESSION_COOKIE_SECURE:false}

google:
  client-id: ${GOOGLE_CLIENT_ID:}
  client-secret: ${GOOGLE_CLIENT_SECRET:}

catalog:
  mail:
    mode: ${CATALOG_MAIL_MODE:log}
    from: ${CATALOG_MAIL_FROM:noreply@localhost}
    public-origin: ${APP_PUBLIC_ORIGIN:http://localhost:5173}
  auth:
    google:
      stub-enabled: false
  import:
    key: ${CATALOG_IMPORT_KEY:}
  seed:
    guest:
      username: ${CATALOG_SEED_GUEST_USERNAME:}
      password: ${CATALOG_SEED_GUEST_PASSWORD:}
      email: ${CATALOG_SEED_GUEST_EMAIL:guest@local.test}

info:
  app:
    service: catalog
    version: ${APP_VERSION:0.0.1-SNAPSHOT}
    env: ${APP_ENV:local}
    gitCommit: ${GIT_COMMIT:unknown}
    gitCommitShort: ${GIT_COMMIT_SHORT:unknown}
    gitBranch: ${GIT_BRANCH:unknown}
    buildTime: ${APP_BUILD_TIME:unknown}

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
    access:
      default: unrestricted
  info:
    env:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true

chaos:
  monkey:
    enabled: false
    assaults:
      kill-application-active: false

logging:
  structured:
    format:
      console: logstash
