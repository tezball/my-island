app:
  env: ${APP_ENV:local}
  seed-publish: ${APP_SEED_PUBLISH:false}

spring:
  application:
    name: catalog
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5433/catalog}
    username: ${SPRING_DATASOURCE_USERNAME:ops}
    password: ${SPRING_DATASOURCE_PASSWORD:ops}
  flyway:
    enabled: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never
    timeout: 30d

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SERVER_SERVLET_SESSION_COOKIE_SECURE:false}

google:
  client-id: ${GOOGLE_CLIENT_ID:}
  client-secret: ${GOOGLE_CLIENT_SECRET:}

catalog:
  auth:
    google:
      stub-enabled: false

info:
  app:
    service: catalog
    version: ${APP_VERSION:0.0.1-SNAPSHOT}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
    access:
      default: unrestricted
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true

chaos:
  monkey:
    enabled: false
    assaults:
      kill-application-active: false

logging:
  structured:
    format:
      console: logstash
