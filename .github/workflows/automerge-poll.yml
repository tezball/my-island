# Hourly backstop for the same gate as automerge.yml (ops/scripts/gha_review_gate.py).
# The fast path is check_run / workflow_run / a non-author review, not this poll.
# A missed webhook can still merge. This poll does not run the four test jobs.
# It does not merge origin/main unless that pass is about to squash.
name: Automerge poll

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

# actions: write lets GITHUB_TOKEN dispatch ci.yml. After squash that ref is
# main. After a behind or dirty merge it is the pull request head branch.
# This workflow does not run the four test jobs.
permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  actions: write
  statuses: write

concurrency:
  group: automerge-poll
  cancel-in-progress: false

jobs:
  poll:
    name: poll ready pull requests
    runs-on: ubuntu-latest
    steps:
      # Gate script from main — do not execute a pull request tree.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Squash-merge if the review gate already passed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AUTOMERGE_POLL: "1"
        run: python3 ops/scripts/gha_review_gate.py
