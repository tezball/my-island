name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: python3 -m pip install -r ops/tests/requirements.txt
      - name: Pytest (no stack)
        run: python3 -m pytest ops/tests -q -m "not stack"

  catalog:
    name: catalog tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: services/catalog/pom.xml
      - name: Catalog tests
        working-directory: services/catalog
        run: ./mvnw -B test

  stack:
    name: compose stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose
        run: ./scripts/dev config
      - name: Build workspace image
        run: docker compose build workspace
      - name: Start stack
        env:
          SKIP_JENKINS: "1"
        run: ./scripts/dev up
      - name: Pytest in workspace (including stack)
        env:
          REQUIRE_STACK: "1"
          DEV_TEST_IN_WORKSPACE: "1"
          SKIP_JENKINS: "1"
        run: ./scripts/dev test
      - name: Compose diagnostics
        if: failure()
        run: docker compose ps && docker compose logs --no-color --tail=120

  # CEO 2026-09-12 (WF-025): no prod; ready PRs merge themselves.
  automerge:
    name: auto-review approve merge
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: [unit, catalog, stack]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Approve and squash-merge
        uses: actions/github-script@v7
        with:
          script: |
            const pull_number = context.payload.pull_request.number;
            const { owner, repo } = context.repo;
            try {
              await github.rest.pulls.createReview({
                owner,
                repo,
                pull_number,
                event: 'APPROVE',
                body: 'CI unit + catalog + stack green. Auto-approved (WF-025 / CEO 2026-09-12: no prod; ready PRs merge themselves).',
              });
            } catch (error) {
              core.warning(`approve skipped: ${error.message}`);
            }
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number });
            if (pr.merged) {
              core.info('already merged');
              return;
            }
            if (pr.draft) {
              core.info('draft — skip');
              return;
            }
            if (pr.head.repo.full_name !== `${owner}/${repo}`) {
              core.info('fork — skip');
              return;
            }
            await github.rest.pulls.merge({
              owner,
              repo,
              pull_number,
              merge_method: 'squash',
              sha: pr.head.sha,
            });
