name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: python3 -m pip install -r ops/tests/requirements.txt
      - name: Pytest (no stack)
        run: python3 -m pytest ops/tests -q -m "not stack"

  stack:
    name: compose stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose
        run: ./scripts/dev config
      - name: Build workspace image
        run: docker compose build workspace
      - name: Start stack
        run: ./scripts/dev up
      - name: Pytest in workspace (including stack)
        env:
          REQUIRE_STACK: "1"
          DEV_TEST_IN_WORKSPACE: "1"
        run: ./scripts/dev test
      - name: Compose diagnostics
        if: failure()
        run: docker compose ps && docker compose logs --no-color --tail=120
