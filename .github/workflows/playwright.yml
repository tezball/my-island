name: Playwright

# WF-011: browser lane is cron + manual dispatch. Not a merge gate.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  playwright:
    name: playwright cron
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Playwright
        working-directory: web
        run: npm ci && npx playwright install --with-deps chromium
      - name: Explore on fishing-journals.com
        working-directory: web
        env:
          PLAYWRIGHT_BASE_URL: https://fishing-journals.com
        run: npx playwright test
