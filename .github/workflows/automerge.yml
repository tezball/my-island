# WF-050: squash-merge AFTER workflow CI has completed successfully.
# Separate workflow name so pull_request_review cannot cancel in-flight
# unit / catalog / web / stack. Do not add this job as a required check.
# Actions must not approve PRs. Chat never gh pr merge.
name: Automerge

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  pull_request_review:
    types: [submitted]

concurrency:
  group: automerge-${{ github.event.workflow_run.head_sha || github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  automerge:
    name: automerge
    if: >
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      ) || (
        github.event_name == 'pull_request_review' &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
      checks: read
    steps:
      # Gate script from main — do not execute the PR tree on workflow_run.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Squash-merge if valid APPROVED
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
          AUTOMERGE_CHECKS_GREEN: ${{ github.event_name == 'workflow_run' && '1' || '0' }}
        run: python3 ops/scripts/gha_review_gate.py
