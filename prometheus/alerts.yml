groups:
  - name: my-island-api
    rules:
      # max() so a dead host.docker.internal scrape does not fire when the compose API is healthy
      - alert: ApiDown
        expr: max(up{service="api"}) == 0
        for: 1m
        labels:
          severity: critical
          service: api
        annotations:
          summary: "My Island API scrape target is down"
          description: "No Prometheus scrape of the API is succeeding."

      - alert: ApiHighHttpServerErrors
        expr: |
          (
            sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(http_server_requests_seconds_count[5m])), 0.001)
          ) > 0.05
        for: 5m
        labels:
          severity: warning
          service: api
        annotations:
          summary: "Elevated 5xx rate on My Island API"
          description: "HTTP 5xx rate is above 5% over 5 minutes."
