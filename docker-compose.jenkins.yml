# Jenkins CI/CD for My Island
# Co-hosted beside the app. Uses host Docker socket to build, test (Testcontainers),
# deploy docker-compose.prod.yml, and confirm production health.
#
# Start:
#   cp .env.prod.example .env.prod   # fill secrets before deploy stages
#   docker compose -f docker-compose.jenkins.yml up -d --build
#   open http://localhost:8088  (admin / see JENKINS_ADMIN_PASSWORD)

services:
  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    container_name: myisland-jenkins
    restart: unless-stopped
    ports:
      - "${JENKINS_HTTP_PORT:-8088}:8080"
      - "${JENKINS_AGENT_PORT:-50000}:50000"
    environment:
      JAVA_OPTS: >-
        -Djenkins.install.runSetupWizard=false
        -Dhudson.plugins.git.GitSCM.ALLOW_LOCAL_CHECKOUT=true
      CASC_JENKINS_CONFIG: /var/jenkins_home/casc_configs
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:-admin}
      MY_ISLAND_GIT_URL: ${MY_ISLAND_GIT_URL:-file:///var/my-island}
      MY_ISLAND_GIT_BRANCH: ${MY_ISLAND_GIT_BRANCH:-main}
      PROD_COMPOSE_FILE: docker-compose.prod.yml
      PROD_ENV_FILE: /run/secrets/env.prod
      CONFIRM_BASE_URL: ${CONFIRM_BASE_URL:-http://host.docker.internal:${WEB_PORT:-80}}
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - jenkins_home:/var/jenkins_home
      - ./jenkins/casc:/var/jenkins_home/casc_configs:ro
      - /var/run/docker.sock:/var/run/docker.sock
      # Bind the repo so Pipeline can use SOURCE=local and compose files
      - ./:/var/my-island
      # Prod secrets for deploy stage (see scripts/start-jenkins.sh)
      - ./jenkins/secrets/env.prod:/run/secrets/env.prod:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    group_add:
      # Host docker.sock group; scripts/start-jenkins.sh exports DOCKER_GID
      - "${DOCKER_GID:-999}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/login >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

volumes:
  jenkins_home:
