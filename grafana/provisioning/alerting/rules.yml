apiVersion: 1

groups:
  - orgId: 1
    name: my-island-api
    folder: My Island
    interval: 1m
    rules:
      - uid: api_down_grafana
        title: API down (Grafana)
        condition: C
        for: 1m
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: My Island API is unreachable
          description: Prometheus reports the API target as down for more than 1 minute.
        labels:
          severity: critical
          service: api
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: A
              expr: max(up{service="api"})
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    type: last
                    params: []
                  type: query
