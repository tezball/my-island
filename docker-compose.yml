services:
  postgres:
    image: postgres:17-alpine
    container_name: myisland-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: myisland
      POSTGRES_USER: myisland
      POSTGRES_PASSWORD: myisland_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U myisland -d myisland" ]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: myisland-mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:8025/api/v1/messages" ]
      interval: 10s
      timeout: 5s
      retries: 3

  ollama:
    image: ollama/ollama
    container_name: myisland-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:11434/api/tags" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  ollama-pull:
    image: ollama/ollama
    container_name: myisland-ollama-pull
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: [ "ollama", "pull", "llama3.2" ]
    environment:
      OLLAMA_HOST: http://ollama:11434
    restart: "no"

  api:
    build:
      context: ./my-island-api
      dockerfile: Dockerfile
    container_name: myisland-api
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/myisland
      SPRING_DATASOURCE_USERNAME: myisland
      SPRING_DATASOURCE_PASSWORD: myisland_dev_password
      JWT_SECRET: myisland-dev-jwt-secret-key-that-is-at-least-256-bits-long
      UPLOAD_DIR: /app/uploads
      OLLAMA_ENABLED: "true"
      OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/api/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  api-native:
    build:
      context: ./my-island-api
      dockerfile: Dockerfile.native
    container_name: myisland-api-native
    profiles:
      - native
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/myisland
      SPRING_DATASOURCE_USERNAME: myisland
      SPRING_DATASOURCE_PASSWORD: myisland_dev_password
      JWT_SECRET: myisland-dev-jwt-secret-key-that-is-at-least-256-bits-long
      UPLOAD_DIR: /app/uploads
      OLLAMA_ENABLED: "true"
      OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/api/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build:
      context: ./my-island-web
      dockerfile: Dockerfile.dev
    container_name: myisland-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:5173"
    volumes:
      - ./my-island-web:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:8080/api

  grafana:
    image: grafana/grafana:latest
    container_name: myisland-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
      - loki

  prometheus:
    image: prom/prometheus:latest
    container_name: myisland-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'

  loki:
    image: grafana/loki:latest
    container_name: myisland-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml

volumes:
  postgres_data:
  uploads_data:
  grafana_data:
  ollama_data:
