services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      # Mount source for hot reload
      - .:/app
      # Prevent node_modules from being overwritten by mount
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_USE_MSW=true