services:
  postgres:
    image: postgres:17-alpine
    container_name: myisland-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: myisland
      POSTGRES_USER: myisland
      POSTGRES_PASSWORD: myisland_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U myisland -d myisland" ]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: myisland-mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:8025/api/v1/messages" ]
      interval: 10s
      timeout: 5s
      retries: 3

  ollama:
    image: ollama/ollama
    container_name: myisland-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  ollama-pull:
    image: ollama/ollama
    container_name: myisland-ollama-pull
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: [ "ollama", "pull", "llama3.2" ]
    environment:
      OLLAMA_HOST: http://ollama:11434
    restart: "no"

  api:
    build:
      context: ./my-island-api
      dockerfile: Dockerfile
    container_name: myisland-api
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/myisland
      SPRING_DATASOURCE_USERNAME: myisland
      SPRING_DATASOURCE_PASSWORD: myisland_dev_password
      JWT_SECRET: myisland-dev-jwt-secret-key-that-is-at-least-256-bits-long
      UPLOAD_DIR: /app/uploads
      LOGGING_LOKI_URL: http://loki:3100/loki/api/v1/push
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/api/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  api-native:
    build:
      context: ./my-island-api
      dockerfile: Dockerfile.native
    container_name: myisland-api-native
    profiles:
      - native
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/myisland
      SPRING_DATASOURCE_USERNAME: myisland
      SPRING_DATASOURCE_PASSWORD: myisland_dev_password
      JWT_SECRET: myisland-dev-jwt-secret-key-that-is-at-least-256-bits-long
      UPLOAD_DIR: /app/uploads
      LOGGING_LOKI_URL: http://loki:3100/loki/api/v1/push
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/api/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  moderator:
    build:
      context: ./my-island-moderator
      dockerfile: Dockerfile
    container_name: myisland-moderator
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/myisland
      SPRING_DATASOURCE_USERNAME: myisland
      SPRING_DATASOURCE_PASSWORD: myisland_dev_password
      OLLAMA_BASE_URL: http://ollama:11434
    healthcheck:
      test: [ "CMD-SHELL", "pgrep -f 'java.*app.jar'" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  web:
    build:
      context: ./my-island-web
      dockerfile: Dockerfile.dev
    container_name: myisland-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:5173"
    volumes:
      - ./my-island-web:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:8080/api

  grafana:
    image: grafana/grafana:11.5.2
    container_name: myisland-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_UNIFIED_ALERTING_ENABLED: "true"
      GF_ALERTING_ENABLED: "false"
      GF_FEATURE_TOGGLES_ENABLE: provisioning
    depends_on:
      - prometheus
      - loki
      - alertmanager

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: myisland-prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    depends_on:
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: myisland-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--web.external-url=http://localhost:9093"

  loki:
    image: grafana/loki:3.4.2
    container_name: myisland-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml

volumes:
  postgres_data:
  uploads_data:
  grafana_data:
  ollama_data:
  prometheus_data:
  alertmanager_data:
