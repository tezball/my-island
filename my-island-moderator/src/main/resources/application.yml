spring:
  application:
    name: my-island-moderator

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/myisland}
    username: ${SPRING_DATASOURCE_USERNAME:myisland}
    password: ${SPRING_DATASOURCE_PASSWORD:myisland_dev_password}
    driver-class-name: org.postgresql.Driver

  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:llama3.2}
          temperature: 0.1

logging:
  level:
    com.myisland.moderator: INFO
